<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | CropGuard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<script>
    document.addEventListener('DOMContentLoaded', () => {
        fetch('../../api/auth/session_check.php').then(res => res.json()).then(data => {
            if (data.status !== 'active') {
                window.location.href = '../../auth.html';
            } else {
                document.getElementById('sidebarName').innerText = data.user.fullname;
                document.getElementById('sidebarRole').innerText = data.role;
                document.getElementById('sidebarInitial').innerText = data.user.fullname.charAt(0).toUpperCase();
                setupBackButton(data.role);
                loadProfile(data.user.id);
            }
        }).catch(() => window.location.href = '../../auth.html');
    });
</script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f0f2f0; }
        .sidebar-link { transition: all 0.2s ease; border-left: 3px solid transparent; }
        .sidebar-link.active { background: rgba(255,255,255,0.12); border-left-color: #f1c40f; }
        .sidebar-link:not(.active):hover { background: rgba(255,255,255,0.06); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
        .input-field {
            width: 100%; padding: 12px 16px;
            background: #f8fafc; border: 1.5px solid #e2e8f0;
            border-radius: 12px; font-size: 0.875rem;
            outline: none; transition: all 0.2s; color: #1e293b;
        }
        .input-field:focus { border-color: #11542e; box-shadow: 0 0 0 3px rgba(17,84,46,0.08); }
        .input-field:disabled { background: #f1f5f9; color: #94a3b8; cursor: not-allowed; }
    </style>
</head>
<body class="h-screen flex overflow-hidden">

    <aside class="bg-[#11542e] w-64 min-h-screen flex flex-col shadow-2xl z-30 flex-shrink-0">
        <div class="p-6 border-b border-white/10 flex flex-col items-center gap-3">
            <div class="w-16 h-16 rounded-full bg-white/10 flex items-center justify-center border-2 border-white/20">
                <i class="fa-solid fa-wheat-awn text-2xl text-[#f1c40f]"></i>
            </div>
            <div class="text-center">
                <h1 class="text-white text-base font-black tracking-tight">CropGuard</h1>
                <p class="text-white/40 text-[8px] uppercase tracking-[0.2em]">DA Region X</p>
            </div>
        </div>

        <nav class="flex-1 px-3 py-6 space-y-1 overflow-y-auto">
            <a id="backBtn" href="#" class="sidebar-link flex items-center px-4 py-3 text-white/60 hover:text-white rounded-xl text-sm transition-all">
                <i class="fa-solid fa-arrow-left mr-3 w-4"></i> Back to Dashboard
            </a>
            <a href="#" class="sidebar-link active flex items-center px-4 py-3 text-white rounded-xl font-semibold text-sm">
                <i class="fa-solid fa-user-circle mr-3 w-4 text-[#f1c40f]"></i> My Profile
            </a>
        </nav>

        <div class="p-4 border-t border-white/10">
            <div class="flex items-center gap-3 bg-white/5 px-3 py-3 rounded-2xl">
                <div id="sidebarInitial" class="w-9 h-9 bg-[#f1c40f]/20 text-[#f1c40f] rounded-full flex items-center justify-center font-black text-sm flex-shrink-0">?</div>
                <div class="overflow-hidden flex-1">
                    <p id="sidebarName" class="text-white text-xs font-bold truncate">Loading...</p>
                    <p id="sidebarRole" class="text-white/40 text-[10px]">—</p>
                </div>
                <button onclick="confirmLogout()" class="text-white/30 hover:text-red-400 transition-all">
                    <i class="fa-solid fa-right-from-bracket text-sm"></i>
                </button>
            </div>
        </div>
    </aside>

    <div class="flex-1 flex flex-col h-screen overflow-hidden">
        <header class="h-16 flex items-center justify-between px-8 bg-white border-b border-gray-100 flex-shrink-0">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-user-circle text-[#11542e] text-lg"></i>
                <span class="text-base font-black text-gray-800 tracking-tight">My Profile</span>
            </div>
            <span class="text-xs text-gray-400 font-bold uppercase tracking-widest">Account Settings</span>
        </header>

        <main class="flex-1 overflow-y-auto p-8 custom-scrollbar">
            <div class="max-w-3xl mx-auto space-y-6">

                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">

                    <div class="bg-gradient-to-r from-[#11542e] to-[#1a7a42] h-28 relative">
                        <div class="absolute -bottom-10 left-8">
                            <div id="avatarCircle" class="w-20 h-20 rounded-full bg-white border-4 border-white shadow-lg flex items-center justify-center text-[#11542e] font-black text-3xl">
                                ?
                            </div>
                        </div>
                    </div>

                    <div class="pt-14 px-8 pb-6 border-b border-gray-100">
                        <h2 id="profileDisplayName" class="text-xl font-black text-gray-800">Loading...</h2>
                        <div class="flex items-center gap-2 mt-1">
                            <span id="profileRoleBadge" class="bg-green-100 text-green-700 text-[10px] font-black uppercase tracking-widest px-3 py-1 rounded-full">—</span>
                            <span id="profileStatusBadge" class="bg-gray-100 text-gray-500 text-[10px] font-black uppercase tracking-widest px-3 py-1 rounded-full">—</span>
                        </div>
                    </div>

                    <div class="p-8 space-y-6">
                        <div>
                            <h3 class="text-xs font-black text-gray-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                                <i class="fa-solid fa-id-card text-[#11542e]"></i> Basic Information
                            </h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-[10px] font-black text-gray-400 uppercase mb-2">Full Name</label>
                                    <input type="text" id="inputFullname" class="input-field" placeholder="Your full name">
                                </div>
                                <div>
                                    <label class="block text-[10px] font-black text-gray-400 uppercase mb-2">Email Address</label>
                                    <input type="email" id="inputEmail" class="input-field" placeholder="your@email.com">
                                </div>
                                <div>
                                    <label class="block text-[10px] font-black text-gray-400 uppercase mb-2">Contact Number</label>
                                    <input type="text" id="inputContact" class="input-field" placeholder="09xxxxxxxxx">
                                </div>
                                <div>
                                    <label class="block text-[10px] font-black text-gray-400 uppercase mb-2">Role</label>
                                    <input type="text" id="inputRole" class="input-field" disabled>
                                </div>
                                <div id="rsbaField" class="hidden">
                                    <label class="block text-[10px] font-black text-gray-400 uppercase mb-2">RSBA Number</label>
                                    <input type="text" id="inputRSBA" class="input-field" placeholder="Not yet assigned" disabled>
                                    <p class="text-[10px] text-gray-400 mt-1">RSBSA number is assigned by the Administrator.</p>
                                </div>
                                <div id="areaField" class="hidden">
                                    <label class="block text-[10px] font-black text-gray-400 uppercase mb-2">Assigned Area</label>
                                    <input type="text" id="inputArea" class="input-field" placeholder="e.g. Balingasag">
                                </div>
                            </div>
                        </div>

                        <div class="border-t border-gray-100 pt-6">
                            <h3 class="text-xs font-black text-gray-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                                <i class="fa-solid fa-lock text-[#11542e]"></i> Change Password
                                <span class="text-gray-300 font-normal normal-case tracking-normal text-[10px]">— leave blank to keep current</span>
                            </h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div class="relative">
                                    <label class="block text-[10px] font-black text-gray-400 uppercase mb-2">New Password</label>
                                    <input type="password" id="inputPassword" class="input-field pr-10" placeholder="Enter new password">
                                    <button type="button" onclick="togglePassword('inputPassword','eyeIcon1')" class="absolute right-3 top-9 text-gray-400 hover:text-gray-600">
                                        <i id="eyeIcon1" class="fa-solid fa-eye text-sm"></i>
                                    </button>
                                </div>
                                <div class="relative">
                                    <label class="block text-[10px] font-black text-gray-400 uppercase mb-2">Confirm Password</label>
                                    <input type="password" id="inputConfirmPassword" class="input-field pr-10" placeholder="Confirm new password">
                                    <button type="button" onclick="togglePassword('inputConfirmPassword','eyeIcon2')" class="absolute right-3 top-9 text-gray-400 hover:text-gray-600">
                                        <i id="eyeIcon2" class="fa-solid fa-eye text-sm"></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="flex justify-end pt-2">
                            <button onclick="saveProfile()" class="bg-[#11542e] text-white px-8 py-3 rounded-xl font-bold text-sm shadow-md hover:bg-green-800 transition-all flex items-center gap-2">
                                <i class="fa-solid fa-floppy-disk"></i> Save Changes
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script>
        function setupBackButton(role) {
            const routes = {
                'Admin':      '../../views/masterfile/dashboard.html',
                'MAO':        '../../views/mao/index.html',
                'Technician': '../../views/technician/dashboard.html',
                'Farmer':     '../../views/farmers/index.html',
                'Encoder':    '../../views/encoder/dashboard.html'
            };
            document.getElementById('backBtn').href = routes[role] || '../../auth.html';

            if (role === 'Farmer') document.getElementById('rsbaField').classList.remove('hidden');
            if (role === 'Technician' || role === 'MAO') document.getElementById('areaField').classList.remove('hidden');
        }

        async function loadProfile(userId) {
            try {
                const res  = await fetch('../../api/profile/get_profile.php');
                const data = await res.json();
                if (data.status === 'success') {
                    const u = data.user;
                    const initial = u.Fullname.charAt(0).toUpperCase();
                    document.getElementById('avatarCircle').innerText       = initial;
                    document.getElementById('profileDisplayName').innerText = u.Fullname;
                    document.getElementById('profileRoleBadge').innerText   = u.Role;
                    document.getElementById('profileStatusBadge').innerText = u.STATUS ?? 'Active';

                    const badge = document.getElementById('profileStatusBadge');
                    badge.className = (u.STATUS ?? 'Active') === 'Active'
                        ? 'bg-green-100 text-green-700 text-[10px] font-black uppercase tracking-widest px-3 py-1 rounded-full'
                        : 'bg-red-100 text-red-600 text-[10px] font-black uppercase tracking-widest px-3 py-1 rounded-full';

                    document.getElementById('inputFullname').value = u.Fullname       ?? '';
                    document.getElementById('inputEmail').value    = u.Email          ?? '';
                    document.getElementById('inputContact').value  = u.Contact_Number ?? '';
                    document.getElementById('inputRole').value     = u.Role           ?? '';
                    document.getElementById('inputRSBA').value     = u.RSBA_No        ?? '';
                    document.getElementById('inputArea').value     = u.Assigned_Area  ?? '';
                }
            } catch (e) { console.error('Load profile failed', e); }
        }

        async function saveProfile() {
            const fullname = document.getElementById('inputFullname').value.trim();
            const email    = document.getElementById('inputEmail').value.trim();
            const contact  = document.getElementById('inputContact').value.trim();
            const rsba     = document.getElementById('inputRSBA').value.trim();
            const area     = document.getElementById('inputArea').value.trim();
            const password = document.getElementById('inputPassword').value;
            const confirm  = document.getElementById('inputConfirmPassword').value;

            if (!fullname || !email) {
                Swal.fire('Missing Fields', 'Full name and email are required.', 'warning');
                return;
            }
            if (password && password !== confirm) {
                Swal.fire('Password Mismatch', 'Passwords do not match.', 'error');
                return;
            }
            if (password && password.length < 6) {
                Swal.fire('Weak Password', 'Password must be at least 6 characters.', 'warning');
                return;
            }

            try {
                const res  = await fetch('../../api/profile/update_profile.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullname, email, contact, rsba, area, password })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    Swal.fire({ icon: 'success', title: 'Profile Updated!', text: 'Your changes have been saved.', confirmButtonColor: '#11542e' })
                        .then(() => location.reload());
                } else {
                    Swal.fire('Error', data.message || 'Update failed.', 'error');
                }
            } catch (e) {
                Swal.fire('Error', 'Server connection failed.', 'error');
            }
        }

        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon  = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        function confirmLogout() {
            Swal.fire({
                title: 'Sign Out?', text: 'Return to login screen.',
                icon: 'question', showCancelButton: true,
                confirmButtonColor: '#11542e', confirmButtonText: 'Logout'
            }).then(r => {
                if (r.isConfirmed)
                    fetch('../../api/auth/logout.php').then(() => window.location.href = '../../auth.html');
            });
        }
        // ── IDLE TIMEOUT: 5 minutes ───────────────────────────────────
        let idleTimer;
        function resetIdleTimer() {
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                Swal.fire({ icon: 'warning', title: 'Session Expired', text: 'You have been logged out due to 5 minutes of inactivity.', confirmButtonColor: '#11542e', allowOutsideClick: false })
                    .then(() => fetch('../../api/auth/logout.php').then(() => window.location.href = '../../auth.html'));
            }, 5 * 60 * 1000);
        }
        ['mousemove','keypress','click','scroll','touchstart','touchmove'].forEach(ev => document.addEventListener(ev, resetIdleTimer));
        resetIdleTimer();
    </script>
</body>
</html>
