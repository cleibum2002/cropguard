<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Communication | CropGuard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../../assets/js/i18n.js?v=1"></script>
    <script src="../../assets/js/session_guard.js?v=2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <script>
        const translations = {
            en: {
                title_messages: "Messages", search_placeholder: "Search users...",
                loading_users: "Loading users...", no_users: "No users found.",
                select_convo: "Select a conversation", select_convo_sub: "Choose a user from the left to start messaging",
                select_user_default: "Select a user", message_placeholder: "Type a message...",
                no_messages: "No messages yet. Say hello!",
                sw_session_expired_title: "Session Expired", sw_session_expired_text: "You have been logged out due to 5 minutes of inactivity."
            },
            tl: {
                title_messages: "Mga Mensahe", search_placeholder: "Maghanap ng users...",
                loading_users: "Nilo-load ang mga users...", no_users: "Walang nahanap na users.",
                select_convo: "Pumili ng usapan", select_convo_sub: "Pumili ng user sa kaliwa para magsimulang mag-message",
                select_user_default: "Pumili ng user", message_placeholder: "Mag-type ng mensahe...",
                no_messages: "Wala pang mensahe. Kumusta!",
                sw_session_expired_title: "Natapos na ang Session", sw_session_expired_text: "Na-log out ka dahil sa 5 minutong hindi paggamit."
            },
            ceb: {
                title_messages: "Mga Mensahe", search_placeholder: "Pangitaa ang mga users...",
                loading_users: "Ginaload ang mga users...", no_users: "Walay nakit-an nga users.",
                select_convo: "Pilia ang panag-istoryahanay", select_convo_sub: "Pilia og user sa wala para magsugod og message",
                select_user_default: "Pilia og user", message_placeholder: "Pag-type og mensahe...",
                no_messages: "Wala pay mensahe. Kumusta!",
                sw_session_expired_title: "Nahuman na ang Session", sw_session_expired_text: "Na-log out ka tungod sa 5 minutos nga walay kalihukan."
            }
        };

        // Open to any signed-in role. bfcache restores handled by session_guard.js.
        CropGuardSession.protect({
            onReady: (data) => {
                currentUserName = data.user.fullname;
                currentRole     = data.role;

                const initPage = () => {
                    document.getElementById('currentUserName').innerText = data.user.fullname;
                    document.getElementById('currentUserRole').innerText = data.role;
                    loadUsers();
                    if (data.role === 'Farmer') {
                        document.getElementById('langSwitcher').classList.remove('hidden');
                    } else {
                        // Just render this page in English for non-Farmer roles — do NOT
                        // touch localStorage here. cropguard_lang is shared across every
                        // Admin/MAO/Technician page now; clearing it here was wiping the
                        // user's saved language choice everywhere else in the system.
                        applyTranslations('en');
                    }
                };

                initPage();
            }
        });
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f0f2f0; }
        .user-item:hover { background-color: rgba(17,84,46,0.08); }
        .user-item.active { background-color: rgba(17,84,46,0.15); border-left: 3px solid #11542e; }
        .message-bubble { max-width: 70%; }
        @media (max-width: 767px) { .message-bubble { max-width: 85%; } }
        .chat-area { height: calc(100vh - 180px); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
        .lang-link { cursor: pointer; }
        .lang-link.lang-active { color: #f1c40f; text-decoration: underline; }
    </style>
</head>
<body class="h-[100dvh] flex overflow-hidden bg-[#f0f2f0]" style="display:none!important">

    <div class="flex w-full h-[100dvh]">

        <!-- LEFT PANEL: User List -->
        <div id="userListPanel" class="flex w-full md:w-80 bg-white border-r border-gray-100 flex-col md:flex flex-shrink-0 shadow-sm">
            
            <!-- Header -->
            <div class="p-4 border-b border-gray-100 bg-[#11542e]">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <button onclick="goBack()" class="text-white/60 hover:text-white transition-all">
                            <i class="fa-solid fa-arrow-left"></i>
                        </button>
                        <div>
                            <h2 class="text-white font-black text-sm" data-i18n="title_messages">Messages</h2>
                            <p id="currentUserName" class="text-white/50 text-[10px]">Loading...</p>
                        </div>
                    </div>
                    <div id="langSwitcher" class="hidden flex items-center gap-1.5 text-[10px] font-bold text-white/50 flex-shrink-0">
                        <span class="lang-link" data-lang="en" onclick="setLanguage('en')">EN</span>
                        <span>|</span>
                        <span class="lang-link" data-lang="tl" onclick="setLanguage('tl')">TL</span>
                        <span>|</span>
                        <span class="lang-link" data-lang="ceb" onclick="setLanguage('ceb')">CEB</span>
                    </div>
                </div>
            </div>

            <!-- Search -->
            <div class="p-3 border-b border-gray-50">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-300 text-xs"></i>
                    <input type="text" id="searchUser" onkeyup="filterUsers()" placeholder="Search users..."
                        class="w-full bg-gray-50 rounded-xl py-2 pl-8 pr-3 text-xs outline-none focus:ring-2 focus:ring-[#11542e]" data-i18n-placeholder="search_placeholder">
                </div>
            </div>

            <!-- User List -->
            <div id="userList" class="flex-1 overflow-y-auto custom-scrollbar">
                <div class="p-4 text-center text-gray-400 text-xs italic" data-i18n="loading_users">Loading users...</div>
            </div>

        </div>

        <!-- RIGHT PANEL: Chat Window -->
        <div id="rightPanel" class="hidden md:flex flex-1 flex-col w-full">

            <!-- No conversation selected -->
            <div id="noChatSelected" class="flex-1 flex flex-col items-center justify-center text-center p-8">
                <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mb-4">
                    <i class="fa-solid fa-message text-gray-300 text-3xl"></i>
                </div>
                <h3 class="text-gray-600 font-black text-lg mb-2" data-i18n="select_convo">Select a conversation</h3>
                <p class="text-gray-400 text-sm" data-i18n="select_convo_sub">Choose a user from the left to start messaging</p>
            </div>

            <!-- Chat Window -->
            <div id="chatWindow" class="flex-1 flex flex-col hidden">

                <!-- Chat Header -->
                <div class="h-16 bg-white border-b border-gray-100 flex items-center px-4 sm:px-6 gap-3 sm:gap-4 flex-shrink-0 shadow-sm">
                    <button onclick="closeChatMobile()" class="md:hidden w-8 h-8 flex-shrink-0 flex items-center justify-center text-gray-500 hover:text-[#11542e] -ml-1">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <div class="w-9 h-9 bg-[#11542e] text-white rounded-full flex items-center justify-center font-black text-sm flex-shrink-0" id="chatAvatar">?</div>
                    <div class="min-w-0">
                        <p id="chatName" class="text-sm font-black text-gray-800 truncate" data-i18n="select_user_default">Select a user</p>
                        <p id="chatRole" class="text-[10px] text-gray-400 uppercase font-bold"></p>
                    </div>
                </div>

                <!-- Messages Area -->
                <div id="messagesArea" class="flex-1 overflow-y-auto p-6 space-y-3 custom-scrollbar bg-[#f0f2f0]">
                </div>

                <!-- Message Input -->
                <div class="bg-white border-t border-gray-100 p-4 flex-shrink-0">
                    <div class="flex items-center gap-3">
                        <input type="text" id="messageInput" placeholder="Type a message..."
                            onkeydown="if(event.key==='Enter') sendMessage()"
                            class="flex-1 bg-gray-50 rounded-2xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-[#11542e] border border-gray-100" data-i18n-placeholder="message_placeholder">
                        <button onclick="sendMessage()" class="w-11 h-11 bg-[#11542e] text-white rounded-full flex items-center justify-center hover:bg-green-800 transition-all shadow-md">
                            <i class="fa-solid fa-paper-plane text-sm"></i>
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Hidden elements -->
    <span id="currentUserRole" class="hidden"></span>

    <script>
        let currentUserName = '';
        let currentRole     = '';
        let selectedUserId  = null;
        let selectedUserName = '';
        let allUsers        = [];
        let refreshInterval = null;

        async function loadUsers() {
            try {
                const res  = await fetch('../../api/messages/get_users.php');
                const data = await res.json();
                if (data.status === 'success') {
                    allUsers = data.data;
                    // Re-apply whatever's currently typed in the search box instead of
                    // overwriting it — this now also runs on a background timer, so it
                    // must not stomp on an active search while someone's typing.
                    const searchBox = document.getElementById('searchUser');
                    if (searchBox && searchBox.value.trim() !== '') {
                        filterUsers();
                    } else {
                        renderUsers(allUsers);
                    }
                    maybeAutoSelectFromQuery();
                }
            } catch(e) { console.error('Failed to load users', e); }
        }

        // Keep the conversation list itself live — so when a message arrives from
        // someone who is NOT the chat currently open, they still jump to the top
        // of the list without needing a manual page reload.
        setInterval(loadUsers, 5000);

        // "Message Admin" (MAO sidebar shortcut) links here as index.html?to=admin
        // so MAO officers land straight in a chat with an Admin instead of having
        // to find one in the user list themselves.
        let autoSelectHandled = false;
        function maybeAutoSelectFromQuery() {
            if (autoSelectHandled || selectedUserId) return;
            const target = new URLSearchParams(window.location.search).get('to');
            if (target && target.toLowerCase() === 'admin') {
                const admin = allUsers.find(u => u.role === 'Admin');
                if (admin) {
                    autoSelectHandled = true;
                    selectUser(admin.id, admin.name, admin.role);
                }
            } else if (target && target.toLowerCase() === 'mao') {
                const mao = allUsers.find(u => u.role === 'MAO');
                if (mao) {
                    autoSelectHandled = true;
                    selectUser(mao.id, mao.name, mao.role);
                }
            }
        }

        function renderUsers(users) {
            const list = document.getElementById('userList');
            if (!users.length) {
                list.innerHTML = '<div class="p-4 text-center text-gray-400 text-xs italic">' + t('no_users') + '</div>';
                return;
            }

            const roleColors = {
                'Admin':      'bg-amber-100 text-amber-700',
                'Farmer':     'bg-green-100 text-green-700',
                'Technician': 'bg-blue-100 text-blue-700',
                'MAO':        'bg-purple-100 text-purple-700',
            };

            list.innerHTML = users.map(u => {
                const initials = u.name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
                const roleBadge = roleColors[u.role] || 'bg-gray-100 text-gray-600';
                const unreadBadge = u.unread > 0 ? `<span class="w-5 h-5 bg-red-500 text-white rounded-full text-[9px] font-black flex items-center justify-center">${u.unread}</span>` : '';
                return `
                <div class="user-item p-3 cursor-pointer flex items-center gap-3 border-b border-gray-50 transition-all ${selectedUserId == u.id ? 'active' : ''}"
                     onclick="selectUser(${u.id}, '${u.name.replace(/'/g, "\\'")}', '${u.role}')">
                    <div class="w-10 h-10 bg-[#11542e] text-white rounded-full flex items-center justify-center font-black text-sm flex-shrink-0">${initials}</div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-black text-gray-800 truncate">${u.name}</p>
                        <span class="px-2 py-0.5 rounded-full text-[9px] font-black uppercase ${roleBadge}">${u.role}</span>
                    </div>
                    ${unreadBadge}
                </div>`;
            }).join('');
        }

        function filterUsers() {
            const q = document.getElementById('searchUser').value.toLowerCase();
            renderUsers(allUsers.filter(u => u.name.toLowerCase().includes(q) || u.role.toLowerCase().includes(q)));
        }

        function selectUser(id, name, role) {
            selectedUserId   = id;
            selectedUserName = name;

            // Update chat header
            document.getElementById('chatName').innerText   = name;
            document.getElementById('chatRole').innerText   = role;
            document.getElementById('chatAvatar').innerText = name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();

            // Show chat window
            document.getElementById('noChatSelected').classList.add('hidden');
            document.getElementById('chatWindow').classList.remove('hidden');

            // Mobile: swap from the user list to a full-screen chat view.
            // md:flex/md:w-80 in the base classes keep desktop showing both
            // panels side by side regardless of these toggles.
            document.getElementById('userListPanel').classList.remove('flex');
            document.getElementById('userListPanel').classList.add('hidden');
            document.getElementById('rightPanel').classList.remove('hidden');
            document.getElementById('rightPanel').classList.add('flex');

            // Load messages
            loadMessages();

            // Refresh user list to clear unread badge
            loadUsers();

            // Start auto refresh
            if (refreshInterval) clearInterval(refreshInterval);
            refreshInterval = setInterval(loadMessages, 3000);
        }

        // Mobile only: the chat header's back arrow calls this to return to the
        // user list without leaving the Communication page. Has no effect on
        // desktop, since the user list is always visible there anyway.
        function closeChatMobile() {
            document.getElementById('rightPanel').classList.remove('flex');
            document.getElementById('rightPanel').classList.add('hidden');
            document.getElementById('userListPanel').classList.remove('hidden');
            document.getElementById('userListPanel').classList.add('flex');
            if (refreshInterval) { clearInterval(refreshInterval); refreshInterval = null; }
        }

        async function loadMessages() {
            if (!selectedUserId) return;
            try {
                const res  = await fetch(`../../api/messages/get_messages.php?user_id=${selectedUserId}`);
                const data = await res.json();
                if (data.status === 'success') {
                    renderMessages(data.data, data.current_user);
                }
            } catch(e) { console.error('Failed to load messages', e); }
        }

        function renderMessages(messages, currentUserId) {
            const area = document.getElementById('messagesArea');
            const wasAtBottom = area.scrollHeight - area.clientHeight <= area.scrollTop + 50;

            if (!messages.length) {
                area.innerHTML = '<div class="text-center text-gray-400 text-xs italic py-8">' + t('no_messages') + ' 👋</div>';
                return;
            }

            area.innerHTML = messages.map(m => {
                const isMe   = m.Sender_ID == currentUserId;
                const time   = new Date(m.Created_At).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const date   = new Date(m.Created_At).toLocaleDateString();

                return `
                <div class="flex ${isMe ? 'justify-end' : 'justify-start'}">
                    <div class="message-bubble">
                        ${!isMe ? `<p class="text-[10px] text-gray-400 font-bold mb-1 ml-1">${m.sender_name}</p>` : ''}
                        <div class="px-4 py-2.5 rounded-2xl ${isMe ? 'bg-[#11542e] text-white rounded-br-sm' : 'bg-white text-gray-800 rounded-bl-sm shadow-sm'}">
                            <p class="text-sm">${m.Message}</p>
                        </div>
                        <p class="text-[10px] text-gray-400 mt-1 ${isMe ? 'text-right mr-1' : 'ml-1'}">${time}</p>
                    </div>
                </div>`;
            }).join('');

            // Auto scroll to bottom
            if (wasAtBottom) area.scrollTop = area.scrollHeight;
        }

        async function sendMessage() {
            const input   = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message || !selectedUserId) return;

            input.value = '';

            try {
                await fetch('../../api/messages/send_message.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ receiver_id: selectedUserId, message })
                });
                loadMessages();
                loadUsers(); // move this conversation to the top of the list right away
            } catch(e) { console.error('Failed to send message', e); }
        }

        function goBack() {
            const role = currentRole.toLowerCase();
            const routes = {
                'admin':      '../masterfile/dashboard.html',
                'farmer':     '../farmers/index.html',
                'technician': '../technician/dashboard.html',
                'mao':        '../mao/index.html',
                'encoder':    '../encoder/dashboard.html',
        };
        window.location.href = routes[role] || '../../auth.html';
        }

        // The idle timeout lives in session_guard.js now.
    </script>
</body>
</html>
