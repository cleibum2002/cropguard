            filter_toggle_label: "Mga Filter",
            filter_all_types: "Lahat ng Uri", filter_all_severities: "Lahat ng Kalubhaan", filter_all_barangays: "Lahat ng Barangay",

    let currentReports = [];
    let activeTab = 'Pending';
    let currentDetailId = null; // tracks which report's detail panel is open, so we can re-render it on language switch

    document.addEventListener("DOMContentLoaded", async () => {
        await fetchReports();

        // Nothing about a report submission can be in the future, and nothing
        // predates CropGuard's own existence — bound both fields so the date
        // picker itself can't offer an impossible value.
        const todayStr = (() => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); })();
        const earliestStr = '2024-01-01';
        ['filterDateFrom', 'filterDateTo'].forEach(id => {
            const el = document.getElementById(id);
            el.max = todayStr;
            el.min = earliestStr;
        });

        // Deep link support: report_management.html?id=62 jumps straight to
        // that report's validation profile (used by the Dashboard's clickable
        // Recent Reports feed, and could be reused by the notification bell later).
        const deepLinkId = new URLSearchParams(window.location.search).get('id');
        if (deepLinkId) {
            setTab('All'); // make sure the report is visible regardless of its current status
            viewReport(parseInt(deepLinkId, 10));
        } else if (new URLSearchParams(window.location.search).get('tab') === 'all') {
            setTab('All'); // the Dashboard's "View all" link under Recent Reports
        }

        // Attached here instead of relying solely on the inline oninput="filterReports()"
        // attribute on the <input> tag - this guarantees the listener binds even if that
        // attribute is ever missing, misspelled, or stripped by an edit.
        const searchBox = document.getElementById('searchInput');
        if (searchBox) {
            searchBox.addEventListener('input', filterReports);
            searchBox.addEventListener('keyup', filterReports);
        } else {
            console.warn('searchInput element not found - search box will not filter.');
        }
    });

    // Called automatically by i18n.js whenever the user picks a new language
    function onLanguageChange() {
        populateFilterOptions(); // refresh "All Types" / "All Severities" / "All Barangays" text
        filterReports(); // re-renders the list with translated status badges
        if (currentDetailId) {
            viewReport(currentDetailId); // re-fetch & rebuild the open detail panel in the new language
        } else {
            clearDetailPanel();
        }
        loadMaoNotifications();
    }

    // Farmer/Technician free text is spliced into innerHTML templates below -
    // must be rendered as literal text, never parsed as markup.
    function escapeHtml(s) {
        return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    // How far from the farmer's registered farm still counts as "at the farm".
    // Deliberately generous: GPS drifts badly under tree cover and in bad weather,
    // and these coordinates are proof of presence, not a fence. A photo outside
    // the radius is flagged for a human to judge, never rejected. Same helper
    // lives in views/masterfile/dashboard.html.
    const GEO_AT_FARM_METRES = 500;

    function geoProofLabel(img, farmLat, farmLng) {
        if (img.geo_lat === null || img.geo_lat === undefined ||
            img.geo_lng === null || img.geo_lng === undefined) {
            return { cls: 'no-geo', text: t('geo_no_gps_recorded') };
        }
        if (farmLat === null || farmLat === undefined ||
            farmLng === null || farmLng === undefined) {
            return { cls: '', text: t('geo_farm_not_registered') };
        }

        // Haversine. DECIMAL columns arrive as strings in JSON, hence Number().
        const lat = Number(img.geo_lat), lng = Number(img.geo_lng);
        const fLat = Number(farmLat),    fLng = Number(farmLng);
        const R = 6371000, rad = d => d * Math.PI / 180;
        const dLat = rad(lat - fLat), dLng = rad(lng - fLng);
        const a = Math.sin(dLat / 2) ** 2 +
                  Math.cos(rad(fLat)) * Math.cos(rad(lat)) * Math.sin(dLng / 2) ** 2;
        const metres = Math.round(2 * R * Math.asin(Math.sqrt(a)));
        const pretty = metres < 1000 ? `${metres} m` : `${(metres / 1000).toFixed(1)} km`;

        return metres <= GEO_AT_FARM_METRES
            ? { cls: 'geotagged', text: t('geo_at_farm').replace('{d}', pretty) }
            : { cls: 'no-geo',    text: t('geo_away_from_farm').replace('{d}', pretty) };
    }

    // Translates the status word used in badges and the "locked" message
    function reportStatusLabel(status) {
        const map = { Pending: 'status_pending', Validated: 'status_validated', Inspected: 'status_inspected', Approved: 'status_approved', Rejected: 'status_rejected' };
        const key = map[status];
        return key ? t(key) : status;
    }

    async function fetchReports() {
        try {
            const res = await fetch('../../api/masterfile/damage_report/get_all.php');
            const data = await res.json();
            if (data.status === 'success') {
                currentReports = data.data.map(r => ({
                    ...r,
                    // Normalize the ID just in case PHP aliases it differently
                    normalizedId: r.Damage_Report_ID || r.id, 
                    displayStatus: r.status ? (r.status.charAt(0).toUpperCase() + r.status.slice(1).toLowerCase()) : 'Pending'
                })).filter(r => r.displayStatus !== 'Archived');
                populateFilterOptions();
                filterReports(); 
            }
        } catch (err) { console.error("Fetch Error:", err); }
    }

    // Same convention already used on the MAO Reports page: the stored Barangay
    // field is a full free-text address ("Linabu, Balingasag, Misamis Oriental...")
    // but the actual barangay name is always the first comma-separated segment.
    function parseBarangay(raw) {
        if (!raw) return '';
        return raw.split(',')[0].trim();
    }

    // Builds the 3 dropdown option lists straight from whatever data actually
    // exists, rather than a hardcoded list — this way nothing real ever goes
    // missing (e.g. legacy severity values like "Low" that current submission
    // forms don't even offer anymore) and no option ever matches zero reports.
    function populateFilterOptions() {
        const damageTypes = [...new Set(currentReports.map(r => r.damage_type).filter(Boolean))].sort();
        const severities  = [...new Set(currentReports.map(r => r.severity).filter(Boolean))].sort();
        const barangays   = [...new Set(currentReports.map(r => parseBarangay(r.barangay_raw)).filter(Boolean))].sort();

        fillSelect('filterDamageType', damageTypes, t('filter_all_types'));
        fillSelect('filterSeverity', severities, t('filter_all_severities'));
        fillSelect('filterBarangay', barangays, t('filter_all_barangays'));
        populateStatusFilter();
    }

    // Status filter only makes sense on the "All Reports" tab — the Pending
    // and Validated tabs already restrict the list to that one status.
    // Built in workflow order (not alphabetical) so it reads naturally.
    function populateStatusFilter() {
        const statusOrder = ['Pending', 'Validated', 'Inspected', 'Approved', 'Rejected'];
        const presentStatuses = statusOrder.filter(s => currentReports.some(r => r.displayStatus === s));
        const el = document.getElementById('filterStatus');
        if (!el) return;
        const currentValue = el.value;
        el.innerHTML = `<option value="">${t('filter_all_statuses')}</option>` + presentStatuses.map(s => `<option value="${s}">${reportStatusLabel(s)}</option>`).join('');
        if (presentStatuses.includes(currentValue)) el.value = currentValue;
    }

    function fillSelect(id, values, allLabel) {
        const el = document.getElementById(id);
        if (!el) return;
        const currentValue = el.value; // preserve the current selection across rebuilds
        el.innerHTML = `<option value="">${allLabel}</option>` + values.map(v => `<option value="${v}">${v}</option>`).join('');
        if (values.includes(currentValue)) el.value = currentValue;
    }

    function toggleFilterPanel() {
        document.getElementById('filterFieldsRow').classList.toggle('hidden');
        document.getElementById('filterToggleIcon').classList.toggle('rotate-180');
    }

    function clearFilters() {
        document.getElementById('filterStatus').value = '';
        document.getElementById('filterDamageType').value = '';
        document.getElementById('filterSeverity').value = '';
        document.getElementById('filterBarangay').value = '';
        document.getElementById('filterDateFrom').value = '';
        document.getElementById('filterDateTo').value = '';
        document.getElementById('searchInput').value = '';
        filterReports();
    }

    function clearDetailPanel() {
        currentDetailId = null;
        document.getElementById('detailPanel').innerHTML = `
            <div class="h-full flex flex-col items-center justify-center text-gray-300">
                <i class="fa-solid fa-file-circle-question text-6xl mb-4 opacity-20"></i>
                <p class="font-bold text-sm text-gray-400">${t('empty_state_text')}</p>
            </div>`;
        // On phone, the list and detail panel take turns filling the screen
        // (md:flex/md:block always keep both visible at 768px+ regardless of
        // these classes) - going back to no selection means showing the list.
        document.getElementById('reportsListPanel').classList.remove('hidden');
        document.getElementById('detailPanel').classList.add('hidden');
    }

    function setTab(tab) {
        activeTab = tab;
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.remove('tab-active', 'text-gray-800');
            btn.classList.add('text-gray-400');
        });
        document.getElementById('tab' + tab).classList.add('tab-active');
        document.getElementById('tab' + tab).classList.remove('text-gray-400');

        // Status filter only makes sense on "All Reports" — Pending/Validated
        // tabs already narrow the list to that one status by themselves.
        const statusWrapper = document.getElementById('filterStatusWrapper');
        if (tab === 'All') {
            statusWrapper.classList.remove('hidden');
        } else {
            statusWrapper.classList.add('hidden');
            document.getElementById('filterStatus').value = '';
        }

        clearDetailPanel();
        filterReports();
    }

    // Every word typed must appear somewhere in the record, in any order, so
    // "angel sumagang" finds "Angel Cleo Adajar Sumagang".
    function matchesAllWords(query, fields) {
        const words = String(query || '').toLowerCase().replace(/#/g, ' ').split(/\s+/).filter(Boolean);
        if (!words.length) return true;
        const hay = fields.filter(v => v !== null && v !== undefined && v !== '').map(v => String(v).toLowerCase()).join(' | ');
        return words.every(w => hay.includes(w));
    }

    function filterReports() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        const statusFilter     = document.getElementById('filterStatus').value;
        const damageTypeFilter = document.getElementById('filterDamageType').value;
        const severityFilter   = document.getElementById('filterSeverity').value;
        const barangayFilter   = document.getElementById('filterBarangay').value;
        let dateFrom = document.getElementById('filterDateFrom').value;
        let dateTo   = document.getElementById('filterDateTo').value;

        const todayStr2 = (() => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); })();
        const earliestStr2 = '2024-01-01';
        if ((dateFrom && (dateFrom > todayStr2 || dateFrom < earliestStr2)) || (dateTo && (dateTo > todayStr2 || dateTo < earliestStr2))) {
            Swal.fire({ icon: 'warning', title: t('sw_date_bounds_title'), text: t('sw_date_bounds_text'), confirmButtonColor: '#11542e' });
            document.getElementById('filterDateFrom').value = '';
            document.getElementById('filterDateTo').value = '';
            dateFrom = '';
            dateTo = '';
        } else if (dateFrom && dateTo && dateFrom > dateTo) {
            Swal.fire({ icon: 'warning', title: t('sw_invalid_date_title'), text: t('sw_invalid_date_text'), confirmButtonColor: '#11542e' });
            dateFrom = '';
            dateTo = '';
        }

        const filtered = currentReports.filter(r => {
            const matchesTab = (activeTab === 'All') || (r.displayStatus === activeTab);
            // Status dropdown only applies while on the "All Reports" tab
            const matchesStatus = (activeTab !== 'All') || !statusFilter || r.displayStatus === statusFilter;
            const idStr = (r.normalizedId || "").toString().toLowerCase();
            const idStrWithPrefix = 'rep-' + idStr; // so typing the visible "#REP-73" label actually matches
            const name = (r.farmer || r.FarmerName || "").toLowerCase();
            const crop = (r.crop_name || "").toLowerCase();
            const status = (r.displayStatus || "").toLowerCase();
            const queryClean = query.replace(/^#/, ''); // tolerate a leading # too
            // Every word must appear somewhere ("angel sumagang", "blanco flood").
            const matchesSearch = matchesAllWords(queryClean, [idStr, idStrWithPrefix, name, crop, status,
                reportStatusLabel(r.displayStatus), r.damage_type, r.severity, r.barangay_raw]);

            const matchesDamageType = !damageTypeFilter || r.damage_type === damageTypeFilter;
            const matchesSeverity   = !severityFilter || r.severity === severityFilter;
            const matchesBarangay   = !barangayFilter || parseBarangay(r.barangay_raw) === barangayFilter;
            const matchesDateFrom   = !dateFrom || (r.date && r.date >= dateFrom);
            const matchesDateTo     = !dateTo || (r.date && r.date <= dateTo);

            return matchesTab && matchesStatus && matchesSearch && matchesDamageType && matchesSeverity && matchesBarangay && matchesDateFrom && matchesDateTo;
        });
        if (filtered.length === 0) clearDetailPanel();
        currentFilteredReports = filtered;
        currentReportsPage = 1;
        renderReportsPage();
    }

    const REPORTS_PER_PAGE = 5;
    let currentReportsPage = 1;
    let currentFilteredReports = [];

    function renderReportsPage() {
        const start = (currentReportsPage - 1) * REPORTS_PER_PAGE;
        const pageItems = currentFilteredReports.slice(start, start + REPORTS_PER_PAGE);
        renderList(pageItems);
        renderReportsPagination(currentFilteredReports.length);
    }

    function renderReportsPagination(totalItems) {
        const container = document.getElementById('reportsPagination');
        const totalPages = Math.ceil(totalItems / REPORTS_PER_PAGE);
        if (totalPages <= 1) { container.innerHTML = ''; return; }

        let html = '<button onclick="goToReportsPage(' + (currentReportsPage - 1) + ')" ' + (currentReportsPage === 1 ? 'disabled' : '') +
            ' class="w-8 h-8 flex items-center justify-center rounded-lg text-xs font-bold ' + (currentReportsPage === 1 ? 'text-gray-300 cursor-not-allowed' : 'text-gray-500 hover:bg-gray-100') + '"><i class="fa-solid fa-chevron-left"></i></button>';

        for (let i = 1; i <= totalPages; i++) {
            const active = i === currentReportsPage;
            html += '<button onclick="goToReportsPage(' + i + ')" class="w-8 h-8 flex items-center justify-center rounded-lg text-xs font-bold ' + (active ? 'bg-[#11542e] text-white' : 'text-gray-500 hover:bg-gray-100') + '">' + i + '</button>';
        }

        html += '<button onclick="goToReportsPage(' + (currentReportsPage + 1) + ')" ' + (currentReportsPage === totalPages ? 'disabled' : '') +
            ' class="w-8 h-8 flex items-center justify-center rounded-lg text-xs font-bold ' + (currentReportsPage === totalPages ? 'text-gray-300 cursor-not-allowed' : 'text-gray-500 hover:bg-gray-100') + '"><i class="fa-solid fa-chevron-right"></i></button>';

        container.innerHTML = html;
    }

    function goToReportsPage(page) {
        currentReportsPage = page;
        renderReportsPage();
    }

    function renderList(reports) {
        const listContainer = document.getElementById('reportsList');
        if (reports.length === 0) {
            listContainer.innerHTML = `<p class="text-center text-gray-400 py-10 italic text-xs uppercase font-black">${t('no_matching_records')}</p>`;
            return;
        }
        listContainer.innerHTML = reports.map(r => `
            <div onclick="viewReport(${r.normalizedId})" id="card-${r.normalizedId}" class="report-card bg-white p-5 rounded-2xl border border-gray-100 shadow-sm hover:shadow-md transition-all cursor-pointer group">
                <div class="flex justify-between items-start mb-2">
                    <span class="text-[9px] font-black text-gray-400 uppercase tracking-widest">#REP-${r.normalizedId}</span>
                    <span class="px-2 py-0.5 rounded-full text-[8px] font-black uppercase ${getStatusStyle(r.displayStatus)}">${reportStatusLabel(r.displayStatus)}</span>
                </div>
                <h4 class="text-sm font-black text-gray-800 mb-1 group-hover:text-[#11542e]">${r.crop_name || t('crop_report_fallback')}</h4>
                <p class="text-[10px] font-bold text-gray-400">${r.farmer || r.FarmerName} • ${t('area_label')}: ${r.area || t('na_fallback')} Ha</p>
            </div>`).join('');
    }

    async function viewReport(id) {
        // Prevent passing undefined IDs
        if (!id) return;

        currentDetailId = id;
        document.querySelectorAll('.report-card').forEach(c => c.classList.remove('selected'));
        const selectedCard = document.getElementById(`card-${id}`);
        if(selectedCard) selectedCard.classList.add('selected');

        // On phone, switch from the list to the detail panel (no-op at 768px+,
        // where both stay visible via md:flex/md:block regardless of this).
        document.getElementById('reportsListPanel').classList.add('hidden');
        document.getElementById('detailPanel').classList.remove('hidden');

        const baseReport = currentReports.find(report => report.normalizedId == id);

        document.getElementById('detailPanel').innerHTML = `
            <button onclick="clearDetailPanel()" class="md:hidden mb-4 flex items-center gap-2 text-xs font-bold text-gray-500 hover:text-[#11542e]"><i class="fa-solid fa-arrow-left"></i> ${t('btn_back_to_list')}</button>

                <i class="fa-solid fa-circle-notch fa-spin text-4xl mb-4 text-[#11542e]"></i>

            </div>`;

        try {
            const res = await fetch(`../../api/masterfile/damage_report/get_report_details.php?id=${id}`);
            const data = await res.json();
            
            if (data.status !== 'success') throw new Error("Could not load details");
            
            const detail = data.report;
            const images = data.images || [];

            // Archived reports are deliberately excluded from currentReports (see
            // fetchReports()'s Status filter), so baseReport is undefined whenever
            // this report is archived — the case when opening it via an old
            // notification or a deep link. Fall back to raw columns from this API
            // response instead of crashing on undefined.
            const displayStatus = baseReport?.displayStatus || detail.Status || 'Archived';
            const reportDate    = baseReport?.date || detail.Report_Date;
            const reportArea    = baseReport?.area || detail.Affected_Area || '0.00';
            
            // The farmer's photos and the technician's inspection photos come back in
            // one list. They used to be shown together under "Initial Evidence", so
            // the technician's photos looked like extra farmer photos. Split them the
            // same way the Admin's report review does.
            const farmerImgs = images.filter(img => (img.uploaded_by || 'Farmer') === 'Farmer');
            const techImgs   = images.filter(img => img.uploaded_by === 'Technician');
            const thumbs = list => list.map(img => {
                const proof = geoProofLabel(img, detail.Farm_Lat, detail.Farm_Lng);
                return `
                <div class="w-20 sm:w-24">
                    <a href="${img.path || img}" target="_blank" class="block w-20 h-20 sm:w-24 sm:h-24 rounded-xl overflow-hidden border-2 border-gray-200 hover:border-[#11542e] transition-all shadow-sm">
                        <img src="${img.path || img}" class="w-full h-full object-cover hover:scale-110 transition-transform">
                    </a>
                    <p class="mt-1 text-[8px] font-black text-center leading-tight ${proof.cls}">${proof.text}</p>
                </div>`; }).join('');

            const gallery = (titleKey, borderCls, list) => `
                    <h4 class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2 sm:mb-3 border-l-2 ${borderCls} pl-2">${t(titleKey)}</h4>
                    ${list.length > 0
                        ? `<div class="flex flex-wrap gap-3 sm:gap-4">${thumbs(list)}</div>`
                        : `<div class="bg-gray-50 border border-gray-100 p-3 sm:p-4 rounded-xl">
                        <p class="text-xs text-gray-400 italic">${t('no_evidence')}</p>
                    </div>`}`;
            const farmerGallery = gallery('initial_evidence', 'border-amber-500', farmerImgs);
            const techGallery   = gallery('tech_evidence', 'border-green-500', techImgs);

            // Split the Description into the Farmer's Original Report vs the Technician's
            // Field Findings. Same marker convention already used on the Admin side
            // (api/technician/submit_validation.php appends onto the same column).
            const rawDescription = detail.Description || '';
            const techMarker = '--- TECH FINDINGS ---';
            let farmerNotes = rawDescription;
            let techNotes = '';
            let hasTechFindings = false;
            if (rawDescription.includes(techMarker)) {
                const parts = rawDescription.split(techMarker);
                farmerNotes = parts[0].trim();
                techNotes = parts[1].trim();
                hasTechFindings = true;
            }
            // Escaped before being spliced into the innerHTML template below -
            // this is free text from the Farmer/Technician, not markup.
            farmerNotes = escapeHtml(farmerNotes);
            techNotes = escapeHtml(techNotes);

            // Once a Technician is involved: farmer on the left, technician on the
            // right, photos above remarks. On desktop the grid fills row by row so
            // the two photo boxes line up and the two text boxes line up; on a phone
            // the order classes stack it farmer photos -> farmer remarks -> technician
            // photos -> technician findings.
            const hasTechSide = hasTechFindings || techImgs.length > 0;
            const remarksHTML = hasTechSide ? `
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-x-4 sm:gap-y-6 mb-3 sm:mb-6">

                        <h4 class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2 sm:mb-3 border-l-2 border-blue-500 pl-2">${t('farmer_remarks_title')}</h4>
                        <div class="bg-blue-50/30 border border-blue-100 p-3 sm:p-5 rounded-2xl flex-1">
                            <p class="text-sm text-gray-600 leading-relaxed italic whitespace-pre-line">${farmerNotes || t('no_remarks')}</p>
                        </div>
                    </div>
                    <div class="order-4 sm:order-none flex flex-col">
                        <h4 class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2 sm:mb-3 border-l-2 border-green-500 pl-2">${t('tech_findings_title')}</h4>
                        <div class="bg-green-50/30 border border-green-100 p-3 sm:p-5 rounded-2xl flex-1">
                            <p class="text-sm text-gray-600 leading-relaxed whitespace-pre-line">${techNotes || t('no_tech_findings')}</p>
                        </div>
                    </div>
                </div>` : `
                <div class="mb-3 sm:mb-8">${farmerGallery}</div>
                <div class="mb-3 sm:mb-6">
                    <h4 class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2 sm:mb-3 border-l-2 border-blue-500 pl-2">${t('farmer_remarks_title')}</h4>
                    <div class="bg-blue-50/30 border border-blue-100 p-3 sm:p-5 rounded-2xl">
                        <p class="text-sm text-gray-600 leading-relaxed italic whitespace-pre-line">${farmerNotes || t('no_remarks')}</p>
                    </div>

            let decisionPanel = "";
            if (displayStatus === 'Pending') {

                        <p class="text-xs text-gray-500 mb-3 sm:mb-6">${t('mao_verification_desc')}</p>
                        <div class="flex gap-3 sm:gap-4">
                            <button onclick="updateStatus(${id}, 'Validated')" class="flex-1 bg-[#11542e] text-white py-3 sm:py-4 rounded-xl sm:rounded-2xl font-black text-xs uppercase shadow-xl shadow-green-900/20 hover:bg-[#0c3d22] transition-all flex justify-center items-center gap-2 whitespace-nowrap"><i class="fa-solid fa-check"></i> <span class="sm:hidden">${t('btn_approve_short')}</span><span class="hidden sm:inline">${t('btn_approve_verification')}</span></button>
                            <button onclick="updateStatus(${id}, 'Rejected')" class="flex-1 bg-red-50 text-red-600 border border-red-200 py-3 sm:py-4 rounded-xl sm:rounded-2xl font-black text-xs uppercase hover:bg-red-600 hover:text-white transition-all flex justify-center items-center gap-2 whitespace-nowrap"><i class="fa-solid fa-xmark"></i> <span class="sm:hidden">${t('btn_reject_short')}</span><span class="hidden sm:inline">${t('btn_reject_report')}</span></button>
                        </div>
                    </div>`;
            } else {
                decisionPanel = `
                    <div class="bg-blue-50/50 p-4 sm:p-6 rounded-2xl sm:rounded-[2rem] border border-blue-100 mt-4 sm:mt-8 flex items-center justify-center">
                        <p class="text-xs font-black text-blue-500 uppercase tracking-widest">
                            <i class="fa-solid fa-lock mr-2"></i> ${t('report_locked_prefix')} ${reportStatusLabel(displayStatus)}
                        </p>
                    </div>`;
            }

            const farmLocation = detail.Barangay ? detail.Barangay : t('location_missing');
            // Smart lookup for RSBA Number based on exact schema spelling
            const rsbaDisplay = detail.RSBA_No || baseReport?.RSBA_No || detail.rsba_no || t('unregistered');

            document.getElementById('detailPanel').innerHTML = `
                <div class="max-w-4xl mx-auto pb-24 sm:pb-10">
                    <button onclick="clearDetailPanel()" class="md:hidden mb-3 flex items-center gap-2 text-xs font-bold text-gray-500 hover:text-[#11542e]"><i class="fa-solid fa-arrow-left"></i> ${t('btn_back_to_list')}</button>
                    <div class="flex flex-wrap justify-between items-center gap-3 mb-4 sm:mb-8 pb-3 sm:pb-6 border-b border-gray-100">
                        <div>

                            <p class="text-xs text-gray-400 font-bold tracking-widest uppercase mt-1">${t('submitted_label')}: ${reportDate || t('na_fallback')}</p>

                    <div class="bg-gray-50 rounded-2xl p-4 sm:p-6 border border-gray-100 mb-3 sm:mb-6">
                        <h4 class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2 sm:mb-4 border-l-2 border-[#11542e] pl-2">${t('farmer_id_section')}</h4>

                            </div>
                            <div>
                                <p class="text-[10px] text-gray-400 font-bold uppercase mb-1">${t('rsbsa_number_label')}</p>

                    <p class="font-bold text-sm">${t('failed_load_profile')}</p>

        }

    function getStatusStyle(s) {
        if (s === 'Pending') return 'bg-amber-100 text-amber-700';
        if (s === 'Validated') return 'bg-blue-100 text-blue-700';
        if (s === 'Inspected') return 'bg-purple-100 text-purple-700';
        if (s === 'Approved') return 'bg-green-100 text-green-700';
        return 'bg-red-100 text-red-700';
    }

    function updateStatus(id, status) {
        // Double check ID exists
        if (!id) {
            return Swal.fire(t('sw_error_title'), t('sw_invalid_id'), 'error');
        }

        Swal.fire({
            title: status === 'Validated' ? t('sw_confirm_validation_title') : t('sw_reject_title'),
            text: status === 'Validated' ? t('sw_validation_text') : t('sw_reject_text'),
            icon: 'question',
            // Rejecting can carry an optional reason; it goes into the
            // farmer's notification and the audit log (no schema change).
            input: status === 'Rejected' ? 'textarea' : undefined,
            inputLabel: status === 'Rejected' ? t('sw_reject_reason_label') : undefined,
            inputPlaceholder: status === 'Rejected' ? t('sw_reject_reason_placeholder') : undefined,
            inputAttributes: status === 'Rejected' ? { maxlength: 300 } : undefined,
            showCancelButton: true,
            confirmButtonColor: status === 'Rejected' ? '#d33' : '#11542e',
            confirmButtonText: t('sw_yes_confirm')
        }).then((res) => {
            if (res.isConfirmed) {
                fetch('../../api/masterfile/damage_report/update_status.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: id, status: status, reason: status === 'Rejected' ? (res.value || '') : '' })
                })
                .then(r => r.json())
                .then(data => {
                    if(data.status === 'success') {
                        Swal.fire(t('sw_updated_title'), t('sw_updated_text'), 'success');
                        fetchReports();
                        clearDetailPanel();
                    } else {
                        Swal.fire(t('sw_error_title'), data.message || t('sw_update_failed'), 'error');
                    }
                })
                .catch(() => Swal.fire(t('sw_error_title'), t('sw_server_error'), 'error'));
            }
        });
    }

    function confirmLogout() {
        CropGuardSession.logout();
    }
</script>

        });
