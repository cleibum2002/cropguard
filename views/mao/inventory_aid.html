<body class="h-screen flex overflow-hidden" style="display:none!important">

<div id="sidebar-container"></div>

    <div class="flex-1 flex flex-col h-screen overflow-hidden bg-gray-50">
                <header class="min-h-[4rem] flex flex-wrap items-center justify-between gap-3 px-4 sm:px-8 py-3 bg-white/80 backdrop-blur-md border-b border-gray-100 flex-shrink-0 z-20">
            <span class="text-xs sm:text-base font-black text-gray-800 tracking-tight" data-i18n="header_title">Relief Distribution (MAO Center)</span>
            <div class="ml-auto sm:ml-0 relative flex items-center gap-3 sm:gap-4">
                <div class="flex items-center gap-1.5 text-xs font-bold text-gray-400">
                    <span class="lang-link" data-lang="en" onclick="setLanguage('en')">ENG</span>
                    <span>|</span>
                    <span class="lang-link" data-lang="tl" onclick="setLanguage('tl')">FIL</span>
                </div>
                <button id="maoNotifBellBtn" onclick="toggleMaoNotificationPanel()" class="relative w-9 h-9 bg-gray-50 rounded-xl flex items-center justify-center text-gray-400 hover:bg-gray-100 transition-colors flex-shrink-0">
                    <i class="fa-regular fa-bell text-sm"></i>
                    <span id="maoNotifBadge" class="hidden absolute top-1 right-1 min-w-[16px] h-4 px-1 bg-red-500 rounded-full text-[9px] text-white font-black flex items-center justify-center">0</span>
                </button>
                <div id="maoNotifPanel" class="hidden absolute right-0 top-12 w-[88vw] max-w-sm bg-white rounded-2xl shadow-2xl border border-gray-100 z-[100]">
                    <div class="px-6 py-4 border-b border-gray-100">
                        <h4 class="text-sm font-black text-gray-800 uppercase tracking-widest" data-i18n="notif_title">Notifications</h4>
                    </div>
                    <div id="maoNotifList" class="divide-y divide-gray-50 max-h-[420px] overflow-y-auto">
                        <p class="text-sm text-gray-400 italic text-center py-10" data-i18n="notif_loading">Loading...</p>
                    </div>
                </div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-8 custom-scrollbar">
            <div class="max-w-7xl mx-auto">
                <div class="mb-8 flex flex-col sm:flex-row sm:items-end justify-between gap-4">
                    <div>
                        <h2 class="text-xl sm:text-3xl font-black text-gray-800 tracking-tight" data-i18n="page_title">Ayuda Distribution Ledger</h2>
                        <p class="text-gray-500 text-sm mt-1" data-i18n="page_sub">Verify farmer identification and mark agricultural inputs as claimed.</p>
                    </div>
                    <div class="relative w-full sm:w-64 sm:flex-shrink-0">
                        <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                        <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Search Beneficiary..." class="w-full bg-gray-50 border border-gray-200 rounded-full py-2 pl-10 pr-4 text-sm outline-none focus:ring-2 focus:ring-[#11542e]/20" data-i18n-placeholder="search_placeholder">
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-4 flex flex-wrap items-end gap-3">
                    <div>
                        <label class="block text-[9px] font-black text-gray-400 uppercase mb-1" data-i18n="filter_status_label">Status</label>
                        <select id="filterStatus" onchange="filterTable()" class="bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-xs font-semibold text-gray-700 outline-none focus:ring-2 focus:ring-[#11542e] min-w-[160px]">
                            <option value="">All Statuses</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[9px] font-black text-gray-400 uppercase mb-1" data-i18n="filter_damage_type_label">Damage Type</label>
                        <select id="filterDamageType" onchange="filterTable()" class="bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-xs font-semibold text-gray-700 outline-none focus:ring-2 focus:ring-[#11542e] min-w-[140px]">
                            <option value="">All Types</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[9px] font-black text-gray-400 uppercase mb-1" data-i18n="filter_severity_label">Severity</label>
                        <select id="filterSeverity" onchange="filterTable()" class="bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-xs font-semibold text-gray-700 outline-none focus:ring-2 focus:ring-[#11542e] min-w-[140px]">
                            <option value="">All Severities</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[9px] font-black text-gray-400 uppercase mb-1" data-i18n="filter_barangay_label">Barangay</label>
                        <select id="filterBarangay" onchange="filterTable()" class="bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-xs font-semibold text-gray-700 outline-none focus:ring-2 focus:ring-[#11542e] min-w-[160px]">
                            <option value="">All Barangays</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[9px] font-black text-gray-400 uppercase mb-1" data-i18n="filter_date_from_label">From</label>
                        <input type="date" id="filterDateFrom" onchange="filterTable()" class="bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-xs font-semibold text-gray-700 outline-none focus:ring-2 focus:ring-[#11542e]">
                    </div>
                    <div>
                        <label class="block text-[9px] font-black text-gray-400 uppercase mb-1" data-i18n="filter_date_to_label">To</label>
                        <input type="date" id="filterDateTo" onchange="filterTable()" class="bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-xs font-semibold text-gray-700 outline-none focus:ring-2 focus:ring-[#11542e]">
                    </div>
                    <button onclick="clearAidFilters()" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-lg text-xs font-bold transition-colors flex items-center gap-2">
                        <i class="fa-solid fa-xmark"></i> <span data-i18n="filter_clear">Clear Filters</span>
                    </button>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-gray-50/50 border-b border-gray-100">
                                <tr>
                                    <th class="hidden md:table-cell px-6 py-4 text-[10px] font-black text-gray-400 uppercase tracking-widest" data-i18n="th_dist_id">Distribution ID</th>
                                    <th class="px-3 md:px-6 py-4 text-[10px] font-black text-gray-400 uppercase tracking-widest" data-i18n="th_farmer_name">Farmer Name</th>
                                    <th class="px-3 md:px-6 py-4 text-[10px] font-black text-gray-400 uppercase tracking-widest" data-i18n="th_allocated_aid">Allocated Aid</th>
                                    <th class="hidden md:table-cell px-6 py-4 text-[10px] font-black text-gray-400 uppercase tracking-widest" data-i18n="th_approved_by">Approved By</th>
                                    <th class="px-3 md:px-6 py-4 text-[10px] font-black text-gray-400 uppercase tracking-widest text-center" data-i18n="th_status">Status</th>
                                    <th class="sticky right-0 z-10 bg-gray-50 shadow-[-4px_0_6px_-4px_rgba(0,0,0,0.08)] px-3 md:px-6 py-4 text-[10px] font-black text-gray-400 uppercase tracking-widest text-right" data-i18n="th_action">Action</th>
                                </tr>
                            </thead>
                            <tbody id="aidTableBody" class="divide-y divide-gray-50">
                                </tbody>
                        </table>
                    </div>
                    <div id="paginationBar" class="hidden flex flex-col sm:flex-row items-center sm:justify-between gap-2 sm:gap-0 px-6 py-4 border-t border-gray-100">
                        <div class="order-1 sm:order-2 flex items-center gap-2">
                            <button onclick="changePage(-1)" id="prevPageBtn" class="px-3 py-1.5 bg-gray-50 hover:bg-gray-100 disabled:opacity-40 disabled:cursor-not-allowed text-gray-600 rounded-lg text-xs font-bold transition-colors">
                                <i class="fa-solid fa-chevron-left"></i> <span data-i18n="pagination_prev">Prev</span>
                            </button>
                            <button onclick="changePage(1)" id="nextPageBtn" class="px-3 py-1.5 bg-gray-50 hover:bg-gray-100 disabled:opacity-40 disabled:cursor-not-allowed text-gray-600 rounded-lg text-xs font-bold transition-colors">
                                <span data-i18n="pagination_next">Next</span> <i class="fa-solid fa-chevron-right"></i>
                            </button>
                        </div>
                        <p id="paginationInfo" class="order-2 sm:order-1 text-xs font-bold text-gray-400"></p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // 1. Session Check
        CropGuardSession.protect({
            roles: ['mao', 'admin'],
            onReady: (data) => {
                document.getElementById('maoNameSidebar').innerText = data.user.fullname;
            }
        });

        // Reusable EN / TL switcher (see assets/js/i18n.js). Nav keys (nav_*, sidebar_role)
        // must stay word-for-word identical across every MAO page since they translate
        // the one shared sidebar injected by navbar_mao.js.
        const translations = {
            en: {
                nav_profile: "My Profile", nav_dashboard: "MAO Dashboard", nav_reports: "Report Management",
                nav_inventory: "Inventory & Aid", nav_analytics: "Distribution Reports", nav_comm: "Communication",
                sidebar_role: "MAO Officer",
                header_title: "Relief Distribution (MAO Center)", search_placeholder: "Search Beneficiary...",
                page_title: "Ayuda Distribution Ledger", page_sub: "Verify farmer identification and mark agricultural inputs as claimed.",
                th_dist_id: "Distribution ID", th_farmer_name: "Farmer Name", th_allocated_aid: "Allocated Aid",
                th_approved_by: "Approved By", th_status: "Status", th_action: "Action",
                no_aid_found: "No aid allocations found.",
                status_pending_distribution: "Pending Distribution", status_claimed: "Claimed",
                btn_released: "Released", btn_mark_claimed: "Mark as Claimed",
                sw_confirm_dist_title: "Confirm Distribution?",
                sw_confirm_dist_text: "Has the farmer presented valid ID and received the physical items?",
                sw_yes_distributed: "Yes, Distributed",
                sw_distributed_title: "Distributed!", sw_distributed_text: "Beneficiary claim recorded successfully.",
                sw_error_title: "Error", sw_update_failed: "Failed to update record.", sw_server_conn_failed: "Server connection failed.",
                sw_invalid_date_title: "Invalid Date Range", sw_invalid_date_text: "The 'From' date can't be after the 'To' date. Filter cleared.",
                sw_signout_title: "Sign Out?", sw_signout_text: "You will be returned to the login screen.", sw_yes_signout: "Yes, sign out",
                sw_session_expired_title: "Session Expired", sw_session_expired_text: "You have been logged out due to 5 minutes of inactivity.",
                notif_title: "Notifications", notif_loading: "Loading...", notif_none: "No notifications yet.",
                filter_status_label: "Status", filter_damage_type_label: "Damage Type", filter_severity_label: "Severity",
                filter_barangay_label: "Barangay", filter_date_from_label: "From", filter_date_to_label: "To", filter_clear: "Clear Filters",
                filter_all_types: "All Types", filter_all_severities: "All Severities", filter_all_barangays: "All Barangays", filter_all_statuses: "All Statuses",
                sw_date_bounds_title: "Invalid Date", sw_date_bounds_text: "Please pick a date between January 2024 and today. Filter cleared.",
                pagination_prev: "Prev", pagination_next: "Next", pagination_showing: "Showing", pagination_of: "of"
            },
            tl: {
                nav_profile: "Aking Profile", nav_dashboard: "Dashboard ng MAO", nav_reports: "Pamamahala ng Ulat",
                nav_inventory: "Imbentaryo at Tulong", nav_analytics: "Ulat ng Pamamahagi", nav_comm: "Komunikasyon",
                sidebar_role: "Opisyal ng MAO",
                header_title: "Pamamahagi ng Ayuda (MAO Center)", search_placeholder: "Maghanap ng Benepisyaryo...",
                page_title: "Listahan ng Pamamahagi ng Ayuda", page_sub: "Tiyakin ang pagkakakilanlan ng magsasaka at markahan ang mga natanggap na tulong bilang na-claim.",
                th_dist_id: "ID ng Pamamahagi", th_farmer_name: "Pangalan ng Magsasaka", th_allocated_aid: "Inilaang Tulong",
                th_approved_by: "Inaprubahan Ni", th_status: "Katayuan", th_action: "Aksyon",
                no_aid_found: "Walang nakitang alokasyon ng tulong.",
                status_pending_distribution: "Naghihintay ng Pamamahagi", status_claimed: "Na-claim na",
                btn_released: "Naipamahagi na", btn_mark_claimed: "Markahan bilang Na-claim",
                sw_confirm_dist_title: "Kumpirmahin ang Pamamahagi?",
                sw_confirm_dist_text: "Nagpakita ba ang magsasaka ng wastong ID at natanggap na ang mga pisikal na bagay?",
                sw_yes_distributed: "Oo, Naipamahagi Na",
                sw_distributed_title: "Naipamahagi Na!", sw_distributed_text: "Matagumpay na naitala ang claim ng benepisyaryo.",
                sw_error_title: "Error", sw_update_failed: "Hindi na-update ang record.", sw_server_conn_failed: "Nabigo ang koneksyon sa server.",
                sw_invalid_date_title: "Maling Saklaw ng Petsa", sw_invalid_date_text: "Hindi maaaring mauna ang petsa sa 'Mula' kaysa sa 'Hanggang'. Nabura ang filter.",
                sw_signout_title: "Mag-sign Out?", sw_signout_text: "Ibabalik ka sa login screen.", sw_yes_signout: "Oo, mag-sign out",
                sw_session_expired_title: "Nag-expire ang Session", sw_session_expired_text: "Na-log out ka dahil sa 5 minuto ng hindi paggamit.",
                notif_title: "Mga Abiso", notif_loading: "Nilo-load...", notif_none: "Wala pang abiso.",
                filter_status_label: "Katayuan", filter_damage_type_label: "Uri ng Pinsala", filter_severity_label: "Kalubhaan",
                filter_barangay_label: "Barangay", filter_date_from_label: "Mula", filter_date_to_label: "Hanggang", filter_clear: "I-clear ang mga Filter",
                filter_all_types: "Lahat ng Uri", filter_all_severities: "Lahat ng Kalubhaan", filter_all_barangays: "Lahat ng Barangay", filter_all_statuses: "Lahat ng Katayuan",
                sw_date_bounds_title: "Hindi Wastong Petsa", sw_date_bounds_text: "Pumili ng petsa sa pagitan ng Enero 2024 at ngayon. Nabura ang filter.",
                pagination_prev: "Nakaraan", pagination_next: "Susunod", pagination_showing: "Ipinapakita", pagination_of: "ng"
            }
        };

        // Translates the status word shown in the ledger badge
        function aidStatusLabel(status) {
            const map = { 'Pending Distribution': 'status_pending_distribution', 'Claimed': 'status_claimed' };
            const key = map[status];
            return key ? t(key) : status;
        }

        // Called automatically by i18n.js whenever the user picks a new language
        function onLanguageChange() {
            populateFilterOptions(); // refresh "All Types" / "All Severities" / "All Barangays" / "All Statuses" text
            filterTable(); // re-renders the currently filtered rows with translated status/action text
            loadMaoNotifications();
        }

        let aidData = [];

        document.addEventListener("DOMContentLoaded", () => {
            loadAidList();
            // Nothing about a distribution date can be in the future, and nothing
            // meaningful predates CropGuard's own existence — bound both fields
            // so the date picker itself can't offer an impossible value.
            const todayStr = (() => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); })();
            const earliestStr = '2024-01-01';
            ['filterDateFrom', 'filterDateTo'].forEach(id => {
                const el = document.getElementById(id);
                el.max = todayStr;
                el.min = earliestStr;
            });
        });

        // 2. Fetch the newly created Aid Ledger from the database
        async function loadAidList() {
            try {
                const res = await fetch('../../api/mao/get_aid_ledger.php');
                const response = await res.json();
                if (response.status === 'success') {
                    aidData = response.data;
                    populateFilterOptions();
                    filteredAidData = aidData;
                    currentPage = 1;
                    renderPage();
                }
            } catch (e) { 
                console.error("Load failed", e); 
            }
        }

        // Same convention already used on Report Management / MAO System Reports:
        // the stored Barangay field is a full free-text address, but the real
        // barangay name is always the first comma-separated segment.
        function parseBarangay(raw) {
            if (!raw) return '';
            return raw.split(',')[0].trim();
        }

        // Builds the dropdown option lists straight from whatever data actually
        // exists in the aid ledger, so nothing real ever goes missing and no
        // option ever matches zero rows.
        function populateFilterOptions() {
            const damageTypes = [...new Set(aidData.map(i => i.damage_type).filter(Boolean))].sort();
            const severities  = [...new Set(aidData.map(i => i.damage_severity).filter(Boolean))].sort();
            const barangays   = [...new Set(aidData.map(i => parseBarangay(i.barangay_raw)).filter(Boolean))].sort();
            const statusOrder = ['Pending Distribution', 'Claimed'];
            const statuses    = statusOrder.filter(s => aidData.some(i => i.status === s));

            fillSelect('filterDamageType', damageTypes, t('filter_all_types'));
            fillSelect('filterSeverity', severities, t('filter_all_severities'));
            fillSelect('filterBarangay', barangays, t('filter_all_barangays'));

            const statusEl = document.getElementById('filterStatus');
            if (statusEl) {
                const currentValue = statusEl.value;
                statusEl.innerHTML = `<option value="">${t('filter_all_statuses')}</option>` + statuses.map(s => `<option value="${s}">${aidStatusLabel(s)}</option>`).join('');
                if (statuses.includes(currentValue)) statusEl.value = currentValue;
            }
        }

        function fillSelect(id, values, allLabel) {
            const el = document.getElementById(id);
            if (!el) return;
            const currentValue = el.value; // preserve the current selection across rebuilds
            el.innerHTML = `<option value="">${allLabel}</option>` + values.map(v => `<option value="${v}">${v}</option>`).join('');
            if (values.includes(currentValue)) el.value = currentValue;
        }

        function clearAidFilters() {
            document.getElementById('filterStatus').value = '';
            document.getElementById('filterDamageType').value = '';
            document.getElementById('filterSeverity').value = '';
            document.getElementById('filterBarangay').value = '';
            document.getElementById('filterDateFrom').value = '';
            document.getElementById('filterDateTo').value = '';
            document.getElementById('searchInput').value = '';
            filterTable();
        }

        // 3. Render the Table
        function renderTable(data) {
            const tbody = document.getElementById("aidTableBody");
            tbody.innerHTML = data.length ? "" : `<tr><td colspan="6" class="px-3 md:px-6 py-12 text-center text-gray-400 italic">${t('no_aid_found')}</td></tr>`;

            data.forEach(item => {
                const isClaimed = item.status === 'Claimed';
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50/50 transition-colors">
                        <td class="hidden md:table-cell px-6 py-4 font-black text-gray-400 text-xs">#AID-${item.dist_id}</td>
                        <td class="px-3 md:px-6 py-4 font-black text-gray-800 text-sm">${item.farmer_name}</td>
                        <td class="px-3 md:px-6 py-4">
                            <span class="text-xs font-bold text-indigo-600">${item.quantity} ${item.unit}</span>
                            <p class="text-[9px] text-gray-400 uppercase">${item.category}</p>
                        </td>
                        <td class="hidden md:table-cell px-6 py-4 text-xs text-gray-500">${item.admin_name}</td>
                        <td class="px-3 md:px-6 py-4 text-center">
                            <span class="px-3 py-1 rounded-full text-[9px] font-black uppercase ${isClaimed ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'}">
                                ${aidStatusLabel(item.status)}
                            </span>
                        </td>
                        <td class="sticky right-0 z-10 bg-white shadow-[-4px_0_6px_-4px_rgba(0,0,0,0.08)] px-3 md:px-6 py-4 text-right">
                            ${isClaimed ?
                                `<button disabled class="px-4 py-2 bg-gray-100 text-gray-400 rounded-lg text-xs font-bold cursor-not-allowed">${t('btn_released')}</button>` :
                                `<button onclick="confirmClaim(${item.dist_id})" class="px-4 py-2 bg-[#11542e] text-white rounded-lg text-xs font-bold shadow-md shadow-green-900/20 hover:bg-green-800 transition-all">${t('btn_mark_claimed')}</button>`
                            }
                        </td>
                    </tr>
                `;
            });
        }

        // 4. Handle the Distribution Action
        function confirmClaim(id) {
            Swal.fire({
                title: t('sw_confirm_dist_title'),
                text: t('sw_confirm_dist_text'),
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#11542e',
                confirmButtonText: t('sw_yes_distributed')
            }).then(async (result) => {
                if (result.isConfirmed) {
                    try {
                        const res = await fetch('../../api/mao/mark_as_claimed.php', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ dist_id: id })
                        });
                        const data = await res.json();
                        if (data.status === 'success') {
                            Swal.fire(t('sw_distributed_title'), t('sw_distributed_text'), 'success');
                            loadAidList(); // Refresh the table
                        } else {
                            Swal.fire(t('sw_error_title'), data.message || t('sw_update_failed'), 'error');
                        }
                    } catch (e) {
                        Swal.fire(t('sw_error_title'), t('sw_server_conn_failed'), 'error');
                    }
                }
            });
        }

        // 5. Search + Filters
        function filterTable() {
            const q = document.getElementById("searchInput").value.toLowerCase();
            const statusFilter     = document.getElementById('filterStatus').value;
            const damageTypeFilter = document.getElementById('filterDamageType').value;
            const severityFilter   = document.getElementById('filterSeverity').value;
            const barangayFilter   = document.getElementById('filterBarangay').value;
            let dateFrom = document.getElementById('filterDateFrom').value;
            let dateTo   = document.getElementById('filterDateTo').value;

            const todayStr = (() => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); })();
            const earliestStr = '2024-01-01';
            if ((dateFrom && (dateFrom > todayStr || dateFrom < earliestStr)) || (dateTo && (dateTo > todayStr || dateTo < earliestStr))) {
                Swal.fire({ icon: 'warning', title: t('sw_date_bounds_title'), text: t('sw_date_bounds_text'), confirmButtonColor: '#11542e' });
                document.getElementById('filterDateFrom').value = '';
                document.getElementById('filterDateTo').value = '';
                dateFrom = '';
                dateTo = '';
            } else if (dateFrom && dateTo && dateFrom > dateTo) {
                Swal.fire({ icon: 'warning', title: t('sw_invalid_date_title'), text: t('sw_invalid_date_text'), confirmButtonColor: '#11542e' });
                dateFrom = '';
                dateTo = '';
            }

            const filtered = aidData.filter(i => {
                const idStr = (i.report_id || '').toString().toLowerCase();
                const qtyUnitStr = `${i.quantity} ${i.unit}`.toLowerCase();
                const matchesSearch = i.farmer_name.toLowerCase().includes(q)
                    || `aid-${i.dist_id}`.toLowerCase().includes(q)
                    || `rep-${idStr}`.includes(q)
                    || idStr.includes(q)
                    || (i.crop_name || '').toLowerCase().includes(q)
                    || (i.category || '').toLowerCase().includes(q)
                    || qtyUnitStr.includes(q)
                    || (i.admin_name || '').toLowerCase().includes(q)
                    || aidStatusLabel(i.status).toLowerCase().includes(q)
                    || (i.status || '').toLowerCase().includes(q);
                const matchesStatus      = !statusFilter || i.status === statusFilter;
                const matchesDamageType  = !damageTypeFilter || i.damage_type === damageTypeFilter;
                const matchesSeverity    = !severityFilter || i.damage_severity === severityFilter;
                const matchesBarangay    = !barangayFilter || parseBarangay(i.barangay_raw) === barangayFilter;
                // date_distributed comes back as "YYYY-MM-DD HH:MM:SS" — string-compare the date portion
                const rowDate = i.date_distributed ? i.date_distributed.slice(0, 10) : '';
                const matchesDateFrom = !dateFrom || (rowDate && rowDate >= dateFrom);
                const matchesDateTo   = !dateTo || (rowDate && rowDate <= dateTo);

                return matchesSearch && matchesStatus && matchesDamageType && matchesSeverity && matchesBarangay && matchesDateFrom && matchesDateTo;
            });
            filteredAidData = filtered;
            currentPage = 1; // any filter change starts back on page 1
            renderPage();
        }

        // 7. Pagination — 5 rows per page, so the filters and table both stay
        // visible without scrolling on a normal screen.
        const PAGE_SIZE = 5;
        let filteredAidData = [];
        let currentPage = 1;

        function renderPage() {
            const totalPages = Math.max(1, Math.ceil(filteredAidData.length / PAGE_SIZE));
            if (currentPage > totalPages) currentPage = totalPages;
            const start = (currentPage - 1) * PAGE_SIZE;
            const pageData = filteredAidData.slice(start, start + PAGE_SIZE);
            renderTable(pageData);

            const bar = document.getElementById('paginationBar');
            if (filteredAidData.length === 0) {
                bar.classList.add('hidden');
                return;
            }
            bar.classList.remove('hidden');
            const shownFrom = start + 1;
            const shownTo = Math.min(start + PAGE_SIZE, filteredAidData.length);
            document.getElementById('paginationInfo').innerText =
                `${t('pagination_showing')} ${shownFrom}-${shownTo} ${t('pagination_of')} ${filteredAidData.length}`;
            document.getElementById('prevPageBtn').disabled = currentPage <= 1;
            document.getElementById('nextPageBtn').disabled = currentPage >= totalPages;
        }

        function changePage(delta) {
            currentPage += delta;
            renderPage();
        }

        // 6. Secure Logout
        function confirmLogout() {
            Swal.fire({
                title: t('sw_signout_title'),
                text: t('sw_signout_text'),
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#11542e',
                confirmButtonText: t('sw_yes_signout')
            }).then(r => {
                if (r.isConfirmed) CropGuardSession.logout();
            });
        }
        // The idle timeout lives in session_guard.js now.
    </script>

        document.addEventListener('DOMContentLoaded', () => {
            loadMaoNavbar('inventory');
            initI18n(); // re-apply the saved language now that the sidebar has been injected
        });
    </script>
