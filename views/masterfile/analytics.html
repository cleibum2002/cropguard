<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics & Trends | CropGuard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="../../assets/js/i18n.js?v=1"></script>

    <script>
        fetch('../../api/auth/session_check.php').then(res => res.json()).then(data => {
            if (data.status !== 'active' || data.role.toLowerCase() !== 'admin') {
                window.location.href = '../../auth.html';
            } else {
                window.addEventListener('load', () => {
                    document.getElementById('adminName').innerText = data.user.fullname;
                    document.getElementById('adminNameSidebar').innerText = data.user.fullname;
                });
            }
        }).catch(() => window.location.href = '../../auth.html');
    </script>

<style>
    body { font-family: 'Inter', sans-serif; background-color: #f0f2f0; }
    .lang-link { cursor: pointer; }
    .lang-link.lang-active { color: #11542e; text-decoration: underline; }
    
    /* This CSS handles the injected sidebar */
    #sidebar-container { width: 0; flex-shrink: 0; } @media (min-width: 768px) { #sidebar-container { width: 16rem; } }
    #sidebar-container aside { 
        background-color: #11542e; 
        height: 100vh; 
        display: flex; 
        flex-direction: column; 
    }
    #sidebar-container nav { 
        flex: 1; 
        overflow-y: auto; 
        scrollbar-width: thin; 
    }
    
    .sidebar-link { display: flex; align-items: center; padding: 0.75rem 1rem; color: rgba(255, 255, 255, 0.6); border-radius: 0.75rem; font-size: 0.875rem; transition: all 0.2s ease; border-left: 3px solid transparent; }
    .sidebar-link.active { background: rgba(255,255,255,0.12); border-left-color: #f1c40f; color: white; }
    .sidebar-link:hover { background: rgba(255,255,255,0.06); color: white; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
</style>
</head>
<body class="h-screen flex overflow-hidden">

<div id="sidebar-container"></div>

    <div class="flex-1 flex flex-col h-screen overflow-hidden">
        <header class="h-16 flex items-center justify-between px-6 bg-white border-b border-gray-100 flex-shrink-0">
            <div class="flex items-center gap-4">
                <span class="text-base font-black text-gray-800" data-i18n="header_title">Analytics & Data Trends</span>
            </div>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-3 pl-4 border-l border-gray-100">
                    <div class="flex items-center gap-1.5 text-xs font-bold text-gray-400">
                        <span class="lang-link" data-lang="en" onclick="setLanguage('en')">English</span>
                        <span>|</span>
                        <span class="lang-link" data-lang="tl" onclick="setLanguage('tl')">Tagalog</span>
                    </div>
                    <div class="text-right">
                        <p id="adminName" class="text-xs font-black text-gray-800">Loading...</p>
                        <p class="text-[10px] text-amber-600 font-bold uppercase" data-i18n="role_admin">Admin</p>
                    </div>
                    <div class="w-9 h-9 bg-[#11542e] text-white rounded-xl flex items-center justify-center font-black text-sm">AD</div>
                </div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-6 bg-[#f0f2f0] custom-scrollbar">
            <div class="max-w-7xl mx-auto space-y-6">

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between">
                        <div>
                            <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1" data-i18n="stat_total_area">Total Area Damaged</p>
                            <h3 id="totalAreaStat" class="text-3xl font-black text-red-600">0.00 <span class="text-sm text-gray-400">Ha</span></h3>
                        </div>
                        <div class="w-12 h-12 bg-red-50 text-red-500 rounded-full flex items-center justify-center text-xl">
                            <i class="fa-solid fa-chart-area"></i>
                        </div>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between">
                        <div>
                            <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1" data-i18n="stat_top_crop">Most Affected Crop</p>
                            <h3 id="topCropStat" class="text-2xl font-black text-[#11542e]" data-i18n="loading">Loading...</h3>
                        </div>
                        <div class="w-12 h-12 bg-green-50 text-green-600 rounded-full flex items-center justify-center text-xl">
                            <i class="fa-solid fa-wheat-awn"></i>
                        </div>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between">
                        <div>
                            <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1" data-i18n="stat_top_cause">Primary Threat</p>
                            <h3 id="topCauseStat" class="text-2xl font-black text-blue-600" data-i18n="loading">Loading...</h3>
                        </div>
                        <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center text-xl">
                            <i class="fa-solid fa-cloud-showers-water"></i>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                        <h3 class="text-sm font-black text-gray-800 mb-4 uppercase tracking-widest" data-i18n="chart_title_cause">Incidents by Damage Type</h3>
                        <div class="relative h-64 w-full flex items-center justify-center">
                            <canvas id="causeChart"></canvas>
                        </div>
                    </div>

                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                        <h3 class="text-sm font-black text-gray-800 mb-4 uppercase tracking-widest" data-i18n="chart_title_crop">Hectares Lost per Crop</h3>
                        <div class="relative h-64 w-full">
                            <canvas id="cropAreaChart"></canvas>
                        </div>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-sm font-black text-gray-800 uppercase tracking-widest" data-i18n="chart_title_trend">Monthly Damage Trend (2026)</h3>
                    </div>
                    <div class="relative h-72 w-full">
                        <canvas id="trendChart"></canvas>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script>
        // Reusable EN / TL switcher (see assets/js/i18n.js)
        const translations = {
            en: {
                header_title: "Analytics & Data Trends", role_admin: "Admin", loading: "Loading...",
                stat_total_area: "Total Area Damaged", stat_top_crop: "Most Affected Crop", stat_top_cause: "Primary Threat",
                chart_title_cause: "Incidents by Damage Type", chart_title_crop: "Hectares Lost per Crop", chart_title_trend: "Monthly Damage Trend (2026)",
                label_hectares_damaged: "Hectares Damaged", label_reported_incidents: "Reported Incidents", label_na: "N/A",
                sw_error_title: "Error", sw_failed_load_analytics: "Failed to load analytics data.",
                sw_logout_title: "Logout?", sw_logout_text: "Are you sure you want to exit?", sw_yes_logout: "Yes, logout",
                sw_session_expired_title: "Session Expired", sw_session_expired_text: "You have been logged out due to 5 minutes of inactivity."
            },
            tl: {
                header_title: "Analytics at Uso ng Datos", role_admin: "Admin", loading: "Nilo-load...",
                stat_total_area: "Kabuuang Apektadong Sukat", stat_top_crop: "Pinakaapektadong Pananim", stat_top_cause: "Pangunahing Banta",
                chart_title_cause: "Insidente ayon sa Uri ng Pinsala", chart_title_crop: "Ektaryang Nawala kada Pananim", chart_title_trend: "Buwanang Uso ng Pinsala (2026)",
                label_hectares_damaged: "Nawalang Ektarya", label_reported_incidents: "Naiulat na Insidente", label_na: "N/A",
                sw_error_title: "Error", sw_failed_load_analytics: "Nabigong i-load ang datos ng analytics.",
                sw_logout_title: "Mag-logout?", sw_logout_text: "Sigurado ka bang gusto mong lumabas?", sw_yes_logout: "Oo, mag-logout",
                sw_session_expired_title: "Nag-expire ang Session", sw_session_expired_text: "Na-log out ka dahil sa 5 minuto ng hindi paggamit."
            }
        };

        // Called automatically by i18n.js whenever the user picks a new language.
        // Simplest correct approach: just reload + redraw everything so chart legends
        // and dataset labels pick up the new language too.
        function onLanguageChange() {
            loadAnalyticsData();
        }

        // Chart instances are tracked so we can destroy() the old one before redrawing —
        // otherwise Chart.js throws "Canvas is already in use" on every language switch.
        let causeChartInstance = null, cropChartInstance = null, trendChartInstance = null;

        document.addEventListener("DOMContentLoaded", loadAnalyticsData);

        async function loadAnalyticsData() {
            try {
                // We use your existing API to get all reports! No new PHP needed.
                const res = await fetch('../../api/masterfile/damage_report/get_all.php');
                const response = await res.json();

                if (response.status === 'success') {
                    // Filter out rejected or archived reports so analytics only show real damages
                    const validReports = (response.data || []).filter(r => 
                        r.status !== 'Rejected' && r.status !== 'Archived'
                    );
                    
                    processDataForCharts(validReports);
                }
            } catch (e) {
                console.error("Analytics Error:", e);
                Swal.fire(t('sw_error_title'), t('sw_failed_load_analytics'), 'error');
            }
        }

        function processDataForCharts(reports) {
            let totalArea = 0;
            const causeCounts = {};
            const cropAreas = {};
            const monthlyIncidents = { "Jan":0, "Feb":0, "Mar":0, "Apr":0, "May":0, "Jun":0, "Jul":0, "Aug":0, "Sep":0, "Oct":0, "Nov":0, "Dec":0 };

            reports.forEach(r => {
                // 1. Calculate Total Area
                const area = parseFloat(r.area) || 0;
                totalArea += area;

                // 2. Aggregate by Damage Type (Pest, Flood, etc.)
                const cause = r.damage_type || 'Unknown';
                causeCounts[cause] = (causeCounts[cause] || 0) + 1;

                // 3. Aggregate Area by Crop
                const crop = r.crop_name || 'Other';
                cropAreas[crop] = (cropAreas[crop] || 0) + area;

                // 4. Aggregate by Month for the Trend Line
                if (r.date) {
                    const dateObj = new Date(r.date.split(' ')[0]);
                    const monthName = dateObj.toLocaleString('en-US', { month: 'short' });
                    if (monthlyIncidents[monthName] !== undefined) {
                        monthlyIncidents[monthName] += 1;
                    }
                }
            });

            // Update Top Stats UI
            document.getElementById('totalAreaStat').innerHTML = `${totalArea.toFixed(2)} <span class="text-sm text-gray-400">Ha</span>`;
            
            // Find Top Crop
            let topCrop = t('label_na'); let maxCropVal = -1;
            for (let c in cropAreas) { if(cropAreas[c] > maxCropVal) { maxCropVal = cropAreas[c]; topCrop = c; } }
            document.getElementById('topCropStat').innerText = topCrop;

            // Find Top Cause
            let topCause = t('label_na'); let maxCauseVal = -1;
            for (let c in causeCounts) { if(causeCounts[c] > maxCauseVal) { maxCauseVal = causeCounts[c]; topCause = c; } }
            document.getElementById('topCauseStat').innerText = topCause;

            // DRAW THE CHARTS
            drawCauseChart(causeCounts);
            drawCropChart(cropAreas);
            drawTrendChart(monthlyIncidents);
        }

        function drawCauseChart(causeData) {
            const ctx = document.getElementById('causeChart').getContext('2d');
            if (causeChartInstance) causeChartInstance.destroy();
            causeChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(causeData),
                    datasets: [{
                        data: Object.values(causeData),
                        backgroundColor: ['#3b82f6', '#f59e0b', '#ef4444', '#10b981', '#8b5cf6'],
                        borderWidth: 0
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } } }
            });
        }

        function drawCropChart(cropData) {
            const ctx = document.getElementById('cropAreaChart').getContext('2d');
            if (cropChartInstance) cropChartInstance.destroy();
            cropChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Object.keys(cropData),
                    datasets: [{
                        label: t('label_hectares_damaged'),
                        data: Object.values(cropData),
                        backgroundColor: '#11542e',
                        borderRadius: 4
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
            });
        }

        function drawTrendChart(monthData) {
            const ctx = document.getElementById('trendChart').getContext('2d');
            if (trendChartInstance) trendChartInstance.destroy();
            trendChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: Object.keys(monthData),
                    datasets: [{
                        label: t('label_reported_incidents'),
                        data: Object.values(monthData),
                        borderColor: '#f59e0b',
                        backgroundColor: 'rgba(245, 158, 11, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4 // Makes the line curvy and smooth
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
            });
        }
function confirmLogout() {
            Swal.fire({
                title: t('sw_logout_title'),
                text: t('sw_logout_text'),
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#11542e',
                confirmButtonText: t('sw_yes_logout')
            }).then((result) => {
                if (result.isConfirmed) {
                    // Secure background API call
                    fetch('../../api/auth/logout.php')
                        .then(res => res.json())
                        .then(data => {
                            if (data.status === 'success') {
                                window.location.href = '../../auth.html';
                            }
                        })
                        .catch(err => {
                            console.error("Logout failed", err);
                            window.location.href = '../../auth.html'; // Fallback redirect
                        });
                }
            });
        }
    // ── IDLE TIMEOUT: 5 minutes ───────────────────────────────────
    let idleTimer;
    function resetIdleTimer() {
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => {
            Swal.fire({ icon: 'warning', title: t('sw_session_expired_title'), text: t('sw_session_expired_text'), confirmButtonColor: '#11542e', allowOutsideClick: false })
                .then(() => fetch('../../api/auth/logout.php').then(() => window.location.href = '../../auth.html'));
        }, 5 * 60 * 1000);
    }
    ['mousemove','keypress','click','scroll','touchstart','touchmove'].forEach(ev => document.addEventListener(ev, resetIdleTimer));
    resetIdleTimer();

</script>

<script src="../../assets/js/navbar_admin.js?v=2"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // PASS THE CORRECT PAGE KEY HERE
            loadAdminNavbar('analytics'); 
            initI18n();
        });
    </script>

</body>
</html>
