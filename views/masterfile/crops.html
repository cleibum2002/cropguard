<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crops Masterlist | CropGuard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        fetch('../../api/auth/session_check.php').then(res => res.json()).then(data => {
            if (data.status === 'active' && data.role.toLowerCase() === 'admin') {
                window.addEventListener('load', () => {
                    document.getElementById('adminName').innerText = data.user.fullname;
                    document.getElementById('adminNameSidebar').innerText = data.user.fullname;
                });
            } else { window.location.href = '../../auth.html'; }
        }).catch(() => { window.location.href = '../../auth.html'; });
    </script>
<style>
    body { font-family: 'Inter', sans-serif; background-color: #f0f2f0; }
    #sidebar-container { width: 16rem; flex-shrink: 0; }
    #sidebar-container aside { background-color: #11542e; height: 100vh; display: flex; flex-direction: column; }
    #sidebar-container nav { flex: 1; overflow-y: auto; scrollbar-width: thin; }
    .sidebar-link { display: flex; align-items: center; padding: 0.75rem 1rem; color: rgba(255,255,255,0.6); border-radius: 0.75rem; font-size: 0.875rem; transition: all 0.2s ease; border-left: 3px solid transparent; }
    .sidebar-link.active { background: rgba(255,255,255,0.12); border-left-color: #f1c40f; color: white; }
    .sidebar-link:hover { background: rgba(255,255,255,0.06); color: white; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
</style>
</head>
<body class="h-screen flex overflow-hidden">

<div id="sidebar-container"></div>

<div class="flex-1 flex flex-col h-screen overflow-hidden">

    <header class="h-16 flex items-center justify-between px-6 bg-white border-b border-gray-100 flex-shrink-0">
        <div class="flex items-center gap-4">
            <span class="text-base font-black text-gray-800">Crops Masterlist</span>
            <span class="bg-amber-100 text-amber-700 px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-wide">Admin Mode</span>
        </div>
        <div class="flex items-center gap-4">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-300 text-sm"></i>
                <input type="text" id="searchInput" onkeyup="filterCrops()" placeholder="Search crops or variety..."
                       class="bg-gray-50 border-none rounded-xl py-2 pl-10 pr-4 text-sm w-64 focus:ring-2 focus:ring-[#11542e] outline-none">
            </div>
            <div class="flex items-center gap-3 pl-4 border-l border-gray-100">
                <div class="relative">
                    <button id="notifBellBtn" onclick="toggleNotificationPanel()" class="relative w-9 h-9 bg-gray-50 rounded-xl flex items-center justify-center text-gray-400 hover:bg-gray-100">
                        <i class="fa-regular fa-bell text-sm"></i>
                        <span id="notifBadge" class="hidden absolute top-1 right-1 min-w-[16px] h-4 px-1 bg-red-500 rounded-full text-[9px] text-white font-black flex items-center justify-center">0</span>
                    </button>
                    <div id="notifPanel" class="hidden absolute right-0 top-12 w-80 bg-white rounded-2xl shadow-2xl border border-gray-100 z-[100] max-h-96 overflow-y-auto">
                        <div class="px-4 py-3 border-b border-gray-100">
                            <h4 class="text-xs font-black text-gray-800 uppercase tracking-widest">Notifications</h4>
                        </div>
                        <div id="notifList" class="divide-y divide-gray-50">
                            <p class="text-xs text-gray-400 italic text-center py-8">Loading...</p>
                        </div>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <div class="text-right">
                        <p id="adminName" class="text-xs font-black text-gray-800">Loading...</p>
                        <p class="text-[10px] text-amber-600 font-bold uppercase">Admin</p>
                    </div>
                    <div class="w-9 h-9 bg-[#11542e] text-white rounded-xl flex items-center justify-center font-black text-sm">AD</div>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto p-6 bg-[#f0f2f0]">
        <div class="max-w-7xl mx-auto">

            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
                <div>
                    <h2 class="text-2xl font-black text-gray-800 tracking-tight">Registered Commodities</h2>
                    <p class="text-gray-400 text-sm">DA Region X — Northern Mindanao Operations Center</p>
                </div>
                <div class="flex items-center gap-3">
                    <div class="bg-white p-1.5 rounded-xl border border-gray-100 flex items-center shadow-sm">
                        <button id="gridBtn" onclick="setView('grid')"
                                class="px-3 py-1.5 bg-[#11542e] text-white rounded-lg text-[11px] font-bold transition-all">
                            <i class="fa-solid fa-grip mr-1"></i> Grid
                        </button>
                        <button id="listBtn" onclick="setView('list')"
                                class="px-3 py-1.5 text-gray-400 rounded-lg text-[11px] font-bold transition-all hover:text-gray-600">
                            <i class="fa-solid fa-list mr-1"></i> List
                        </button>
                    </div>
                    <button onclick="openModal()"
                            class="bg-[#f1c40f] text-[#11542e] px-6 py-3 rounded-xl font-black shadow-lg shadow-yellow-500/20 hover:scale-105 transition-all flex items-center gap-2 text-sm">
                        <i class="fa-solid fa-plus"></i> REGISTER CROP
                    </button>
                </div>
            </div>

            <!-- Loading state -->
            <div id="loadingState" class="flex flex-col items-center justify-center py-20 text-gray-400">
                <i class="fa-solid fa-spinner fa-spin text-3xl mb-3 text-[#11542e]"></i>
                <p class="text-sm font-medium">Loading crops...</p>
            </div>

            <!-- Error state -->
            <div id="errorState" class="hidden flex flex-col items-center justify-center py-20 text-gray-400">
                <i class="fa-solid fa-circle-exclamation text-3xl mb-3 text-red-400"></i>
                <p class="text-sm font-medium text-red-500" id="errorMessage">Failed to load crops.</p>
                <button onclick="loadCrops()" class="mt-3 px-4 py-2 bg-[#11542e] text-white text-xs font-bold rounded-xl hover:bg-[#0c3d22] transition-all">
                    <i class="fa-solid fa-rotate-right mr-1"></i> Retry
                </button>
            </div>

            <!-- Grid view -->
            <div id="cropGrid" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>

            <!-- List view -->
            <div id="cropList" class="hidden bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-gray-50/60">
                        <tr>
                            <th class="px-6 py-4 text-[10px] font-black text-gray-400 uppercase tracking-widest">Crop Name</th>
                            <th class="px-6 py-4 text-[10px] font-black text-gray-400 uppercase tracking-widest">Type</th>
                            <th class="px-6 py-4 text-[10px] font-black text-gray-400 uppercase tracking-widest">Growth Period</th>
                            <th class="px-6 py-4 text-[10px] font-black text-gray-400 uppercase tracking-widest">Prod. Cost</th>
                            <th class="px-6 py-4 text-[10px] font-black text-gray-400 uppercase tracking-widest text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="cropListBody" class="divide-y divide-gray-50"></tbody>
                </table>
            </div>

        </div>
    </main>
</div>

<!-- ── Crop Modal ──────────────────────────────────────────────────────────── -->
<div id="cropModal" class="fixed inset-0 bg-[#11542e]/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-lg rounded-[2rem] shadow-2xl overflow-hidden">
        <div class="p-7 border-b border-gray-50 flex justify-between items-center">
            <h3 id="modalTitle" class="text-xl font-black text-gray-800">Register New Crop</h3>
            <button onclick="closeModal()"
                    class="w-9 h-9 bg-gray-50 text-gray-400 rounded-full flex items-center justify-center hover:bg-red-50 hover:text-red-500 transition-all text-lg font-bold">&times;</button>
        </div>
        <div class="p-7 space-y-4">
            <input type="hidden" id="cropId">

            <div>
                <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2">Crop Name / Variety</label>
                <input type="text" id="cropName"
                       class="w-full px-5 py-3.5 bg-gray-50 border-none rounded-xl focus:ring-2 focus:ring-[#11542e] outline-none text-sm"
                       placeholder="e.g. RC-222 (Tubigan)">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2">Commodity Type</label>
                    <select id="cropType" class="w-full px-5 py-3.5 bg-gray-50 border-none rounded-xl outline-none text-sm">
                        <option value="Rice">Rice</option>
                        <option value="Corn">Corn</option>
                        <option value="Banana">Banana</option>
                        <option value="Vegetables">Vegetables</option>
                        <option value="Eggplant">Eggplant</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2">Growth Duration</label>
                    <input type="text" id="cropPeriod" placeholder="e.g. 110 Days"
                           class="w-full px-5 py-3.5 bg-gray-50 border-none rounded-xl outline-none text-sm">
                </div>
            </div>

            <div>
                <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2">Std. Production Cost (₱)</label>
                <input type="number" id="cropProdCost" placeholder="e.g. 45000" min="0" step="0.01"
                       class="w-full px-5 py-3.5 bg-gray-50 border-none rounded-xl outline-none text-sm">
            </div>

            <div>
                <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2">Description</label>
                <textarea id="cropDesc" rows="3"
                          class="w-full px-5 py-3.5 bg-gray-50 border-none rounded-xl outline-none focus:ring-2 focus:ring-[#11542e] text-sm"
                          placeholder="Short description..."></textarea>
            </div>

            <div class="pt-4 flex gap-3">
                <button onclick="closeModal()"
                        class="flex-1 py-3.5 text-gray-400 font-bold hover:bg-gray-50 rounded-xl transition-all text-sm">Cancel</button>
                <button onclick="saveCrop()" id="saveBtn"
                        class="flex-[2] py-3.5 bg-[#11542e] text-white rounded-xl font-bold shadow-lg shadow-green-900/20 hover:bg-[#0c3d22] transition-all text-sm">
                    Save Crop
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    // ── All API calls point to api/crop_type/ ─────────────────────────────────
    const API_BASE = "../../api/masterfile/crop_type/";

    let allCrops = [], filteredCrops = [], currentView = 'grid';

    const cropIcons = {
        Rice: 'fa-seedling', Corn: 'fa-wheat-awn',
        Banana: 'fa-leaf',   Vegetables: 'fa-carrot',
        Eggplant: 'fa-pepper-hot', Other: 'fa-seedling'
    };
    const cropColors = {
        Rice: 'bg-green-50 text-[#11542e]',   Corn: 'bg-yellow-50 text-yellow-700',
        Banana: 'bg-lime-50 text-lime-700',    Vegetables: 'bg-emerald-50 text-emerald-700',
        Eggplant: 'bg-purple-50 text-purple-700', Other: 'bg-gray-50 text-gray-600'
    };

    document.addEventListener("DOMContentLoaded", loadCrops);
    document.addEventListener("DOMContentLoaded", loadAdminNotifications);

    // ─── NOTIFICATIONS ─────────────────────────────────────────────────
    async function loadAdminNotifications() {
        try {
            const res = await fetch('../../api/dashboard/admin_notifications.php?action=fetch');
            const result = await res.json();
            if (result.status === 'success') {
                renderNotificationList(result.data);
                const badge = document.getElementById('notifBadge');
                if (result.unread > 0) {
                    badge.textContent = result.unread > 9 ? '9+' : result.unread;
                    badge.classList.remove('hidden');
                } else {
                    badge.classList.add('hidden');
                }
            }
        } catch (e) {
            console.error('Failed to load notifications:', e);
        }
    }

    function renderNotificationList(items) {
        const list = document.getElementById('notifList');
        if (!items || items.length === 0) {
            list.innerHTML = '<p class="text-xs text-gray-400 italic text-center py-8">No notifications yet.</p>';
            return;
        }
        list.innerHTML = items.map(n => `
            <div class="px-4 py-3 ${n.Is_Read == 0 ? 'bg-green-50/40' : ''} hover:bg-gray-50 transition-colors ${n.Redirect_URL ? 'cursor-pointer flex items-center justify-between gap-3' : ''}" ${n.Redirect_URL ? `onclick="window.location.href='${n.Redirect_URL}'"` : ''}>
                <div class="min-w-0">
                    <p class="text-xs text-gray-700 leading-relaxed">${n.Message}</p>
                    <p class="text-[10px] text-gray-400 font-bold mt-1">${n.DateStr}</p>
                </div>
                ${n.Redirect_URL ? '<span class="flex-shrink-0 text-[9px] font-black text-white bg-[#11542e] px-2.5 py-1.5 rounded-full uppercase tracking-wide whitespace-nowrap flex items-center gap-1">View <i class="fa-solid fa-arrow-right"></i></span>' : ''}
            </div>
        `).join('');
    }

    function toggleNotificationPanel() {
        const panel = document.getElementById('notifPanel');
        const isHidden = panel.classList.contains('hidden');
        if (isHidden) {
            panel.classList.remove('hidden');
            fetch('../../api/dashboard/admin_notifications.php?action=read')
                .then(() => { document.getElementById('notifBadge').classList.add('hidden'); });
        } else {
            panel.classList.add('hidden');
        }
    }

    document.addEventListener('click', (e) => {
        const panel = document.getElementById('notifPanel');
        const btn = document.getElementById('notifBellBtn');
        if (panel && !panel.classList.contains('hidden') && !panel.contains(e.target) && !btn.contains(e.target)) {
            panel.classList.add('hidden');
        }
    });

    // ── Load ──────────────────────────────────────────────────────────────────
    async function loadCrops() {
        showState('loading');
        try {
            const res  = await fetch(API_BASE + "get_all.php");
            const raw  = await res.text();
            let json;
            try { json = JSON.parse(raw); }
            catch { throw new Error("Server returned non-JSON: " + raw.substring(0, 200)); }

            if (json.status !== 'success') throw new Error(json.message || 'Unknown error');

            allCrops     = json.data || [];
            filteredCrops = [...allCrops];

            if (!allCrops.length) {
                showState('empty');
                return;
            }
            showState(currentView);
            renderCrops();

        } catch (e) {
            showState('error');
            document.getElementById('errorMessage').innerText = e.message;
        }
    }

    function showState(state) {
        document.getElementById('loadingState').classList.add('hidden');
        document.getElementById('errorState').classList.add('hidden');
        document.getElementById('cropGrid').classList.add('hidden');
        document.getElementById('cropList').classList.add('hidden');

        if (state === 'loading') {
            document.getElementById('loadingState').classList.remove('hidden');
        } else if (state === 'error' || state === 'empty') {
            document.getElementById('errorState').classList.remove('hidden');
            if (state === 'empty') {
                document.getElementById('errorMessage').innerText = 'No crops registered yet.';
            }
        } else if (state === 'grid') {
            document.getElementById('cropGrid').classList.remove('hidden');
        } else if (state === 'list') {
            document.getElementById('cropList').classList.remove('hidden');
        }
    }

    // ── Render ────────────────────────────────────────────────────────────────
    function renderCrops() {
        if (currentView === 'grid') renderGrid();
        else renderListView();
    }

    function renderGrid() {
        const grid = document.getElementById('cropGrid');
        if (!filteredCrops.length) {
            grid.innerHTML = '<div class="col-span-3 py-16 text-center text-gray-400 italic">No crops found.</div>';
            return;
        }
        grid.innerHTML = filteredCrops.map(crop => {
            const icon  = cropIcons[crop.type]  || 'fa-seedling';
            const color = cropColors[crop.type] || 'bg-green-50 text-[#11542e]';
            const cost  = crop.prod_cost
                ? '₱' + parseFloat(crop.prod_cost).toLocaleString('en-PH', { minimumFractionDigits: 2 })
                : 'N/A';
            return `
            <div class="crop-card bg-white p-7 rounded-2xl border border-gray-100 shadow-sm group">
                <div class="flex justify-between items-start mb-5">
                    <div class="w-14 h-14 ${color} rounded-2xl flex items-center justify-center text-xl group-hover:bg-[#11542e] group-hover:text-white transition-all duration-300">
                        <i class="fa-solid ${icon}"></i>
                    </div>
                    <span class="px-2.5 py-1 bg-amber-100 text-amber-700 rounded-full text-[9px] font-black uppercase tracking-widest">Certified</span>
                </div>
                <p class="text-[10px] font-black text-gray-300 uppercase tracking-[0.2em] mb-1">${crop.type || 'Unknown'} Variety</p>
                <h3 class="text-lg font-black text-gray-800 mb-2 leading-snug">${crop.name}</h3>
                <p class="text-xs text-gray-400 mb-4 line-clamp-2">${crop.description || 'No description provided.'}</p>
                <div class="flex items-center gap-2 mb-5 flex-wrap">
                    <div class="flex items-center gap-1.5 text-[11px] font-bold text-gray-400 bg-gray-50 px-3 py-1.5 rounded-full">
                        <i class="fa-regular fa-clock text-[#f1c40f]"></i> ${crop.period || 'N/A'}
                    </div>
                    <div class="flex items-center gap-1.5 text-[11px] font-bold text-gray-400 bg-gray-50 px-3 py-1.5 rounded-full">
                        <i class="fa-solid fa-peso-sign text-[#11542e]"></i> ${cost}
                    </div>
                </div>
                <div class="flex gap-2">
                    <button onclick="viewInfo(${crop.id})"
                            class="flex-1 py-2.5 bg-gray-50 text-gray-600 rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-[#11542e] hover:text-white transition-all">
                        Details
                    </button>
                    <button onclick="editCrop(${crop.id})"
                            class="w-10 h-10 flex items-center justify-center bg-blue-50 text-blue-500 rounded-xl hover:bg-blue-500 hover:text-white transition-all">
                        <i class="fa-solid fa-pen text-xs"></i>
                    </button>
                    <button onclick="confirmDelete(${crop.id})"
                            class="w-10 h-10 flex items-center justify-center bg-red-50 text-red-400 rounded-xl hover:bg-red-500 hover:text-white transition-all">
                        <i class="fa-solid fa-trash-can text-xs"></i>
                    </button>
                </div>
            </div>`;
        }).join('');
    }

    function renderListView() {
        const tbody = document.getElementById('cropListBody');
        if (!filteredCrops.length) {
            tbody.innerHTML = '<tr><td colspan="5" class="px-6 py-10 text-center text-gray-400 italic">No crops found.</td></tr>';
            return;
        }
        tbody.innerHTML = filteredCrops.map(crop => {
            const cost = crop.prod_cost
                ? '₱' + parseFloat(crop.prod_cost).toLocaleString('en-PH', { minimumFractionDigits: 2 })
                : '—';
            return `
            <tr class="hover:bg-gray-50/60 transition-all">
                <td class="px-6 py-4">
                    <p class="text-sm font-black text-gray-800">${crop.name}</p>
                    <p class="text-[10px] text-gray-400 mt-0.5">${crop.description || ''}</p>
                </td>
                <td class="px-6 py-4">
                    <span class="px-3 py-1 bg-green-50 text-green-700 rounded-full text-[10px] font-bold">${crop.type || '—'}</span>
                </td>
                <td class="px-6 py-4 text-sm text-gray-500">${crop.period || '—'}</td>
                <td class="px-6 py-4 text-sm text-gray-500">${cost}</td>
                <td class="px-6 py-4 text-right">
                    <div class="flex justify-end gap-2">
                        <button onclick="editCrop(${crop.id})"
                                class="w-9 h-9 bg-blue-50 text-blue-500 rounded-xl hover:bg-blue-500 hover:text-white transition-all flex items-center justify-center">
                            <i class="fa-solid fa-pen text-xs"></i>
                        </button>
                        <button onclick="confirmDelete(${crop.id})"
                                class="w-9 h-9 bg-red-50 text-red-400 rounded-xl hover:bg-red-500 hover:text-white transition-all flex items-center justify-center">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    </div>
                </td>
            </tr>`;
        }).join('');
    }

    // ── View toggle ───────────────────────────────────────────────────────────
    function setView(view) {
        currentView = view;
        showState(view);
        document.getElementById('gridBtn').className = view === 'grid'
            ? 'px-3 py-1.5 bg-[#11542e] text-white rounded-lg text-[11px] font-bold transition-all'
            : 'px-3 py-1.5 text-gray-400 rounded-lg text-[11px] font-bold transition-all hover:text-gray-600';
        document.getElementById('listBtn').className = view === 'list'
            ? 'px-3 py-1.5 bg-[#11542e] text-white rounded-lg text-[11px] font-bold transition-all'
            : 'px-3 py-1.5 text-gray-400 rounded-lg text-[11px] font-bold transition-all hover:text-gray-600';
        renderCrops();
    }

    function filterCrops() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        filteredCrops = allCrops.filter(c =>
            c.name.toLowerCase().includes(q) ||
            (c.type && c.type.toLowerCase().includes(q))
        );
        renderCrops();
    }

    // ── Modal ─────────────────────────────────────────────────────────────────
    function openModal() {
        document.getElementById('modalTitle').innerText = "Register New Crop";
        document.getElementById('cropId').value      = "";
        document.getElementById('cropName').value    = "";
        document.getElementById('cropType').value    = "Rice";
        document.getElementById('cropPeriod').value  = "";
        document.getElementById('cropProdCost').value = "";
        document.getElementById('cropDesc').value    = "";
        document.getElementById('cropModal').classList.remove('hidden');
    }

    function editCrop(id) {
        const crop = allCrops.find(c => c.id == id);
        if (!crop) return;
        document.getElementById('modalTitle').innerText   = "Edit Crop";
        document.getElementById('cropId').value           = crop.id;
        document.getElementById('cropName').value         = crop.name;
        document.getElementById('cropType').value         = crop.type || "Rice";
        document.getElementById('cropPeriod').value       = crop.period || "";
        document.getElementById('cropProdCost').value     = crop.prod_cost || "";
        document.getElementById('cropDesc').value         = crop.description || "";
        document.getElementById('cropModal').classList.remove('hidden');
    }

    function closeModal() { document.getElementById('cropModal').classList.add('hidden'); }

    function viewInfo(id) {
        const crop = allCrops.find(c => c.id == id);
        if (!crop) return;
        const cost = crop.prod_cost
            ? '₱' + parseFloat(crop.prod_cost).toLocaleString('en-PH', { minimumFractionDigits: 2 })
            : 'N/A';
        Swal.fire({
            title: crop.name,
            html: `
                <div class="text-left space-y-2 text-sm text-gray-600">
                    <p><strong class="text-gray-700">Type:</strong> ${crop.type || '—'}</p>
                    <p><strong class="text-gray-700">Growth Duration:</strong> ${crop.period || '—'}</p>
                    <p><strong class="text-gray-700">Production Cost:</strong> ${cost}</p>
                    <p><strong class="text-gray-700">Description:</strong> ${crop.description || 'No description provided.'}</p>
                </div>`,
            confirmButtonColor: '#11542e'
        });
    }

    // ── Save (create or update) ───────────────────────────────────────────────
    async function saveCrop() {
        const id   = document.getElementById('cropId').value;
        const name = document.getElementById('cropName').value.trim();

        if (!name) { Swal.fire("Required", "Please enter the crop name.", "warning"); return; }

        const payload = {
            name,
            type:        document.getElementById('cropType').value,
            period:      document.getElementById('cropPeriod').value.trim(),
            prod_cost:   parseFloat(document.getElementById('cropProdCost').value) || 0,
            description: document.getElementById('cropDesc').value.trim()
        };
        if (id) payload.id = id;

        const btn = document.getElementById('saveBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Saving...';

        try {
            const res  = await fetch(API_BASE + (id ? "update.php" : "create.php"), {
                method:  "POST",
                headers: { "Content-Type": "application/json" },
                body:    JSON.stringify(payload)
            });
            const raw  = await res.text();
            let result;
            try { result = JSON.parse(raw); }
            catch { throw new Error("Server error: " + raw.substring(0, 200)); }

            if (result.status === 'success') {
                Swal.fire({ icon: 'success', title: 'Saved!', text: result.message || 'Crop saved successfully.', showConfirmButton: false, timer: 1500 });
                closeModal();
                loadCrops();
            } else {
                Swal.fire('Error', result.message, 'error');
            }
        } catch (e) {
            Swal.fire('Error', e.message, 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = 'Save Crop';
        }
    }

    // ── Delete ────────────────────────────────────────────────────────────────
    function confirmDelete(id) {
        Swal.fire({
            title: 'Remove Crop?',
            text:  "This crop will be removed from the masterlist.",
            icon:  'warning',
            showCancelButton:    true,
            confirmButtonColor:  '#d33',
            cancelButtonColor:   '#11542e',
            confirmButtonText:   'Yes, Remove'
        }).then(async r => {
            if (!r.isConfirmed) return;
            try {
                const res    = await fetch(API_BASE + "delete.php", {
                    method:  "POST",
                    headers: { "Content-Type": "application/json" },
                    body:    JSON.stringify({ id })
                });
                const raw    = await res.text();
                const result = JSON.parse(raw);
                if (result.status === 'success') {
                    Swal.fire({ icon: 'success', title: 'Removed!', showConfirmButton: false, timer: 1500 });
                    loadCrops();
                } else {
                    Swal.fire('Error', result.message, 'error');
                }
            } catch (e) {
                Swal.fire('Error', e.message, 'error');
            }
        });
    }

    // ── Logout & idle ─────────────────────────────────────────────────────────
    function confirmLogout() {
        Swal.fire({
            title: 'Logout?', text: "Are you sure you want to exit?",
            icon: 'warning', showCancelButton: true,
            confirmButtonColor: '#11542e', confirmButtonText: 'Yes, logout'
        }).then(result => {
            if (result.isConfirmed)
                fetch('../../api/auth/logout.php')
                    .then(() => window.location.href = '../../auth.html')
                    .catch(() => window.location.href = '../../auth.html');
        });
    }

    let idleTimer;
    function resetIdleTimer() {
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => {
            Swal.fire({
                icon: 'warning', title: 'Session Expired',
                text: 'You have been logged out due to inactivity.',
                confirmButtonColor: '#11542e', allowOutsideClick: false
            }).then(() => {
                fetch('../../api/auth/logout.php').then(() => window.location.href = '../../auth.html');
            });
        }, 5 * 60 * 1000);
    }
    ['mousemove','keypress','click','scroll','touchstart','touchmove'].forEach(ev => document.addEventListener(ev, resetIdleTimer));
    resetIdleTimer();
</script>
