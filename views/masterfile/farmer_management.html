<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Management | CropGuard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <script>
        fetch('../../api/auth/session_check.php').then(res => res.json()).then(data => {
            if (data.status !== 'active' || data.role.toLowerCase() !== 'admin') {
                window.location.href = '../../auth.html';
            } else {
                window.addEventListener('load', () => {
                    document.getElementById('adminNameSidebar').innerText = data.user.fullname;
                });
            }
        }).catch(() => window.location.href = '../../auth.html');
    </script>

<style>
    body { font-family: 'Inter', sans-serif; background-color: #f0f2f0; }
    
    /* This CSS handles the injected sidebar */
    #sidebar-container { width: 16rem; flex-shrink: 0; }
    #sidebar-container aside { 
        background-color: #11542e; 
        height: 100vh; 
        display: flex; 
        flex-direction: column; 
    }
    #sidebar-container nav { 
        flex: 1; 
        overflow-y: auto; 
        scrollbar-width: thin; 
    }
    
    .sidebar-link { display: flex; align-items: center; padding: 0.75rem 1rem; color: rgba(255, 255, 255, 0.6); border-radius: 0.75rem; font-size: 0.875rem; transition: all 0.2s ease; border-left: 3px solid transparent; }
    .sidebar-link.active { background: rgba(255,255,255,0.12); border-left-color: #f1c40f; color: white; }
    .sidebar-link:hover { background: rgba(255,255,255,0.06); color: white; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
</style>
</head>
<body class="h-screen flex overflow-hidden">

<div id="sidebar-container"></div>

    <div class="flex-1 flex flex-col h-screen overflow-hidden">
        <header class="h-16 flex items-center justify-between px-6 bg-white border-b border-gray-100 flex-shrink-0">
            <div class="flex items-center gap-4">
                <span class="text-base font-black text-gray-800">Farmer Management</span>
                <span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-wide">RSBSA Registry</span>
            </div>
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-300 text-sm"></i>
                <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Search farmer or RSBSA..."
                    class="bg-gray-50 border-none rounded-xl py-2 pl-10 pr-4 text-sm w-72 focus:ring-2 focus:ring-[#11542e] outline-none">
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-6 bg-[#f0f2f0] custom-scrollbar">
            <div class="max-w-7xl mx-auto">

                <div class="grid grid-cols-3 gap-4 mb-6">
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                        <p class="text-[10px] font-black text-gray-400 uppercase mb-2">Total Farmers</p>
                        <p id="statTotal" class="text-3xl font-black text-gray-800">0</p>
                    </div>
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                        <p class="text-[10px] font-black text-gray-400 uppercase mb-2">With RSBSA</p>
                        <p id="statWithRSBSA" class="text-3xl font-black text-green-600">0</p>
                    </div>
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                        <p class="text-[10px] font-black text-gray-400 uppercase mb-2">Missing RSBSA</p>
                        <p id="statMissing" class="text-3xl font-black text-red-500">0</p>
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-gray-50 border-b border-gray-100">
                                <tr>
                                    <th class="px-6 py-4 text-[10px] font-black text-gray-400 uppercase tracking-widest">Farmer</th>
                                    <th class="px-6 py-4 text-[10px] font-black text-gray-400 uppercase tracking-widest">Contact</th>
                                    <th class="px-6 py-4 text-[10px] font-black text-gray-400 uppercase tracking-widest">RSBSA Number</th>
                                    <th class="px-6 py-4 text-[10px] font-black text-gray-400 uppercase tracking-widest text-center">RSBSA Status</th>
                                    <th class="px-6 py-4 text-[10px] font-black text-gray-400 uppercase tracking-widest text-center">Account</th>
                                    <th class="px-6 py-4 text-[10px] font-black text-gray-400 uppercase tracking-widest text-right">Action</th>
                                </tr>
                            </thead>
                            <tbody id="farmerTableBody" class="divide-y divide-gray-50"></tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- EDIT MODAL -->
    <div id="editModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md">
            <div class="flex items-center justify-between p-6 border-b border-gray-100">
                <div>
                    <h2 class="text-lg font-black text-gray-800">Edit RSBSA Number</h2>
                    <p id="editFarmerName" class="text-xs text-gray-400 mt-1"></p>
                </div>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-xl">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <input type="hidden" id="editUserId">
                <div>
                    <label class="block text-[10px] font-black text-gray-400 uppercase mb-2">RSBSA Number</label>
                    <input type="text" id="editRSBSA" placeholder="e.g. 202-5985-77856"
                        class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-[#11542e]">
                    <p class="text-[10px] text-gray-400 mt-1">Format: ###-####-##### (e.g. 202-5985-77856)</p>
                </div>
            </div>
            <div class="flex gap-3 p-6 border-t border-gray-100">
                <button onclick="closeModal()" class="flex-1 py-3 rounded-xl border border-gray-200 text-sm font-bold text-gray-500 hover:bg-gray-50">Cancel</button>
                <button onclick="saveRSBSA()" class="flex-1 py-3 rounded-xl bg-[#11542e] text-white text-sm font-bold shadow-md hover:bg-green-800">
                    <i class="fa-solid fa-floppy-disk mr-2"></i> Save
                </button>
            </div>
        </div>
    </div>

    <script>
        let allFarmers = [];

        document.addEventListener('DOMContentLoaded', loadFarmers);

        async function loadFarmers() {
            try {
                const res  = await fetch('../../api/masterfile/farmers/get_all.php');
                const data = await res.json();
                if (data.status === 'success') {
                    allFarmers = data.data;
                    renderTable(allFarmers);
                    updateStats(allFarmers);
                }
            } catch(e) { console.error('Load failed', e); }
        }

        function updateStats(data) {
            const withRSBSA = data.filter(f => f.rsbsa_no && f.rsbsa_no.trim() !== '').length;
            document.getElementById('statTotal').innerText     = data.length;
            document.getElementById('statWithRSBSA').innerText = withRSBSA;
            document.getElementById('statMissing').innerText   = data.length - withRSBSA;
        }

        function renderTable(data) {
            const tbody = document.getElementById('farmerTableBody');
            if (!data.length) {
                tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-12 text-center text-gray-400 italic">No farmers found.</td></tr>';
                return;
            }
            tbody.innerHTML = data.map(f => {
                const hasRSBSA    = f.rsbsa_no && f.rsbsa_no.trim() !== '';
                const validFormat = hasRSBSA && /^\d{3}-\d{4}-\d{5}$/.test(f.rsbsa_no);
                const isActive    = f.status === 'Active';
                const rsbsaBadge  = !hasRSBSA
                    ? `<span class="px-2 py-1 bg-red-100 text-red-600 rounded-full text-[9px] font-black uppercase">Missing</span>`
                    : validFormat
                        ? `<span class="px-2 py-1 bg-green-100 text-green-700 rounded-full text-[9px] font-black uppercase">Verified</span>`
                        : `<span class="px-2 py-1 bg-amber-100 text-amber-600 rounded-full text-[9px] font-black uppercase">Invalid Format</span>`;
                return `
                <tr class="hover:bg-gray-50/50 transition-colors">
                    <td class="px-6 py-4">
                        <p class="text-sm font-black text-gray-800">${f.fullname}</p>
                        <p class="text-[10px] text-gray-400">${f.email}</p>
                    </td>
                    <td class="px-6 py-4 text-xs text-gray-600">${f.contact || '—'}</td>
                    <td class="px-6 py-4 font-mono text-xs text-gray-700">${f.rsbsa_no || '—'}</td>
                    <td class="px-6 py-4 text-center">${rsbsaBadge}</td>
                    <td class="px-6 py-4 text-center">
                        <span class="px-2 py-1 rounded-full text-[9px] font-black uppercase ${isActive ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-600'}">
                            ${f.status}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-right">
                        <button onclick="openModal(${f.id}, '${f.fullname.replace(/'/g, "\\'")}', '${f.rsbsa_no || ''}')"
                            class="px-3 py-2 bg-[#11542e] text-white rounded-xl text-[10px] font-black hover:bg-green-800 transition-all">
                            <i class="fa-solid fa-pen mr-1"></i> Edit RSBSA
                        </button>
                    </td>
                </tr>`;
            }).join('');
        }

        function filterTable() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            renderTable(allFarmers.filter(f =>
                f.fullname.toLowerCase().includes(q) ||
                (f.rsbsa_no || '').toLowerCase().includes(q) ||
                (f.email || '').toLowerCase().includes(q)
            ));
        }

        function openModal(id, name, rsbsa) {
            document.getElementById('editUserId').value        = id;
            document.getElementById('editFarmerName').innerText = name;
            document.getElementById('editRSBSA').value         = rsbsa;
            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('editModal').classList.add('hidden'); }

        async function saveRSBSA() {
            const id    = document.getElementById('editUserId').value;
            const rsbsa = document.getElementById('editRSBSA').value.trim();

            if (rsbsa && !/^\d{3}-\d{4}-\d{5}$/.test(rsbsa)) {
                Swal.fire('Invalid Format', 'RSBSA must follow: ###-####-##### (e.g. 202-5985-77856)', 'warning');
                return;
            }

            try {
                const res  = await fetch('../../api/masterfile/farmers/update_rsbsa.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, rsbsa_no: rsbsa })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    Swal.fire({ icon: 'success', title: 'Saved!', text: 'RSBSA number updated.', timer: 1500, showConfirmButton: false });
                    closeModal();
                    loadFarmers();
                } else {
                    Swal.fire('Error', data.message || 'Update failed.', 'error');
                }
            } catch(e) { Swal.fire('Error', 'Server connection failed.', 'error'); }
        }

        function confirmLogout() {
            Swal.fire({ title: 'Logout?', icon: 'question', showCancelButton: true, confirmButtonColor: '#11542e', confirmButtonText: 'Logout' })
            .then(r => { if (r.isConfirmed) fetch('../../api/auth/logout.php').then(() => window.location.href = '../../auth.html'); });
        }

        // ── IDLE TIMEOUT: 5 minutes ───────────────────────────────────
        let idleTimer;
        function resetIdleTimer() {
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                Swal.fire({ icon: 'warning', title: 'Session Expired', text: 'You have been logged out due to 5 minutes of inactivity.', confirmButtonColor: '#11542e', allowOutsideClick: false })
                    .then(() => fetch('../../api/auth/logout.php').then(() => window.location.href = '../../auth.html'));
            }, 5 * 60 * 1000);
        }
        ['mousemove','keypress','click','scroll','touchstart','touchmove'].forEach(ev => document.addEventListener(ev, resetIdleTimer));
        resetIdleTimer();


    </script>

<script src="../../assets/js/navbar_admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // PASS THE CORRECT PAGE KEY HERE
            loadAdminNavbar('farmers'); 
        });
    </script>

</body>
</html>
