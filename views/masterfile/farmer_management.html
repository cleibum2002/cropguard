<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Management | CropGuard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="../../assets/js/i18n.js?v=1"></script>
    <script src="../../assets/js/session_guard.js?v=5"></script>

    <script>
        CropGuardSession.protect({
            roles: ['admin'],
            onReady: (data) => {
                document.getElementById('adminNameSidebar').innerText = data.user.fullname;
            }
        });
    </script>

<style>
    body { font-family: 'Inter', sans-serif; background-color: #f0f2f0; }
    .lang-link { cursor: pointer; }
    .lang-link.lang-active { color: #11542e; text-decoration: underline; }
    
    /* This CSS handles the injected sidebar */
    #sidebar-container { width: 16rem; flex-shrink: 0; }
    #sidebar-container aside { 
        background-color: #11542e; 
        height: 100vh; 
        display: flex; 
        flex-direction: column; 
    }
    #sidebar-container nav { 
        flex: 1; 
        overflow-y: auto; 
        scrollbar-width: thin; 
    }
    
    .sidebar-link { display: flex; align-items: center; padding: 0.75rem 1rem; color: rgba(255, 255, 255, 0.6); border-radius: 0.75rem; font-size: 0.875rem; transition: all 0.2s ease; border-left: 3px solid transparent; }
    .sidebar-link.active { background: rgba(255,255,255,0.12); border-left-color: #f1c40f; color: white; }
    .sidebar-link:hover { background: rgba(255,255,255,0.06); color: white; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
</style>
</head>
<body class="h-screen flex overflow-hidden" style="display:none!important">

<div id="sidebar-container"></div>

    <div class="flex-1 flex flex-col h-screen overflow-hidden">
                <header class="min-h-[4rem] flex flex-wrap items-center justify-between gap-3 px-4 sm:px-6 py-3 bg-white border-b border-gray-100 flex-shrink-0">
            <div class="flex items-center gap-2 sm:gap-4">
                <span class="text-xs sm:text-base font-black text-gray-800" data-i18n="header_title">Farmer Management</span>
                <span class="hidden sm:inline-block bg-green-100 text-green-700 px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-wide" data-i18n="badge_rsbsa_registry">RSBSA Registry</span>
            </div>
            <div class="ml-auto sm:ml-0 flex items-center gap-1.5 text-xs font-bold text-gray-400">
                <span class="lang-link" data-lang="en" onclick="setLanguage('en')">ENG</span>
                <span>|</span>
                <span class="lang-link" data-lang="tl" onclick="setLanguage('tl')">FIL</span>
            </div>
            <div class="w-full sm:w-auto flex flex-wrap items-center gap-3">
                <div class="relative flex-1 sm:flex-none min-w-0">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-300 text-sm"></i>
                    <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Search farmer or RSBSA..." data-i18n-placeholder="search_placeholder"
                        class="bg-gray-50 border-none rounded-xl py-2 pl-10 pr-4 text-sm w-full sm:w-72 focus:ring-2 focus:ring-[#11542e] outline-none">
                </div>
                <select id="rsbsaFilter" onchange="filterTable()" class="bg-gray-50 border-none rounded-xl py-2 px-4 text-sm text-gray-600 font-bold focus:ring-2 focus:ring-[#11542e] outline-none cursor-pointer">
                    <option value="ALL" data-i18n="filter_all_rsbsa">All RSBSA</option>
                    <option value="Verified" data-i18n="badge_verified">Verified</option>
                    <option value="Missing" data-i18n="badge_missing">Missing</option>
                    <option value="Invalid" data-i18n="badge_invalid_format">Invalid Format</option>
                </select>
                <select id="statusFilter" onchange="filterTable()" class="bg-gray-50 border-none rounded-xl py-2 px-4 text-sm text-gray-600 font-bold focus:ring-2 focus:ring-[#11542e] outline-none cursor-pointer">
                    <option value="ALL" data-i18n="filter_all_statuses">All Statuses</option>
                    <option value="Active" data-i18n="status_active">Active</option>
                    <option value="Inactive" data-i18n="status_inactive">Inactive</option>
                </select>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-6 bg-[#f0f2f0] custom-scrollbar">
            <div class="max-w-7xl mx-auto">

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                        <p class="text-[10px] font-black text-gray-400 uppercase mb-2" data-i18n="stat_total_farmers">Total Farmers</p>
                        <p id="statTotal" class="text-3xl font-black text-gray-800">0</p>
                    </div>
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                        <p class="text-[10px] font-black text-gray-400 uppercase mb-2" data-i18n="stat_with_rsbsa">With RSBSA</p>
                        <p id="statWithRSBSA" class="text-3xl font-black text-green-600">0</p>
                    </div>
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                        <p class="text-[10px] font-black text-gray-400 uppercase mb-2" data-i18n="stat_missing_rsbsa">Missing RSBSA</p>
                        <p id="statMissing" class="text-3xl font-black text-red-500">0</p>
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-gray-50 border-b border-gray-100">
                                <tr>
                                    <th class="px-3 md:px-6 py-4 text-[10px] font-black text-gray-400 uppercase tracking-widest" data-i18n="th_farmer">Farmer</th>
                                    <th class="hidden md:table-cell px-6 py-4 text-[10px] font-black text-gray-400 uppercase tracking-widest" data-i18n="th_contact">Contact</th>
                                    <th class="px-3 md:px-6 py-4 text-[10px] font-black text-gray-400 uppercase tracking-widest" data-i18n="th_rsbsa_number">RSBSA Number</th>
                                    <th class="px-3 md:px-6 py-4 text-[10px] font-black text-gray-400 uppercase tracking-widest text-center" data-i18n="th_rsbsa_status">RSBSA Status</th>
                                    <th class="hidden md:table-cell px-6 py-4 text-[10px] font-black text-gray-400 uppercase tracking-widest text-center" data-i18n="th_account">Account</th>
                                    <th class="sticky right-0 z-10 bg-gray-50 shadow-[-4px_0_6px_-4px_rgba(0,0,0,0.08)] px-3 md:px-6 py-4 text-[10px] font-black text-gray-400 uppercase tracking-widest text-right" data-i18n="th_action">Action</th>
                                </tr>
                            </thead>
                            <tbody id="farmerTableBody" class="divide-y divide-gray-50"></tbody>
                        </table>
                    </div>
                    <div class="px-6 py-4 border-t border-gray-50 flex flex-col sm:flex-row items-center sm:justify-between gap-2 sm:gap-0">
                        <div class="order-1 sm:order-2 flex gap-2">
                            <button id="prevBtn" onclick="changePage(-1)" class="px-5 py-2 bg-gray-50 rounded-xl text-xs font-bold text-gray-500 hover:bg-gray-100 disabled:opacity-30 transition-all" data-i18n="btn_previous">Previous</button>
                            <button id="nextBtn" onclick="changePage(1)" class="px-5 py-2 bg-gray-50 rounded-xl text-xs font-bold text-gray-500 hover:bg-gray-100 disabled:opacity-30 transition-all" data-i18n="btn_next">Next</button>
                        </div>
                        <p class="order-2 sm:order-1 text-[10px] font-black text-gray-400 uppercase tracking-widest text-center sm:text-left" id="pageInfo">Showing entries...</p>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- EDIT MODAL -->
    <div id="editModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[80] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md">
            <div class="flex items-center justify-between p-6 border-b border-gray-100">
                <div>
                    <h2 class="text-lg font-black text-gray-800" data-i18n="modal_title_edit_rsbsa">Edit RSBSA Number</h2>
                    <p id="editFarmerName" class="text-xs text-gray-400 mt-1"></p>
                </div>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-xl">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <input type="hidden" id="editUserId">
                <div>
                    <label class="block text-[10px] font-black text-gray-400 uppercase mb-2" data-i18n="th_rsbsa_number">RSBSA Number</label>
                    <input type="text" id="editRSBSA" placeholder="e.g. 202-5985-77856"
                        class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-[#11542e]">
                    <p class="text-[10px] text-gray-400 mt-1" data-i18n="hint_rsbsa_format">Format: ###-####-##### (e.g. 202-5985-77856)</p>
                </div>
            </div>
            <div class="flex gap-3 p-6 border-t border-gray-100">
                <button onclick="closeModal()" class="flex-1 py-3 rounded-xl border border-gray-200 text-sm font-bold text-gray-500 hover:bg-gray-50" data-i18n="btn_cancel">Cancel</button>
                <button onclick="saveRSBSA()" class="flex-1 py-3 rounded-xl bg-[#11542e] text-white text-sm font-bold shadow-md hover:bg-green-800">
                    <i class="fa-solid fa-floppy-disk mr-2"></i> <span data-i18n="btn_save">Save</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Reusable EN / TL switcher (see assets/js/i18n.js)
        const translations = {
            en: {
                header_title: "Farmer Management", badge_rsbsa_registry: "RSBSA Registry",
                search_placeholder: "Search farmer or RSBSA...",
                stat_total_farmers: "Total Farmers", stat_with_rsbsa: "With RSBSA", stat_missing_rsbsa: "Missing RSBSA",
                th_farmer: "Farmer", th_contact: "Contact", th_rsbsa_number: "RSBSA Number", th_rsbsa_status: "RSBSA Status",
                th_account: "Account", th_action: "Action",
                modal_title_edit_rsbsa: "Edit RSBSA Number", hint_rsbsa_format: "Format: ###-####-##### (e.g. 202-5985-77856)",
                btn_cancel: "Cancel", btn_save: "Save",
                no_farmers_found: "No farmers found.",
                badge_missing: "Missing", badge_verified: "Verified", badge_invalid_format: "Invalid Format",
                status_active: "Active", status_inactive: "Inactive",
                filter_all_rsbsa: "All RSBSA", filter_all_statuses: "All Statuses",
                btn_previous: "Previous", btn_next: "Next",
                label_showing: "Showing", label_to: "to", label_of: "of",
                btn_edit_rsbsa: "Edit RSBSA",
                sw_invalid_format_title: "Invalid Format", sw_invalid_format_text: "RSBSA must follow: ###-####-##### (e.g. 202-5985-77856)",
                sw_saved_title: "Saved!", sw_saved_text: "RSBSA number updated.", sw_error_title: "Error",
                sw_update_failed: "Update failed.", sw_server_failed: "Server connection failed.",
                sw_logout_title: "Logout?", sw_logout_btn: "Logout",
                sw_session_expired_title: "Session Expired", sw_session_expired_text: "You have been logged out due to 5 minutes of inactivity."
            },
            tl: {
                header_title: "Pamamahala ng Magsasaka", badge_rsbsa_registry: "RSBSA Registry",
                search_placeholder: "Maghanap ng magsasaka o RSBSA...",
                stat_total_farmers: "Kabuuang Magsasaka", stat_with_rsbsa: "May RSBSA", stat_missing_rsbsa: "Walang RSBSA",
                th_farmer: "Magsasaka", th_contact: "Contact", th_rsbsa_number: "RSBSA Number", th_rsbsa_status: "Katayuan ng RSBSA",
                th_account: "Account", th_action: "Aksyon",
                modal_title_edit_rsbsa: "I-edit ang RSBSA Number", hint_rsbsa_format: "Format: ###-####-##### (hal. 202-5985-77856)",
                btn_cancel: "Kanselahin", btn_save: "I-save",
                no_farmers_found: "Walang nahanap na magsasaka.",
                badge_missing: "Kulang", badge_verified: "Beripikado", badge_invalid_format: "Maling Format",
                status_active: "Aktibo", status_inactive: "Hindi Aktibo",
                filter_all_rsbsa: "Lahat ng RSBSA", filter_all_statuses: "Lahat ng Katayuan",
                btn_previous: "Nakaraan", btn_next: "Susunod",
                label_showing: "Ipinapakita", label_to: "hanggang", label_of: "ng",
                btn_edit_rsbsa: "I-edit ang RSBSA",
                sw_invalid_format_title: "Maling Format", sw_invalid_format_text: "Dapat sundin ng RSBSA ang: ###-####-##### (hal. 202-5985-77856)",
                sw_saved_title: "Na-save na!", sw_saved_text: "Na-update ang RSBSA number.", sw_error_title: "Error",
                sw_update_failed: "Nabigo ang pag-update.", sw_server_failed: "Nabigo ang koneksyon sa server.",
                sw_logout_title: "Mag-logout?", sw_logout_btn: "Mag-logout",
                sw_session_expired_title: "Nag-expire ang Session", sw_session_expired_text: "Na-log out ka dahil sa 5 minuto ng hindi paggamit."
            }
        };

        // Called automatically by i18n.js whenever the user picks a new language
        function onLanguageChange() {
            filterTable(); // re-renders respecting whatever search text is currently active
        }

        let allFarmers = [];
        let filteredFarmers = [];
        let currentPage = 1;
        const rowsPerPage = 10;

        document.addEventListener('DOMContentLoaded', loadFarmers);

        async function loadFarmers() {
            try {
                const res  = await fetch('../../api/masterfile/farmers/get_all.php');
                const data = await res.json();
                if (data.status === 'success') {
                    allFarmers = data.data;
                    filteredFarmers = [...allFarmers];
                    renderTable();
                    updateStats(allFarmers);
                }
            } catch(e) { console.error('Load failed', e); }
        }

        function updateStats(data) {
            const withRSBSA = data.filter(f => f.rsbsa_no && f.rsbsa_no.trim() !== '').length;
            document.getElementById('statTotal').innerText     = data.length;
            document.getElementById('statWithRSBSA').innerText = withRSBSA;
            document.getElementById('statMissing').innerText   = data.length - withRSBSA;
        }

        function renderTable() {
            const tbody = document.getElementById('farmerTableBody');
            const start = (currentPage - 1) * rowsPerPage;
            const end   = start + rowsPerPage;
            const data  = filteredFarmers.slice(start, end);

            if (!data.length) {
                tbody.innerHTML = `<tr><td colspan="6" class="px-3 md:px-6 py-12 text-center text-gray-400 italic">${t('no_farmers_found')}</td></tr>`;
                document.getElementById('pageInfo').innerText = `${t('label_showing')} 0 ${t('label_of')} 0`;
                document.getElementById('prevBtn').disabled = true;
                document.getElementById('nextBtn').disabled = true;
                return;
            }
            tbody.innerHTML = data.map(f => {
                const hasRSBSA    = f.rsbsa_no && f.rsbsa_no.trim() !== '';
                const validFormat = hasRSBSA && /^\d{3}-\d{4}-\d{5}$/.test(f.rsbsa_no);
                const isActive    = f.status === 'Active';
                const rsbsaBadge  = !hasRSBSA
                    ? `<span class="px-2 py-1 bg-red-100 text-red-600 rounded-full text-[9px] font-black uppercase">${t('badge_missing')}</span>`
                    : validFormat
                        ? `<span class="px-2 py-1 bg-green-100 text-green-700 rounded-full text-[9px] font-black uppercase">${t('badge_verified')}</span>`
                        : `<span class="px-2 py-1 bg-amber-100 text-amber-600 rounded-full text-[9px] font-black uppercase">${t('badge_invalid_format')}</span>`;
                return `
                <tr class="hover:bg-gray-50/50 transition-colors">
                    <td class="px-3 md:px-6 py-4">
                        <p class="text-sm font-black text-gray-800">${f.fullname}</p>
                        <p class="text-[10px] text-gray-400">${f.email}</p>
                        <p class="md:hidden text-[10px] text-gray-400">${f.contact || '—'}</p>
                    </td>
                    <td class="hidden md:table-cell px-6 py-4 text-xs text-gray-600">${f.contact || '—'}</td>
                    <td class="px-3 md:px-6 py-4 font-mono text-xs text-gray-700">${f.rsbsa_no || '—'}</td>
                    <td class="px-3 md:px-6 py-4 text-center">${rsbsaBadge}</td>
                    <td class="hidden md:table-cell px-6 py-4 text-center">
                        <span class="px-2 py-1 rounded-full text-[9px] font-black uppercase ${isActive ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-600'}">
                            ${isActive ? t('status_active') : t('status_inactive')}
                        </span>
                    </td>
                    <td class="sticky right-0 z-10 bg-white shadow-[-4px_0_6px_-4px_rgba(0,0,0,0.08)] px-3 md:px-6 py-4 text-right">
                        <button onclick="openModal(${f.id}, '${f.fullname.replace(/'/g, "\\'")}', '${f.rsbsa_no || ''}')"
                            title="${t('btn_edit_rsbsa')}"
                            class="w-9 h-9 md:w-auto md:h-auto px-0 md:px-3 py-0 md:py-2 bg-[#11542e] text-white rounded-xl text-[10px] font-black hover:bg-green-800 transition-all flex items-center justify-center md:gap-1">
                            <i class="fa-solid fa-pen"></i><span class="hidden md:inline">${t('btn_edit_rsbsa')}</span>
                        </button>
                    </td>
                </tr>`;
            }).join('');

            document.getElementById('pageInfo').innerText =
                `${t('label_showing')} ${filteredFarmers.length ? start + 1 : 0} ${t('label_to')} ${Math.min(end, filteredFarmers.length)} ${t('label_of')} ${filteredFarmers.length}`;
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = end >= filteredFarmers.length;
        }

        function filterTable() {
            const q            = document.getElementById('searchInput').value.trim().toLowerCase();
            const rsbsaFilter  = document.getElementById('rsbsaFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;

            const qDigits = q.replace(/\D/g, '');

            filteredFarmers = allFarmers.filter(f => {
                const rsbsaDigits = (f.rsbsa_no || '').replace(/\D/g, '');
                const matchesSearch = f.fullname.toLowerCase().includes(q) ||
                    (f.rsbsa_no || '').toLowerCase().includes(q) ||
                    (qDigits && rsbsaDigits.includes(qDigits)) ||
                    (f.email || '').toLowerCase().includes(q) ||
                    (f.contact || '').toLowerCase().includes(q);

                const hasRSBSA    = f.rsbsa_no && f.rsbsa_no.trim() !== '';
                const validFormat = hasRSBSA && /^\d{3}-\d{4}-\d{5}$/.test(f.rsbsa_no);
                const rsbsaState  = !hasRSBSA ? 'Missing' : (validFormat ? 'Verified' : 'Invalid');
                const matchesRSBSA = (rsbsaFilter === 'ALL') || (rsbsaState === rsbsaFilter);

                const matchesStatus = (statusFilter === 'ALL') || (f.status === statusFilter);

                return matchesSearch && matchesRSBSA && matchesStatus;
            });

            currentPage = 1;
            renderTable();
        }

        function changePage(dir) { currentPage += dir; renderTable(); }

        function openModal(id, name, rsbsa) {
            document.getElementById('editUserId').value        = id;
            document.getElementById('editFarmerName').innerText = name;
            document.getElementById('editRSBSA').value         = rsbsa;
            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('editModal').classList.add('hidden'); }

        async function saveRSBSA() {
            const id    = document.getElementById('editUserId').value;
            const rsbsa = document.getElementById('editRSBSA').value.trim();

            if (rsbsa && !/^\d{3}-\d{4}-\d{5}$/.test(rsbsa)) {
                Swal.fire(t('sw_invalid_format_title'), t('sw_invalid_format_text'), 'warning');
                return;
            }

            try {
                const res  = await fetch('../../api/masterfile/farmers/update_rsbsa.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, rsbsa_no: rsbsa })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    Swal.fire({ icon: 'success', title: t('sw_saved_title'), text: t('sw_saved_text'), timer: 1500, showConfirmButton: false });
                    closeModal();
                    loadFarmers();
                } else {
                    Swal.fire(t('sw_error_title'), data.message || t('sw_update_failed'), 'error');
                }
            } catch(e) { Swal.fire(t('sw_error_title'), t('sw_server_failed'), 'error'); }
        }

        function confirmLogout() {
            Swal.fire({ title: t('sw_logout_title'), icon: 'question', showCancelButton: true, confirmButtonColor: '#11542e', confirmButtonText: t('sw_logout_btn') })
            .then(r => { if (r.isConfirmed) CropGuardSession.logout(); });
        }
        // The idle timeout lives in session_guard.js now.


    </script>

<script src="../../assets/js/navbar_admin.js?v=4"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // PASS THE CORRECT PAGE KEY HERE
            loadAdminNavbar('farmers'); 
            initI18n();
            loadAdminNotifications();
        });
    </script>

</body>
