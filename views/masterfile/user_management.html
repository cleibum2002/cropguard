    <script>
        fetch('../../api/auth/session_check.php').then(res => res.json()).then(data => {
            if (data.status !== 'active' || data.role.toLowerCase() !== 'admin') {
                window.location.href = '../../auth.html';
            } else {
                function applyAdminName() {
                    const nameEl = document.getElementById('adminName');
                    const sidebarNameEl = document.getElementById('adminNameSidebar');
                    if (nameEl) nameEl.innerText = data.user.fullname;
                    if (sidebarNameEl) sidebarNameEl.innerText = data.user.fullname;
                }
                // The page may already be fully loaded by the time this fetch resolves —
                // in that case 'load' has already fired and a listener added now would
                // never run. Check readyState first instead of blindly waiting for it.
                if (document.readyState === 'complete') {
                    applyAdminName();
                } else {
                    window.addEventListener('load', applyAdminName);
                }
            }
        }).catch(() => window.location.href = '../../auth.html');
    </script>

                sw_logout_title: "Mag-logout?", sw_logout_text: "Sigurado ka bang gusto mong lumabas?", sw_yes_logout: "Oo, mag-logout",
                sw_session_expired_title: "Nag-expire ang Session", sw_session_expired_text: "Na-log out ka dahil sa 5 minuto ng hindi paggamit.",
                label_showing: "IPINAPAKITA", label_to: "HANGGANG", label_of: "SA"
            }
        };

        // Role is stored in the DB in English regardless of UI language —
        // this helper only translates what's *displayed*.
        function roleLabel(role) {
            const map = { Admin: 'opt_role_admin', MAO: 'opt_role_mao', Technician: 'opt_role_technician', Farmer: 'opt_role_farmer' };
            return map[role] ? t(map[role]) : role;
        }

        // Called automatically by i18n.js whenever the user picks a new language
        function onLanguageChange() {
            renderTable();
            renderNotificationList(lastNotifItems);
        }
        let lastNotifItems = [];

        const API_URL = "../../api/masterfile/users/";
        let allData = [], filteredData = [], currentPage = 1, rowsPerPage = 10;

        document.addEventListener("DOMContentLoaded", loadTable);
        document.addEventListener("DOMContentLoaded", loadAdminNotifications);

        // ─── NOTIFICATIONS ─────────────────────────────────────────────────
        async function loadAdminNotifications() {
            try {
                const res = await fetch('../../api/dashboard/admin_notifications.php?action=fetch');
                const result = await res.json();
                if (result.status === 'success') {
                    renderNotificationList(result.data);
                    const badge = document.getElementById('notifBadge');
                    if (result.unread > 0) {
                        badge.textContent = result.unread > 9 ? '9+' : result.unread;
                        badge.classList.remove('hidden');
                    } else {
                        badge.classList.add('hidden');
                    }
                }
            } catch (e) {
                console.error('Failed to load notifications:', e);
            }
        }

        function renderNotificationList(items) {
            lastNotifItems = items || [];
            const list = document.getElementById('notifList');
            if (!items || items.length === 0) {
                list.innerHTML = `<p class="text-xs text-gray-400 italic text-center py-8">${t('notif_none')}</p>`;
                return;
            }
            list.innerHTML = items.map(n => `
                <div class="px-4 py-3 ${n.Is_Read == 0 ? 'bg-green-50/40' : ''} hover:bg-gray-50 transition-colors ${n.Redirect_URL ? 'cursor-pointer flex items-center justify-between gap-3' : ''}" ${n.Redirect_URL ? `onclick="window.location.href='${n.Redirect_URL}'"` : ''}>
                    <div class="min-w-0">
                        <p class="text-xs text-gray-700 leading-relaxed">${n.Message}</p>
                        <p class="text-[10px] text-gray-400 font-bold mt-1">${n.DateStr}</p>
                    </div>
                    ${n.Redirect_URL ? '<span class="flex-shrink-0 text-[9px] font-black text-white bg-[#11542e] px-2.5 py-1.5 rounded-full uppercase tracking-wide whitespace-nowrap flex items-center gap-1">View <i class="fa-solid fa-arrow-right"></i></span>' : ''}
                </div>
            `).join('');
        }

        function toggleNotificationPanel() {
            const panel = document.getElementById('notifPanel');
            const isHidden = panel.classList.contains('hidden');
            if (isHidden) {
                panel.classList.remove('hidden');
                fetch('../../api/dashboard/admin_notifications.php?action=read')
                    .then(() => { document.getElementById('notifBadge').classList.add('hidden'); });
            } else {
                panel.classList.add('hidden');
            }
        }

        document.addEventListener('click', (e) => {
            const panel = document.getElementById('notifPanel');
            const btn = document.getElementById('notifBellBtn');
            if (panel && !panel.classList.contains('hidden') && !panel.contains(e.target) && !btn.contains(e.target)) {
                panel.classList.add('hidden');
            }
        });

        async function loadTable() {
            try {
                const res = await fetch(API_URL + "get_all.php");
                const response = await res.json();
                allData = response.data || [];
                filteredData = [...allData];
                renderTable();
            } catch (e) {
                console.error("Load failed", e);
                renderTable();
            }
        }

        function renderTable() {
            const tbody = document.getElementById("tableBody");
            const start = (currentPage - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            const items = filteredData.slice(start, end);

            tbody.innerHTML = items.length
                ? ""
                : `<tr><td colspan="5" class="px-6 py-10 text-center text-gray-400 italic text-sm">${t('no_users_found')}</td></tr>`;

            items.forEach(item => {
                const statusColor = item.status === 'Active'
                    ? 'bg-green-100 text-green-700'
                    : 'bg-red-100 text-red-700';
                
                let roleColor = 'bg-gray-100 text-gray-700';
                if (item.role === 'Admin') roleColor = 'bg-amber-50 text-amber-700';
                else if (item.role === 'MAO') roleColor = 'bg-blue-50 text-blue-700';
                else if (item.role === 'Technician') roleColor = 'bg-purple-50 text-purple-700';
                else if (item.role === 'Farmer') roleColor = 'bg-green-50 text-green-700';

                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50/60 transition-all">
                        <td class="px-6 py-4 font-bold text-gray-300 text-center text-sm">#${item.id}</td>
                        <td class="px-6 py-4">
                            <p class="text-sm font-black text-gray-800">${item.fullname}</p>
                            <p class="text-[10px] text-gray-400">${item.email || t('label_no_email')} ${item.contact_number ? '• ' + item.contact_number : ''}</p>
                        </td>
                        <td class="px-6 py-4">
                            <span class="px-3 py-1 rounded-full text-[10px] font-bold ${roleColor}">${roleLabel(item.role)}</span>
                        </td>
                        <td class="px-6 py-4">
                            <span class="px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-tight ${statusColor}">
                                ${item.status === 'Active' ? t('status_active') : t('status_inactive')}
                            </span>
                        </td>
                        <td class="px-6 py-4 text-right">
                            <div class="flex justify-end gap-2">
                                <button onclick="editItem(${item.id})" class="w-9 h-9 bg-blue-50 text-blue-500 rounded-xl hover:bg-blue-500 hover:text-white transition-all flex items-center justify-center">
                                    <i class="fa-solid fa-pen-to-square text-xs"></i>
                                </button>
                                ${item.status === 'Active' ? `
                                <button onclick="deleteItem(${item.id})" class="w-9 h-9 bg-red-50 text-red-400 rounded-xl hover:bg-red-500 hover:text-white transition-all flex items-center justify-center" title="${t('title_deactivate')}">
                                    <i class="fa-solid fa-trash-can text-xs"></i>
                                </button>` : `
                                <button onclick="activateItem(${item.id})" class="w-9 h-9 bg-green-50 text-green-500 rounded-xl hover:bg-green-500 hover:text-white transition-all flex items-center justify-center" title="${t('title_activate')}">
                                    <i class="fa-solid fa-rotate-left text-xs"></i>
                                </button>`}
                            </div>
                        </td>
                    </tr>`;
            });

            document.getElementById("pageInfo").innerText =
                `${t('label_showing')} ${filteredData.length ? start + 1 : 0} ${t('label_to')} ${Math.min(end, filteredData.length)} ${t('label_of')} ${filteredData.length}`;
            document.getElementById("prevBtn").disabled = currentPage === 1;
            document.getElementById("nextBtn").disabled = end >= filteredData.length;
        }

        // ADDED: Modified filterTable to handle both text search and role dropdown
        function filterTable() {
            const searchQuery = document.getElementById("searchInput").value.toLowerCase();
            const roleFilter = document.getElementById("roleFilter").value;
            const statusFilter = document.getElementById("statusFilter").value;

            filteredData = allData.filter(i => {
                // 1. Does the text match name, email, contact number, role, status, or ID?
                const matchesSearch = i.fullname.toLowerCase().includes(searchQuery) || 
                                      (i.email && i.email.toLowerCase().includes(searchQuery)) ||
                                      (i.contact_number && i.contact_number.toLowerCase().includes(searchQuery)) ||
                                      roleLabel(i.role).toLowerCase().includes(searchQuery) ||
                                      (i.role && i.role.toLowerCase().includes(searchQuery)) ||
                                      (i.status === 'Active' ? t('status_active') : t('status_inactive')).toLowerCase().includes(searchQuery) ||
                                      (i.status && i.status.toLowerCase().includes(searchQuery)) ||
                                      String(i.id).includes(searchQuery);
                
                // 2. Does the role match the dropdown? (If 'ALL' is selected, it automatically matches)
                const matchesRole = (roleFilter === "ALL") || (i.role === roleFilter);

                // 3. Does the status match the dropdown?
                const matchesStatus = (statusFilter === "ALL") || (i.status === statusFilter);

                return matchesSearch && matchesRole && matchesStatus;
            });
            
            currentPage = 1;
            renderTable();
        }

        function changePage(dir) { currentPage += dir; renderTable(); }

        function openModal() {
            document.getElementById("modalTitle").innerText = t('modal_title_add_user');
            document.getElementById("editId").value = "";
            document.getElementById("userFullName").value = "";
            document.getElementById("userEmail").value = "";
            document.getElementById("userContact").value = "";
            document.getElementById("userPassword").value = "";
            document.getElementById("userPassword").placeholder = t('placeholder_password_required');
            document.getElementById("userRole").value = "Admin";
            document.getElementById("userStatus").value = "Active";
            document.getElementById("modal").classList.remove("hidden");
        }

        function editItem(id) {
            const i = allData.find(x => x.id == id);
            document.getElementById("modalTitle").innerText = t('modal_title_edit_user');
            document.getElementById("editId").value = i.id;
            document.getElementById("userFullName").value = i.fullname;
            document.getElementById("userEmail").value = i.email || "";
            const rawContact = (i.contact_number || '').replace(/\D/g, '');
            document.getElementById("userContact").value = rawContact.slice(-10);
            document.getElementById("userPassword").value = ""; 
            document.getElementById("userPassword").placeholder = t('placeholder_password_hint');
            document.getElementById("userRole").value = i.role;
            document.getElementById("userStatus").value = i.status;
            document.getElementById("modal").classList.remove("hidden");
        }

        function closeModal() { document.getElementById("modal").classList.add("hidden"); }

        async function saveData() {
            const id = document.getElementById("editId").value;
            const data = {
                fullname: document.getElementById("userFullName").value.trim(),
                email: document.getElementById("userEmail").value.trim(),
                contact_number: (() => {
                    const digits = document.getElementById("userContact").value.trim();
                    return digits ? ('+63' + digits) : '';
                })(),
                password: document.getElementById("userPassword").value.trim(),
                role: document.getElementById("userRole").value,
                status: document.getElementById("userStatus").value
            };

            if (!data.fullname || !data.email) return Swal.fire(t('sw_required_title'), t('sw_required_name_email'), "warning");
            if (!id && !data.password) return Swal.fire(t('sw_required_title'), t('sw_required_password'), "warning");
            if (id) data.id = id;

            try {
                const res = await fetch(API_URL + (id ? "update.php" : "create.php"), {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if (result.status === 'success') {
                    Swal.fire({ icon: 'success', title: t('sw_saved_title'), text: result.message, showConfirmButton: false, timer: 1500 });
                    closeModal();
                    loadTable();
                } else {
                    Swal.fire(t('sw_error_title'), result.message, 'error');
                }
            } catch (e) {
                Swal.fire(t('sw_error_title'), t('sw_server_failed'), 'error');
            }
        }

        function activateItem(id) {
            const i = allData.find(x => x.id == id);
            if (!i) return;
            Swal.fire({
                title: t('sw_activate_title'),
                text: t('sw_activate_text'),
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#11542e',
                confirmButtonText: t('sw_yes_activate')
            }).then(r => {
                if (r.isConfirmed) {
                    fetch(API_URL + "update.php", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            id: i.id,
                            fullname: i.fullname,
                            email: i.email,
                            contact_number: i.contact_number,
                            role: i.role,
                            status: 'Active'
                        })
                    })
                    .then(res => res.json())
                    .then(res => {
                        if (res.status === 'success') {
                            Swal.fire({ icon: 'success', title: t('sw_activated_title'), text: t('sw_activated_text'), showConfirmButton: false, timer: 1500 });
                            loadTable();
                        } else {
                            Swal.fire(t('sw_error_title'), res.message, 'error');
                        }
                    }).catch(() => {
                        Swal.fire(t('sw_error_title'), t('sw_failed_connect'), 'error');
                    });
                }
            });
        }

        function deleteItem(id) {
            Swal.fire({
                title: t('sw_revoke_title'),
                text: t('sw_revoke_text'),
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#11542e',
                confirmButtonText: t('sw_yes_deactivate')
            }).then(r => {
                if (r.isConfirmed) {
                    fetch(API_URL + "soft_delete.php", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ id })
                    })
                    .then(res => res.json())
                    .then(res => {
                        if (res.status === 'success') {
                            Swal.fire({ icon: 'success', title: t('sw_deactivated_title'), text: t('sw_deactivated_text'), showConfirmButton: false, timer: 1500 });
                            loadTable();
                        } else {
                            Swal.fire(t('sw_error_title'), res.message, 'error');
                        }
                    }).catch(() => {
                        Swal.fire(t('sw_error_title'), t('sw_failed_connect'), 'error');
                    });
                }
            });
        }

        function confirmLogout() {
            Swal.fire({
                title: t('sw_logout_title'),
                text: t('sw_logout_text'),
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#11542e',
                confirmButtonText: t('sw_yes_logout')
            }).then((result) => {
                if (result.isConfirmed) {
                    fetch('../../api/auth/logout.php')
                        .then(res => res.json())
                        .then(data => {
                            if (data.status === 'success') window.location.href = '../../auth.html';
                        })
                        .catch(() => window.location.href = '../../auth.html');
                }
            });
        }

        // ── IDLE TIMEOUT: 5 minutes ───────────────────────────────────
        let idleTimer;
        function resetIdleTimer() {
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                Swal.fire({ icon: 'warning', title: t('sw_session_expired_title'), text: t('sw_session_expired_text'), confirmButtonColor: '#11542e', allowOutsideClick: false })
                    .then(() => { fetch('../../api/auth/logout.php').then(() => { window.location.href = '../../auth.html'; }); });
            }, 5 * 60 * 1000);
        }
        ['mousemove','keypress','click','scroll','touchstart','touchmove'].forEach(ev => document.addEventListener(ev, resetIdleTimer));
        resetIdleTimer();
    </script>

    <script src="../../assets/js/navbar_admin.js?v=2"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadAdminNavbar('staff'); 
            initI18n();
        });
    </script>
