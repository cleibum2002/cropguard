<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Logs | CropGuard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="../../assets/js/i18n.js?v=1"></script>

    <script>
        fetch('../../api/auth/session_check.php').then(res => res.json()).then(data => {
            if (data.status !== 'active' || data.role.toLowerCase() !== 'admin') {
                window.location.href = '../../auth.html';
            } else {
                window.addEventListener('load', () => {
                    document.getElementById('adminNameSidebar').innerText = data.user.fullname;
                });
            }
        }).catch(() => window.location.href = '../../auth.html');
    </script>

<style>
    body { font-family: 'Inter', sans-serif; background-color: #f0f2f0; }
    .lang-link { cursor: pointer; }
    .lang-link.lang-active { color: #11542e; text-decoration: underline; }
    
    /* This CSS handles the injected sidebar */
    #sidebar-container { width: 16rem; flex-shrink: 0; }
    #sidebar-container aside { 
        background-color: #11542e; 
        height: 100vh; 
        display: flex; 
        flex-direction: column; 
    }
    #sidebar-container nav { 
        flex: 1; 
        overflow-y: auto; 
        scrollbar-width: thin; 
    }
    
    .sidebar-link { display: flex; align-items: center; padding: 0.75rem 1rem; color: rgba(255, 255, 255, 0.6); border-radius: 0.75rem; font-size: 0.875rem; transition: all 0.2s ease; border-left: 3px solid transparent; }
    .sidebar-link.active { background: rgba(255,255,255,0.12); border-left-color: #f1c40f; color: white; }
    .sidebar-link:hover { background: rgba(255,255,255,0.06); color: white; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
</style>
</head>
<body class="h-screen flex overflow-hidden">

<div id="sidebar-container"></div>

    <div class="flex-1 flex flex-col h-screen overflow-hidden">
        <header class="h-16 flex items-center justify-between px-6 bg-white border-b border-gray-100 flex-shrink-0">
            <div class="flex items-center gap-4">
                <span class="text-base font-black text-gray-800" data-i18n="header_title">Audit Logs</span>
                <span class="bg-red-100 text-red-700 px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-wide" data-i18n="badge_admin_only">Admin Only</span>
            </div>
            <div class="flex items-center gap-3">
                <div class="flex items-center gap-1.5 text-xs font-bold text-gray-400 mr-1">
                    <span class="lang-link" data-lang="en" onclick="setLanguage('en')">English</span>
                    <span>|</span>
                    <span class="lang-link" data-lang="tl" onclick="setLanguage('tl')">Tagalog</span>
                </div>
                <select id="moduleFilter" onchange="loadLogs(1)" class="bg-gray-50 border border-gray-200 rounded-xl px-4 py-2 text-sm font-bold text-gray-700 outline-none focus:ring-2 focus:ring-[#11542e]">
                    <option value="" data-i18n="filter_all_modules">All Modules</option>
                    <option value="Authentication" data-i18n="module_authentication">Authentication</option>
                    <option value="Reports" data-i18n="module_reports">Reports</option>
                    <option value="Damage Reports" data-i18n="module_damage_reports">Damage Reports</option>
                    <option value="Aid Distribution" data-i18n="module_aid_distribution">Aid Distribution</option>
                </select>
                <select id="roleFilter" onchange="loadLogs(1)" class="bg-gray-50 border border-gray-200 rounded-xl px-4 py-2 text-sm font-bold text-gray-700 outline-none focus:ring-2 focus:ring-[#11542e]">
                    <option value="" data-i18n="filter_all_roles">All Roles</option>
                    <option value="Admin">Admin</option>
                    <option value="MAO">MAO</option>
                    <option value="Technician">Technician</option>
                    <option value="Farmer">Farmer</option>
                </select>
                <button onclick="loadLogs()" class="bg-[#11542e] text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-green-800 transition-all">
                    <i class="fa-solid fa-sync mr-1"></i> <span data-i18n="btn_refresh">Refresh</span>
                </button>
            </div>
        </header>

        <div class="px-6 pt-6 pb-4 flex flex-wrap items-center gap-3 bg-[#f0f2f0]">
            <div class="relative flex-1 min-w-[240px] max-w-md">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-300 text-sm"></i>
                <input type="text" id="searchInput" data-i18n-placeholder="search_placeholder" placeholder="Search user, description, or IP..."
                       class="bg-white border border-gray-200 rounded-xl py-2.5 pl-10 pr-4 text-sm w-full focus:ring-2 focus:ring-[#11542e] outline-none">
            </div>
            <input type="date" id="dateFrom" onchange="loadLogs(1)" class="bg-white border border-gray-200 rounded-xl px-3 py-2.5 text-sm text-gray-600 outline-none focus:ring-2 focus:ring-[#11542e]">
            <span class="text-gray-400 text-xs font-bold" data-i18n="label_to">to</span>
            <input type="date" id="dateTo" onchange="loadLogs(1)" class="bg-white border border-gray-200 rounded-xl px-3 py-2.5 text-sm text-gray-600 outline-none focus:ring-2 focus:ring-[#11542e]">
            <button onclick="clearFilters()" class="text-xs font-bold text-gray-400 hover:text-red-500 transition-colors px-3 py-2.5">
                <i class="fa-solid fa-rotate-left mr-1"></i> <span data-i18n="btn_clear">Clear</span>
            </button>
        </div>

        <main class="flex-1 overflow-y-auto p-6 pt-0 bg-[#f0f2f0] custom-scrollbar">
            <div class="max-w-7xl mx-auto">

                <!-- Stats -->
                <div class="grid grid-cols-4 gap-4 mb-6">
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                        <p class="text-[10px] font-black text-gray-400 uppercase mb-2" data-i18n="stat_total_actions">Total Actions</p>
                        <p id="statTotal" class="text-3xl font-black text-gray-800">0</p>
                    </div>
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                        <p class="text-[10px] font-black text-gray-400 uppercase mb-2" data-i18n="stat_logins_today">Logins Today</p>
                        <p id="statLogins" class="text-3xl font-black text-blue-600">0</p>
                    </div>
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                        <p class="text-[10px] font-black text-gray-400 uppercase mb-2" data-i18n="stat_reports_submitted">Reports Submitted</p>
                        <p id="statReports" class="text-3xl font-black text-green-600">0</p>
                    </div>
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                        <p class="text-[10px] font-black text-gray-400 uppercase mb-2" data-i18n="stat_aid_actions">Aid Actions</p>
                        <p id="statAid" class="text-3xl font-black text-amber-600">0</p>
                    </div>
                </div>

                <!-- Table -->
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-gray-50 border-b border-gray-100">
                                <tr>
                                    <th class="px-6 py-4 text-[10px] font-black text-gray-400 uppercase tracking-widest" data-i18n="th_time">Time</th>
                                    <th class="px-6 py-4 text-[10px] font-black text-gray-400 uppercase tracking-widest" data-i18n="th_user">User</th>
                                    <th class="px-6 py-4 text-[10px] font-black text-gray-400 uppercase tracking-widest" data-i18n="th_role">Role</th>
                                    <th class="px-6 py-4 text-[10px] font-black text-gray-400 uppercase tracking-widest" data-i18n="th_action">Action</th>
                                    <th class="px-6 py-4 text-[10px] font-black text-gray-400 uppercase tracking-widest" data-i18n="label_description">Description</th>
                                    <th class="px-6 py-4 text-[10px] font-black text-gray-400 uppercase tracking-widest" data-i18n="th_module">Module</th>
                                    <th class="px-6 py-4 text-[10px] font-black text-gray-400 uppercase tracking-widest" data-i18n="th_ip_address">IP Address</th>
                                </tr>
                            </thead>
                            <tbody id="logTableBody" class="divide-y divide-gray-50"></tbody>
                        </table>
                    </div>
                    <div class="px-6 py-5 border-t border-gray-100 flex flex-col items-center gap-3">
                        <div class="flex items-center gap-3">
                            <button id="prevPageBtn" onclick="goToPage(currentPage - 1)" class="w-9 h-9 flex items-center justify-center rounded-lg border border-[#11542e] text-[#11542e] hover:bg-[#11542e] hover:text-white transition-colors disabled:opacity-30 disabled:cursor-not-allowed disabled:hover:bg-transparent disabled:hover:text-[#11542e]">
                                <i class="fa-solid fa-chevron-left text-xs"></i>
                            </button>
                            <span id="pageIndicator" class="text-xs font-black text-gray-700 px-2">Page 1 of 1</span>
                            <button id="nextPageBtn" onclick="goToPage(currentPage + 1)" class="w-9 h-9 flex items-center justify-center rounded-lg border border-[#11542e] text-[#11542e] hover:bg-[#11542e] hover:text-white transition-colors disabled:opacity-30 disabled:cursor-not-allowed disabled:hover:bg-transparent disabled:hover:text-[#11542e]">
                                <i class="fa-solid fa-chevron-right text-xs"></i>
                            </button>
                        </div>
                        <p id="paginationSummary" class="text-xs text-gray-400 font-bold"></p>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script>
        // Reusable EN / TL switcher (see assets/js/i18n.js)
        const translations = {
            en: {
                header_title: "Audit Logs", badge_admin_only: "Admin Only",
                filter_all_modules: "All Modules", module_authentication: "Authentication", module_reports: "Reports",
                module_damage_reports: "Damage Reports", module_aid_distribution: "Aid Distribution",
                btn_refresh: "Refresh",
                stat_total_actions: "Total Actions", stat_logins_today: "Logins Today",
                stat_reports_submitted: "Reports Submitted", stat_aid_actions: "Aid Actions",
                th_time: "Time", th_user: "User", th_role: "Role", th_action: "Action",
                label_description: "Description", th_module: "Module", th_ip_address: "IP Address",
                no_logs_found: "No logs found.", label_system: "System",
                action_login: "Login", action_submit_report: "Submit Report", action_edit_report: "Edit Report",
                action_validate_report: "Validate Report", action_approve_report: "Approve Report", action_mark_claimed: "Mark as Claimed",
                action_submit_inspection: "Submit Inspection",
                sw_logout_title: "Logout?",
                sw_session_expired_title: "Session Expired", sw_session_expired_text: "You have been logged out due to 5 minutes of inactivity."
            },
            tl: {
                header_title: "Audit Logs", badge_admin_only: "Admin Lamang",
                filter_all_modules: "Lahat ng Module", module_authentication: "Authentication", module_reports: "Mga Ulat",
                module_damage_reports: "Mga Ulat ng Pinsala", module_aid_distribution: "Pamamahagi ng Tulong",
                btn_refresh: "I-refresh",
                stat_total_actions: "Kabuuang Aksyon", stat_logins_today: "Login Ngayong Araw",
                stat_reports_submitted: "Naisumiteng Ulat", stat_aid_actions: "Aksyon sa Tulong",
                th_time: "Oras", th_user: "User", th_role: "Tungkulin", th_action: "Aksyon",
                label_description: "Deskripsyon", th_module: "Module", th_ip_address: "IP Address",
                no_logs_found: "Walang nahanap na log.", label_system: "Sistema",
                action_login: "Login", action_submit_report: "Isumite ang Ulat", action_edit_report: "I-edit ang Ulat",
                action_validate_report: "Patunayan ang Ulat", action_approve_report: "Aprubahan ang Ulat", action_mark_claimed: "Markahan bilang Na-claim",
                action_submit_inspection: "Isumite ang Inspeksyon",
                sw_logout_title: "Mag-logout?",
                sw_session_expired_title: "Nag-expire ang Session", sw_session_expired_text: "Na-log out ka dahil sa 5 minuto ng hindi paggamit."
            }
        };

        // Raw Action values are stored in English in the audit log DB regardless
        // of UI language — this only translates what's *displayed* in the badge.
        function auditActionLabel(action) {
            const map = {
                'Login': 'action_login', 'Submit Report': 'action_submit_report', 'Edit Report': 'action_edit_report',
                'Validate Report': 'action_validate_report', 'Approve Report': 'action_approve_report', 'Mark as Claimed': 'action_mark_claimed',
                'Submit Inspection': 'action_submit_inspection'
            };
            return map[action] ? t(map[action]) : action;
        }

        // Called automatically by i18n.js whenever the user picks a new language
        function onLanguageChange() {
            loadLogs(currentPage); // re-fetches the SAME page with translated action labels
        }

        let currentPage = 1;
        let totalPages  = 1;
        let searchDebounceTimer;

        document.addEventListener('DOMContentLoaded', () => {
            loadLogs(1);
            document.getElementById('searchInput').addEventListener('input', () => {
                clearTimeout(searchDebounceTimer);
                searchDebounceTimer = setTimeout(() => loadLogs(1), 400);
            });
        });

        function clearFilters() {
            document.getElementById('moduleFilter').value = '';
            document.getElementById('roleFilter').value   = '';
            document.getElementById('searchInput').value  = '';
            document.getElementById('dateFrom').value     = '';
            document.getElementById('dateTo').value       = '';
            loadLogs(1);
        }

        function goToPage(page) {
            if (page < 1 || page > totalPages) return;
            loadLogs(page);
        }

        async function loadLogs(page) {
            currentPage = page || currentPage;

            const module = document.getElementById('moduleFilter').value;
            const role   = document.getElementById('roleFilter').value;
            const search = document.getElementById('searchInput').value.trim();
            const from   = document.getElementById('dateFrom').value;
            const to     = document.getElementById('dateTo').value;

            const params = new URLSearchParams({ page: currentPage, per_page: 15 });
            if (module) params.append('module', module);
            if (role)   params.append('role', role);
            if (search) params.append('search', search);
            if (from)   params.append('date_from', from);
            if (to)     params.append('date_to', to);

            const url = `../../api/audit/get_logs.php?${params.toString()}`;

            try {
                const res  = await fetch(url);
                const data = await res.json();

                if (data.status === 'success') {
                    renderLogs(data.data);
                    updateStats(data.stats);
                    updatePagination(data);
                }
            } catch(e) { console.error('Failed to load logs', e); }
        }

        function updateStats(stats) {
            document.getElementById('statTotal').innerText   = stats.total_actions;
            document.getElementById('statLogins').innerText  = stats.logins_today;
            document.getElementById('statReports').innerText = stats.reports_submitted;
            document.getElementById('statAid').innerText     = stats.aid_actions;
        }

        function updatePagination(data) {
            totalPages = data.total_pages;
            document.getElementById('pageIndicator').innerText = `Page ${data.page} of ${data.total_pages}`;
            document.getElementById('prevPageBtn').disabled = data.page <= 1;
            document.getElementById('nextPageBtn').disabled = data.page >= data.total_pages;

            const start = data.total_count === 0 ? 0 : ((data.page - 1) * data.per_page) + 1;
            const end   = Math.min(data.page * data.per_page, data.total_count);
            document.getElementById('paginationSummary').innerText = `Showing ${start}–${end} of ${data.total_count} logs`;
        }

        function renderLogs(data) {
            const tbody = document.getElementById('logTableBody');
            if (!data.length) {
                tbody.innerHTML = `<tr><td colspan="7" class="px-6 py-12 text-center text-gray-400 italic">${t('no_logs_found')}</td></tr>`;
                return;
            }

            const actionColors = {
                'Login':           'bg-blue-100 text-blue-700',
                'Submit Report':   'bg-green-100 text-green-700',
                'Edit Report':     'bg-amber-100 text-amber-700',
                'Validate Report': 'bg-purple-100 text-purple-700',
                'Approve Report':  'bg-green-100 text-green-700',
                'Mark as Claimed': 'bg-indigo-100 text-indigo-700',
            };

            tbody.innerHTML = data.map(log => {
                const badge = actionColors[log.Action] || 'bg-gray-100 text-gray-600';
                const date  = new Date(log.Created_At).toLocaleString();
                return `
                <tr class="hover:bg-gray-50/50 transition-colors">
                    <td class="px-6 py-3 text-xs text-gray-500 whitespace-nowrap">${date}</td>
                    <td class="px-6 py-3 text-xs font-bold text-gray-800">${log.user_name || t('label_system')}</td>
                    <td class="px-6 py-3">
                        <span class="px-2 py-1 bg-gray-100 text-gray-600 rounded-full text-[9px] font-black uppercase">${log.user_role}</span>
                    </td>
                    <td class="px-6 py-3">
                        <span class="px-2 py-1 rounded-full text-[9px] font-black uppercase ${badge}">${auditActionLabel(log.Action)}</span>
                    </td>
                    <td class="px-6 py-3 text-xs text-gray-600 max-w-xs truncate">${log.Description}</td>
                    <td class="px-6 py-3 text-xs text-gray-500">${log.Module}</td>
                    <td class="px-6 py-3 text-xs font-mono text-gray-400">${log.IP_Address}</td>
                </tr>`;
            }).join('');
        }

        function confirmLogout() {
            Swal.fire({ title: t('sw_logout_title'), icon: 'question', showCancelButton: true, confirmButtonColor: '#11542e' })
            .then(r => { if (r.isConfirmed) fetch('../../api/auth/logout.php').then(() => window.location.href = '../../auth.html'); });
        }

        // ── IDLE TIMEOUT: 5 minutes ───────────────────────────────────
        let idleTimer;
        function resetIdleTimer() {
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                Swal.fire({ icon: 'warning', title: t('sw_session_expired_title'), text: t('sw_session_expired_text'), confirmButtonColor: '#11542e', allowOutsideClick: false })
                    .then(() => fetch('../../api/auth/logout.php').then(() => window.location.href = '../../auth.html'));
            }, 5 * 60 * 1000);
        }
        ['mousemove','keypress','click','scroll','touchstart','touchmove'].forEach(ev => document.addEventListener(ev, resetIdleTimer));
        resetIdleTimer();


    </script>
<script src="../../assets/js/navbar_admin.js?v=1"></script>
<script>
    // This is the cleanest way to initialize
    document.addEventListener('DOMContentLoaded', () => {
        loadAdminNavbar('logs'); 
        initI18n();
    });
</script>

</body>
</html>
