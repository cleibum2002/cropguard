<style>

                <select id="roleFilter" onchange="loadLogs(1)" class="bg-gray-50 border border-gray-200 rounded-xl px-4 py-2 text-sm font-bold text-gray-700 outline-none focus:ring-2 focus:ring-[#11542e]">
                    <option value="" data-i18n="filter_all_roles">All Roles</option>
                    <option value="Admin">Admin</option>
                    <option value="MAO">MAO</option>
                    <option value="Technician">Technician</option>
                    <option value="Farmer">Farmer</option>
                </select>
                <button onclick="loadLogs()" class="bg-[#11542e] text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-green-800 transition-all">
                    <i class="fa-solid fa-sync mr-1"></i> <span data-i18n="btn_refresh">Refresh</span>
                </button>
                <div class="flex items-center gap-1.5 text-xs font-bold text-gray-400 sm:pl-3 sm:border-l border-gray-100">

                                    <th class="px-3 md:px-6 py-4 text-[10px] font-black text-gray-400 uppercase tracking-widest" data-i18n="th_user">User</th>
                                    <th class="hidden md:table-cell px-6 py-4 text-[10px] font-black text-gray-400 uppercase tracking-widest" data-i18n="th_role">Role</th>

                                    <th class="px-3 md:px-6 py-4 text-[10px] font-black text-gray-400 uppercase tracking-widest" data-i18n="label_description">Description</th>

                                </tr>

                    </div>
                    <div class="px-6 py-5 border-t border-gray-100 flex flex-col items-center gap-3">
                        <div class="flex items-center gap-3">
                            <button id="prevPageBtn" onclick="goToPage(currentPage - 1)" class="w-9 h-9 flex items-center justify-center rounded-lg border border-[#11542e] text-[#11542e] hover:bg-[#11542e] hover:text-white transition-colors disabled:opacity-30 disabled:cursor-not-allowed disabled:hover:bg-transparent disabled:hover:text-[#11542e]">
                                <i class="fa-solid fa-chevron-left text-xs"></i>
                            </button>
                            <span id="pageIndicator" class="text-xs font-black text-gray-700 px-2">Page 1 of 1</span>
                            <button id="nextPageBtn" onclick="goToPage(currentPage + 1)" class="w-9 h-9 flex items-center justify-center rounded-lg border border-[#11542e] text-[#11542e] hover:bg-[#11542e] hover:text-white transition-colors disabled:opacity-30 disabled:cursor-not-allowed disabled:hover:bg-transparent disabled:hover:text-[#11542e]">
                                <i class="fa-solid fa-chevron-right text-xs"></i>
                            </button>
                        </div>
                        <p id="paginationSummary" class="text-xs text-gray-400 font-bold"></p>
                    </div>
                </div>

            </div>
        </main>

                action_reject_report: "Tanggihan ang Ulat", action_archive_report: "I-archive ang Ulat", action_assign_technician: "Magtalaga ng Technician",
                action_add_crop: "Magdagdag ng Pananim", action_update_crop: "I-update ang Pananim", action_remove_crop: "Alisin ang Pananim",

                label_description: "Deskripsyon", th_module: "Module", th_ip_address: "IP Address",
                no_logs_found: "Walang nahanap na log.", label_system: "Sistema",
                action_login: "Login", action_submit_report: "Isumite ang Ulat", action_edit_report: "I-edit ang Ulat",
                action_validate_report: "Patunayan ang Ulat", action_approve_report: "Aprubahan ang Ulat", action_mark_claimed: "Markahan bilang Na-claim",

                sw_session_expired_title: "Nag-expire ang Session", sw_session_expired_text: "Na-log out ka dahil sa 5 minuto ng hindi paggamit.",
                sw_invalid_date_title: "Maling Saklaw ng Petsa", sw_invalid_date_text: "Hindi maaaring mauna ang petsa sa 'Mula' kaysa sa 'Hanggang'. Nabura ang filter.",
                sw_date_bounds_title: "Hindi Wastong Petsa", sw_date_bounds_text: "Pumili ng petsa sa pagitan ng Enero 2024 at ngayon. Nabura ang filter."
            }
        };

        // Raw Action values are stored in English in the audit log DB regardless
        // of UI language — this only translates what's *displayed* in the badge.
        function auditActionLabel(action) {
            const map = {
                'Login': 'action_login', 'Submit Report': 'action_submit_report', 'Edit Report': 'action_edit_report',
                'Validate Report': 'action_validate_report', 'Approve Report': 'action_approve_report', 'Mark as Claimed': 'action_mark_claimed',
                'Submit Inspection': 'action_submit_inspection',
                'Logout': 'action_logout', 'Failed Login': 'action_failed_login',
                'Create User': 'action_create_user', 'Update User': 'action_update_user', 'Deactivate User': 'action_deactivate_user',
                'Reject Report': 'action_reject_report', 'Archive Report': 'action_archive_report', 'Assign Technician': 'action_assign_technician',
                'Add Crop': 'action_add_crop', 'Update Crop': 'action_update_crop', 'Remove Crop': 'action_remove_crop',
                'Add Item': 'action_add_item', 'Update Item': 'action_update_item', 'Deactivate Item': 'action_deactivate_item',
                'Delete Report': 'action_delete_report', 'Return to Technician': 'action_return_tech', 'Edit Inspection': 'action_edit_inspection',
                'Request Seeds': 'action_request_seeds', 'Approve Seed Request': 'action_approve_seed', 'Reject Seed Request': 'action_reject_seed',
                'Seeds Ready for Pickup': 'action_seeds_ready', 'Seeds Claimed': 'action_seeds_claimed',
                'Add Farm': 'action_add_farm', 'Update Farm': 'action_update_farm', 'Archive Farm': 'action_archive_farm'
            };
            return map[action] ? t(map[action]) : action;
        }

        // Called automatically by i18n.js whenever the user picks a new language
        function onLanguageChange() {
            loadLogs(currentPage); // re-fetches the SAME page with translated action labels
        }

        let currentPage = 1;
        let totalPages  = 1;
        let searchDebounceTimer;

        document.addEventListener('DOMContentLoaded', () => {
            loadLogs(1);
            document.getElementById('searchInput').addEventListener('input', () => {
                clearTimeout(searchDebounceTimer);
                searchDebounceTimer = setTimeout(() => loadLogs(1), 400);
            });
            const todayStr = (() => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); })();
            const earliestStr = '2024-01-01';
            ['dateFrom', 'dateTo'].forEach(id => {
                const el = document.getElementById(id);
                if (el) { el.max = todayStr; el.min = earliestStr; }
            });
        });

        function clearFilters() {
            document.getElementById('moduleFilter').value = '';
            document.getElementById('roleFilter').value   = '';
            document.getElementById('searchInput').value  = '';
            document.getElementById('dateFrom').value     = '';
            document.getElementById('dateTo').value       = '';
            loadLogs(1);
        }

        function goToPage(page) {
            if (page < 1 || page > totalPages) return;
            loadLogs(page);
        }

        async function loadLogs(page) {
            currentPage = page || currentPage;

            const module = document.getElementById('moduleFilter').value;
            const role   = document.getElementById('roleFilter').value;
            const search = document.getElementById('searchInput').value.trim();
            let from = document.getElementById('dateFrom').value;
            let to   = document.getElementById('dateTo').value;

            const todayStr = (() => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); })();
            const earliestStr = '2024-01-01';
            if ((from && (from > todayStr || from < earliestStr)) || (to && (to > todayStr || to < earliestStr))) {
                Swal.fire({ icon: 'warning', title: t('sw_date_bounds_title'), text: t('sw_date_bounds_text'), confirmButtonColor: '#11542e' });
                document.getElementById('dateFrom').value = '';
                document.getElementById('dateTo').value = '';
                from = '';
                to = '';
            } else if (from && to && from > to) {
                Swal.fire({ icon: 'warning', title: t('sw_invalid_date_title'), text: t('sw_invalid_date_text'), confirmButtonColor: '#11542e' });
                from = '';
                to = '';
            }

            const params = new URLSearchParams({ page: currentPage, per_page: 15 });
            if (module) params.append('module', module);
            if (role)   params.append('role', role);
            if (search) params.append('search', search);
            if (from)   params.append('date_from', from);
            if (to)     params.append('date_to', to);

            const url = `../../api/audit/get_logs.php?${params.toString()}`;

            try {
                const res  = await fetch(url);
                const data = await res.json();

                if (data.status === 'success') {
                    renderLogs(data.data);
                    updateStats(data.stats);
                    updatePagination(data);
                }
            } catch(e) { console.error('Failed to load logs', e); }
        }

        function updateStats(stats) {
            document.getElementById('statTotal').innerText   = stats.total_actions;
            document.getElementById('statLogins').innerText  = stats.logins_today;
            document.getElementById('statReports').innerText = stats.reports_submitted;
            document.getElementById('statAid').innerText     = stats.aid_actions;
        }

        function updatePagination(data) {
            totalPages = data.total_pages;
            document.getElementById('pageIndicator').innerText = `Page ${data.page} of ${data.total_pages}`;
            document.getElementById('prevPageBtn').disabled = data.page <= 1;
            document.getElementById('nextPageBtn').disabled = data.page >= data.total_pages;

            const start = data.total_count === 0 ? 0 : ((data.page - 1) * data.per_page) + 1;
            const end   = Math.min(data.page * data.per_page, data.total_count);
            document.getElementById('paginationSummary').innerText = `Showing ${start}–${end} of ${data.total_count} logs`;
        }

        function renderLogs(data) {
            const tbody = document.getElementById('logTableBody');
            if (!data.length) {
                tbody.innerHTML = `<tr><td colspan="7" class="px-3 md:px-6 py-12 text-center text-gray-400 italic">${t('no_logs_found')}</td></tr>`;
                return;
            }

            const actionColors = {
                'Login':           'bg-blue-100 text-blue-700',
                'Submit Report':   'bg-green-100 text-green-700',
                'Edit Report':     'bg-amber-100 text-amber-700',
                'Validate Report': 'bg-purple-100 text-purple-700',
                'Approve Report':  'bg-green-100 text-green-700',
                'Mark as Claimed': 'bg-indigo-100 text-indigo-700',
                'Failed Login':    'bg-red-100 text-red-700',
                'Reject Report':   'bg-red-100 text-red-700',
                'Deactivate User': 'bg-red-100 text-red-700',
                'Assign Technician': 'bg-teal-100 text-teal-700',
                'Update Item':     'bg-amber-100 text-amber-700',
                'Update Crop':     'bg-amber-100 text-amber-700',
                'Delete Report':   'bg-red-100 text-red-700',
                'Archive Report':  'bg-gray-200 text-gray-700',
                'Return to Technician': 'bg-amber-100 text-amber-700',
                'Edit Inspection': 'bg-amber-100 text-amber-700',
                'Request Seeds':   'bg-green-100 text-green-700',
                'Approve Seed Request': 'bg-green-100 text-green-700',
                'Reject Seed Request':  'bg-red-100 text-red-700',
                'Seeds Ready for Pickup': 'bg-purple-100 text-purple-700',
                'Seeds Claimed':   'bg-indigo-100 text-indigo-700',
                'Add Farm':        'bg-green-100 text-green-700',
                'Update Farm':     'bg-amber-100 text-amber-700',
                'Archive Farm':    'bg-gray-200 text-gray-700',
            };

            // Every value is escaped: descriptions carry names typed by users and
            // admins (people, crops, relief items), so they must never be parsed as HTML.
            tbody.innerHTML = data.map(log => {
                const badge = actionColors[log.Action] || 'bg-gray-100 text-gray-600';
                const date  = new Date(log.Created_At).toLocaleString();
                return `
                <tr class="hover:bg-gray-50/50 transition-colors">
                    <td class="md:hidden px-4 py-3">
                        <div class="flex items-start justify-between gap-2">
                            <p class="text-xs font-bold text-gray-800">${escapeHtml(log.user_name || t('label_system'))} <span class="font-semibold text-gray-400">· ${escapeHtml(log.user_role)}</span></p>
                            <span class="flex-shrink-0 px-2 py-1 rounded-full text-[10px] font-black uppercase whitespace-nowrap ${badge}">${escapeHtml(auditActionLabel(log.Action))}</span>
                        </div>
                        <p class="mt-1 text-xs text-gray-600 break-words">${escapeHtml(log.Description)}</p>
                        <p class="mt-1 text-[10px] text-gray-400">${date}</p>
                    </td>
                    <td class="hidden md:table-cell px-3 md:px-6 py-3 text-xs text-gray-500 whitespace-nowrap">${date}</td>
                    <td class="hidden md:table-cell px-3 md:px-6 py-3 text-xs font-bold text-gray-800">${escapeHtml(log.user_name || t('label_system'))}</td>
                    <td class="hidden md:table-cell px-6 py-3">
                        <span class="px-2 py-1 bg-gray-100 text-gray-600 rounded-full text-[9px] font-black uppercase">${escapeHtml(log.user_role)}</span>
                    </td>
                    <td class="hidden md:table-cell px-3 md:px-6 py-3">
                        <span class="px-2 py-1 rounded-full text-[9px] font-black uppercase ${badge}">${escapeHtml(auditActionLabel(log.Action))}</span>
                    </td>
                    <td class="hidden md:table-cell px-3 md:px-6 py-3 text-xs text-gray-600 max-w-[140px] md:max-w-xs truncate" title="${escapeHtml(log.Description)}">${escapeHtml(log.Description)}</td>
                    <td class="hidden md:table-cell px-6 py-3 text-xs text-gray-500">${escapeHtml(log.Module)}</td>
                    <td class="hidden md:table-cell px-6 py-3 text-xs font-mono text-gray-400">${escapeHtml(log.IP_Address)}</td>
                </tr>`;
            }).join('');
        }

        async function loadAdminNotifications() {
            try {
                const res = await fetch('../../api/dashboard/admin_notifications.php?action=fetch');
                const result = await res.json();
                if (result.status === 'success') {
                    renderNotificationList(result.data);
                    const badge = document.getElementById('notifBadge');
                    if (result.unread > 0) {
                        badge.textContent = result.unread > 9 ? '9+' : result.unread;
                        badge.classList.remove('hidden');
                    } else {
                        badge.classList.add('hidden');
                    }
                }
            } catch (e) { console.error('Failed to load notifications:', e); }
        }

        // Notification text embeds user-supplied names, and this list is built
        // with innerHTML - so the message must be rendered as literal text, never
        // parsed as markup. Registration is public, which made this a route to
        // stored XSS in staff browsers.
        function escapeHtml(s) {
            return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        function renderNotificationList(items) {
            const list = document.getElementById('notifList');
            if (!items || items.length === 0) {
                list.innerHTML = '<p class="text-xs text-gray-400 italic text-center py-8">No notifications yet.</p>';
                return;
            }
            list.innerHTML = items.map(n => `
                <div class="px-4 py-3 ${n.Is_Read == 0 ? 'bg-green-50/40' : ''} hover:bg-gray-50 transition-colors ${n.Redirect_URL ? 'cursor-pointer flex items-center justify-between gap-3' : ''}" ${n.Redirect_URL ? `onclick="window.location.href='${n.Redirect_URL}'"` : ''}>
                    <div class="min-w-0">
                        <p class="text-xs text-gray-700 leading-relaxed">${escapeHtml(n.Message)}</p>
                        <p class="text-[10px] text-gray-400 font-bold mt-1">${n.DateStr}</p>
                    </div>
                    ${n.Redirect_URL ? '<span class="flex-shrink-0 text-[9px] font-black text-white bg-[#11542e] px-2.5 py-1.5 rounded-full uppercase tracking-wide whitespace-nowrap flex items-center gap-1">View <i class="fa-solid fa-arrow-right"></i></span>' : ''}
                </div>
            `).join('');
        }

        function toggleNotificationPanel() {
            const panel = document.getElementById('notifPanel');
            const isHidden = panel.classList.contains('hidden');
            if (isHidden) {
                panel.classList.remove('hidden');
                fetch('../../api/dashboard/admin_notifications.php?action=read')
                    .then(() => { document.getElementById('notifBadge').classList.add('hidden'); });
            } else {
                panel.classList.add('hidden');
            }
        }

        document.addEventListener('click', (e) => {
            const panel = document.getElementById('notifPanel');
            const btn = document.getElementById('notifBellBtn');
            if (panel && !panel.classList.contains('hidden') && !panel.contains(e.target) && !btn.contains(e.target)) {
                panel.classList.add('hidden');
            }
        });

        function confirmLogout() {
            Swal.fire({ title: t('sw_logout_title'), icon: 'question', showCancelButton: true, confirmButtonColor: '#11542e' })
            .then(r => { if (r.isConfirmed) CropGuardSession.logout(); });
        }
        // The idle timeout lives in session_guard.js now.


    </script>
<script src="../../assets/js/navbar_admin.js?v=6"></script>
<script>
    // This is the cleanest way to initialize
    document.addEventListener('DOMContentLoaded', () => {
        loadAdminNavbar('logs'); 
        initI18n();
        loadAdminNotifications();
    });
</script>
