<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Farms | CropGuard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f0f2f0; }
        .sidebar-link { transition: all 0.2s ease; border-left: 3px solid transparent; }
        .sidebar-link.active { background: rgba(255,255,255,0.12); border-left-color: #f1c40f; }
        .sidebar-link:not(.active):hover { background: rgba(255,255,255,0.06); }
    </style>
</head>
<body class="h-screen flex overflow-hidden">

    <aside class="bg-[#11542e] w-64 min-h-screen flex flex-col shadow-2xl z-30 flex-shrink-0">
        <div class="p-6 border-b border-white/10 flex flex-col items-center gap-3">
            <div class="w-16 h-16 rounded-full bg-white/10 flex items-center justify-center border-2 border-white/20">
                <i class="fa-solid fa-seedling text-2xl text-[#f1c40f]"></i>
            </div>
            <div class="text-center">
                <h1 class="text-white text-base font-black tracking-tight">CropGuard</h1>
                <p class="text-white/40 text-[8px] uppercase tracking-[0.2em]">Farmer Portal</p>
            </div>
        </div>
        
<nav class="flex-1 px-3 py-6 space-y-1 overflow-y-auto">
            <a href="../profile/profile.html" class="sidebar-link flex items-center px-4 py-3 text-white/60 hover:text-white rounded-xl text-sm transition-all">
                <i class="fa-solid fa-user-circle mr-3 w-4"></i> My Profile
            </a>
            <a href="index.html" class="sidebar-link flex items-center px-4 py-3 text-white/60 hover:text-white rounded-xl text-sm transition-all">
                <i class="fa-solid fa-table-columns mr-3 w-4"></i> My Dashboard
            </a>
            <a href="my_farms.html" class="sidebar-link active flex items-center px-4 py-3 text-white rounded-xl font-semibold text-sm transition-all">
                <i class="fa-solid fa-map-location-dot mr-3 w-4 text-[#f1c40f]"></i> My Farms
            </a>
            <a href="request_seeds.html" class="sidebar-link flex items-center px-4 py-3 text-white/60 hover:text-white rounded-xl text-sm transition-all">
                <i class="fa-solid fa-leaf mr-3 w-4"></i> Request Seeds
            </a>
            <a href="../communication/index.html" class="sidebar-link flex items-center px-4 py-3 text-white/60 hover:text-white rounded-xl text-sm transition-all">
                <i class="fa-solid fa-message mr-3 w-4"></i> Communication
            </a>
        </nav>
    </aside>

    <div class="flex-1 flex flex-col h-screen overflow-hidden">
        <header class="h-16 flex items-center px-6 bg-white border-b border-gray-100 flex-shrink-0">
            <span class="text-base font-black text-gray-800">Registered Farm Locations</span>
        </header>

        <main class="flex-1 overflow-y-auto p-6 bg-[#f0f2f0]">
            <div class="max-w-6xl mx-auto">
                <div class="flex justify-between items-end mb-6">
                    <div>
                        <h2 class="text-2xl font-black text-gray-800 tracking-tight">Farm Directory</h2>
                        <p class="text-gray-400 text-sm">View and manage the exact coordinates and details of your registered land.</p>
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-gray-50/60 border-b border-gray-100">
                                <tr>
                                    <th class="px-6 py-4 text-[10px] font-black text-gray-400 uppercase tracking-widest">Location Details</th>
                                    <th class="px-6 py-4 text-[10px] font-black text-gray-400 uppercase tracking-widest">Land Info</th>
                                    <th class="px-6 py-4 text-[10px] font-black text-gray-400 uppercase tracking-widest">Main Crop</th>
                                    <th class="px-6 py-4 text-[10px] font-black text-gray-400 uppercase tracking-widest text-right">Coordinates</th>
                                </tr>
                            </thead>
                            <tbody id="farmTableBody" class="divide-y divide-gray-50">
                                <tr><td colspan="4" class="px-6 py-10 text-center text-gray-400 italic text-sm">Loading farms...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            fetch('../../api/dashboard/get_farm_locations.php')
                .then(res => res.json())
                .then(data => {
                    const tbody = document.getElementById('farmTableBody');
                    if (data.status === 'success') {
                        if (data.locations.length === 0) {
                            tbody.innerHTML = '<tr><td colspan="4" class="px-6 py-10 text-center text-gray-400 italic text-sm">You have no registered farm locations yet. Add one on your Dashboard!</td></tr>';
                            return;
                        }
                        
                        tbody.innerHTML = '';
                        data.locations.forEach(loc => {
                            // Format coordinates or show N/A
                            let coords = (loc.Latitude && loc.Longitude) 
                                ? `<a href="https://www.google.com/maps?q=${loc.Latitude},${loc.Longitude}" target="_blank" class="text-blue-500 hover:underline text-xs"><i class="fa-solid fa-location-crosshairs mr-1"></i> View on Map</a><br><span class="text-[10px] text-gray-400">${loc.Latitude}, ${loc.Longitude}</span>` 
                                : `<span class="text-[10px] text-gray-400 italic">No coordinates set</span>`;

                            tbody.innerHTML += `
                                <tr class="hover:bg-gray-50/60 transition-all">
                                    <td class="px-6 py-4">
                                        <p class="text-sm font-bold text-gray-800"><i class="fa-solid fa-map-pin text-red-500 mr-2"></i>Brgy. ${loc.Barangay || 'N/A'}</p>
                                        <p class="text-[10px] text-gray-500 mt-1">RSBA: ${loc.RSBA_Reference_No || 'Unregistered'}</p>
                                    </td>
                                    <td class="px-6 py-4">
                                        <p class="text-sm font-bold text-gray-700">${loc.Area_Size || '0.00'} Hectares</p>
                                        <span class="px-2 py-1 mt-1 inline-block bg-green-50 text-green-700 rounded-md text-[10px] font-bold border border-green-100">${loc.Land_Type || 'N/A'}</span>
                                    </td>
                                    <td class="px-6 py-4">
                                        <p class="text-sm font-bold text-gray-700">${loc.Crop_Name || 'Not Set'}</p>
                                        <p class="text-[10px] text-gray-500">Cycle: ${loc.Cropping_Period || 'N/A'}</p>
                                    </td>
                                    <td class="px-6 py-4 text-right">
                                        ${coords}
                                    </td>
                                </tr>
                            `;
                        });
                    }
                })
                .catch(err => console.error("Could not fetch farms:", err));
        });
// ── IDLE TIMEOUT: 5 minutes ───────────────────────────────────
let idleTimer;
function resetIdleTimer() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
        Swal.fire({ icon: 'warning', title: 'Session Expired', text: 'You have been logged out due to 5 minutes of inactivity.', confirmButtonColor: '#11542e', allowOutsideClick: false })
            .then(() => fetch('../../api/auth/logout.php').then(() => window.location.href = '../../auth.html'));
    }, 5 * 60 * 1000);
}
['mousemove','keypress','click','scroll','touchstart','touchmove'].forEach(ev => document.addEventListener(ev, resetIdleTimer));
resetIdleTimer();
    </script>
</body>
</html>
