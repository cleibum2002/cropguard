<nav class="flex-1 px-3 py-6 space-y-1 overflow-y-auto">

                        <h2 class="text-2xl font-black text-gray-800 tracking-tight" data-i18n="page_title">Farm Directory</h2>

                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">

    <script>
        const translations = {
            en: {
                nav_profile: "My Profile", nav_dashboard: "My Dashboard", nav_farms: "My Farms",
                nav_seeds: "Request Seeds", nav_comm: "Communication",
                header_title: "Registered Farm Locations",
                page_title: "Farm Directory", page_sub: "View and manage the exact coordinates and details of your registered land.",
                th_location: "Location Details", th_land_info: "Land Info", th_main_crop: "Main Crop", th_coordinates: "Coordinates",
                loading_farms: "Loading farms...",
                no_farms: "You have no registered farm locations yet. Add one on your Dashboard!",
                view_on_map: "View on Map", no_coords: "No coordinates set",
                brgy_prefix: "Brgy.", rsba_label: "RSBA:", unregistered: "Unregistered",
                hectares_label: "Hectares", not_set: "Not Set", cycle_label: "Cycle:", na_text: "N/A",
                opt_irrigated: "Irrigated", opt_rainfed: "Rainfed", opt_upland: "Upland",
                sw_session_expired_title: "Session Expired", sw_session_expired_text: "You have been logged out due to 5 minutes of inactivity."
            },
            tl: {
                nav_profile: "Aking Profile", nav_dashboard: "Aking Dashboard", nav_farms: "Aking mga Sakahan",
                nav_seeds: "Humiling ng Binhi", nav_comm: "Komunikasyon",
                header_title: "Mga Nakarehistrong Lokasyon ng Sakahan",
                page_title: "Direktoryo ng Sakahan", page_sub: "Tingnan at pamahalaan ang eksaktong coordinates at detalye ng iyong nakarehistrong lupa.",
                th_location: "Detalye ng Lokasyon", th_land_info: "Impormasyon ng Lupa", th_main_crop: "Pangunahing Pananim", th_coordinates: "Coordinates",
                loading_farms: "Nilo-load ang mga sakahan...",
                no_farms: "Wala ka pang nakarehistrong lokasyon ng sakahan. Magdagdag sa iyong Dashboard!",
                view_on_map: "Tingnan sa Mapa", no_coords: "Walang nakatakdang coordinates",
                brgy_prefix: "Brgy.", rsba_label: "RSBA:", unregistered: "Hindi Nakarehistro",
                hectares_label: "Ektarya", not_set: "Hindi Nakatakda", cycle_label: "Ikot:", na_text: "N/A",
                opt_irrigated: "May Patubig", opt_rainfed: "Umaasa sa Ulan", opt_upland: "Kabundukan",
                sw_session_expired_title: "Natapos na ang Session", sw_session_expired_text: "Na-log out ka dahil sa 5 minutong hindi paggamit."
            },
            ceb: {
                nav_profile: "Akong Profile", nav_dashboard: "Akong Dashboard", nav_farms: "Akong mga Uma",
                nav_seeds: "Pangayo og Binhi", nav_comm: "Komunikasyon",
                header_title: "Nakarehistro nga mga Lokasyon sa Uma",
                page_title: "Direktoryo sa Uma", page_sub: "Tan-awa ug dumalahi ang eksaktong coordinates ug detalye sa imong narehistro nga yuta.",
                th_location: "Detalye sa Lokasyon", th_land_info: "Impormasyon sa Yuta", th_main_crop: "Pangunang Tanom", th_coordinates: "Coordinates",
                loading_farms: "Ginaload ang mga uma...",
                no_farms: "Wala ka pay narehistro nga lokasyon sa uma. Pagdugang sa imong Dashboard!",
                view_on_map: "Tan-awa sa Mapa", no_coords: "Walay gitakda nga coordinates",
                brgy_prefix: "Brgy.", rsba_label: "RSBA:", unregistered: "Wala Marehistro",
                hectares_label: "Ektarya", not_set: "Wala Gitakda", cycle_label: "Ikot:", na_text: "N/A",
                opt_irrigated: "May Tubig", opt_rainfed: "Nagsalig sa Ulan", opt_upland: "Bungtod",
                sw_session_expired_title: "Nahuman na ang Session", sw_session_expired_text: "Na-log out ka tungod sa 5 minutos nga walay kalihukan."
            }
        };

        function landTypeLabel(val) {
            const map = { 'Irrigated': 'opt_irrigated', 'Rainfed': 'opt_rainfed', 'Upland': 'opt_upland' };
            return map[val] ? t(map[val]) : (val || t('na_text'));
        }

        function loadFarms() {
            fetch('../../api/dashboard/get_farm_locations.php')
                .then(res => res.json())
                .then(data => {
                    const tbody = document.getElementById('farmTableBody');
                    if (data.status === 'success') {
                        if (data.locations.length === 0) {
                            tbody.innerHTML = '<tr><td colspan="4" class="px-6 py-10 text-center text-gray-400 italic text-sm">' + t('no_farms') + '</td></tr>';
                            return;
                        }
                        
                        tbody.innerHTML = '';
                        data.locations.forEach(loc => {
                            // Format coordinates or show N/A
                            let coords = (loc.Latitude && loc.Longitude) 
                                ? `<a href="https://www.google.com/maps?q=${loc.Latitude},${loc.Longitude}" target="_blank" class="text-blue-500 hover:underline text-xs"><i class="fa-solid fa-location-crosshairs mr-1"></i> ${t('view_on_map')}</a><br><span class="text-[10px] text-gray-400">${loc.Latitude}, ${loc.Longitude}</span>` 
                                : `<span class="text-[10px] text-gray-400 italic">${t('no_coords')}</span>`;

                            tbody.innerHTML += `
                                <tr class="hover:bg-gray-50/60 transition-all">
                                    <td class="px-6 py-4">
                                        <p class="text-sm font-bold text-gray-800"><i class="fa-solid fa-map-pin text-red-500 mr-2"></i>${t('brgy_prefix')} ${loc.Barangay || t('na_text')}</p>
                                        <p class="text-[10px] text-gray-500 mt-1">${t('rsba_label')} ${loc.RSBA_Reference_No || t('unregistered')}</p>
                                    </td>
                                    <td class="px-6 py-4">
                                        <p class="text-sm font-bold text-gray-700">${loc.Area_Size || '0.00'} ${t('hectares_label')}</p>
                                        <span class="px-2 py-1 mt-1 inline-block bg-green-50 text-green-700 rounded-md text-[10px] font-bold border border-green-100">${landTypeLabel(loc.Land_Type)}</span>
                                    </td>
                                    <td class="px-6 py-4">
                                        <p class="text-sm font-bold text-gray-700">${loc.Crop_Name || t('not_set')}</p>
                                        <p class="text-[10px] text-gray-500">${t('cycle_label')} ${loc.Cropping_Period || t('na_text')}</p>
                                    </td>
                                    <td class="px-6 py-4 text-right">
                                        ${coords}
                                    </td>
                                </tr>
                            `;
                        });
                    }
                })
                .catch(err => console.error("Could not fetch farms:", err));
        }

        // Called automatically by i18n.js whenever the user picks a new language
        function onLanguageChange() {
            loadFarms();
        }

        document.addEventListener("DOMContentLoaded", loadFarms);

// ── IDLE TIMEOUT: 5 minutes ───────────────────────────────────
let idleTimer;
function resetIdleTimer() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
        Swal.fire({ icon: 'warning', title: t('sw_session_expired_title'), text: t('sw_session_expired_text'), confirmButtonColor: '#11542e', allowOutsideClick: false })
            .then(() => fetch('../../api/auth/logout.php').then(() => window.location.href = '../../auth.html'));
    }, 5 * 60 * 1000);
}
['mousemove','keypress','click','scroll','touchstart','touchmove'].forEach(ev => document.addEventListener(ev, resetIdleTimer));
resetIdleTimer();
    </script>
        <script>
        function checkUnreadMessages() {
            fetch('../../api/messages/get_unread.php')
                .then(res => res.json())
                .then(data => {
                    const dot = document.getElementById('commRedDot');
                    if (dot) dot.classList.toggle('hidden', !(data.status === 'success' && data.unread > 0));
                })
                .catch(() => {});
        }
        document.addEventListener('DOMContentLoaded', checkUnreadMessages);
    </script>
</body>
